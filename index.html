<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經研讀 PWA (進度強化版)</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; }
  :root { 
    --font-size: 20px; --bg: #fdfdfd; --text: #1a1a1a; --border: #e0e0e0; 
    --header-h: 75px; --sidebar-w: 300px; --highlight-color: #fff176; --accent: #2196f3; --book-accent: #4caf50;
  }
  body.dark { --bg: #121212; --text: #dcdcdc; --border: #333; --highlight-color: #f57f17; }
  body.sepia { --bg: #f4ecd8; --text: #5b4636; --border: #dcd0b9; --highlight-color: #ffd54f; }

  body { 
    margin: 0; font-family: system-ui, sans-serif; 
    font-size: var(--font-size); background: var(--bg); color: var(--text); transition: background 0.3s;
  }

  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 1000;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; flex: 1; }
  
  /* 全本進度條 (常駐頂部) */
  .progress-container { width: 100%; height: 5px; background: var(--border); }
  #overall-progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.5s ease; }

  /* 每卷書專屬進度條 */
  .book-progress-wrapper { margin-top: 10px; margin-bottom: 20px; background: var(--border); height: 4px; border-radius: 2px; overflow: hidden; }
  #book-progress-bar { height: 100%; background: var(--book-accent); width: 0%; transition: width 0.4s; }
  #book-progress-text { font-size: 14px; color: var(--book-accent); font-weight: bold; margin-bottom: 5px; }

  .btn-group { display: flex; gap: 5px; }
  header button { font-size: 13px; padding: 6px 10px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; }

  #layout { display: flex; margin-top: var(--header-h); }
  #drawer {
    width: var(--sidebar-w); height: calc(100vh - var(--header-h));
    position: fixed; left: 0; background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto;
    transition: transform 0.3s ease; z-index: 999;
  }
  main { flex: 1; padding: 20px 15px 80px; max-width: 800px; margin: 0 auto; }

  @media (min-width: 1024px) { #drawer { transform: translateX(0) !important; } main { margin-left: var(--sidebar-w); } #menu-toggle { display: none; } }
  @media (max-width: 1023px) { #drawer { transform: translateX(-100%); } #drawer.open { transform: translateX(0); } }

  .drawer-section { padding: 15px 15px 5px; font-weight: bold; font-size: 14px; color: var(--accent); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); }
  
  .verse-wrapper { margin-bottom: 8px; border-bottom: 1px dotted var(--border); padding-bottom: 8px; }
  .verse { padding: 8px; border-radius: 6px; line-height: 1.8; display: flex; align-items: flex-start; }
  .verse.hl { background-color: var(--highlight-color); color: #000 !important; }
  .verse strong { color: #c62828; margin-right: 10px; font-size: 0.85em; cursor: pointer; min-width: 25px; user-select: none; }
  .verse span { flex: 1; cursor: pointer; }
  
  .v-note-input {
    width: 100%; height: 0; opacity: 0; overflow: hidden; background: rgba(0,0,0,0.04); border: none; border-radius: 4px; padding: 0 10px;
    font-size: 15px; color: var(--text); resize: none; transition: all 0.3s ease;
  }
  .v-note-input.active { height: 100px; opacity: 1; padding: 10px; border: 1px solid var(--border); margin-top: 8px; }
  .has-note-icon::after { content: ' 📝'; font-size: 12px; }

  /* 讀完勾選區 UI */
  .finish-chapter-box { 
    margin: 30px 0; padding: 20px; background: rgba(76, 175, 80, 0.08); 
    border: 1px solid var(--book-accent); border-radius: 8px; text-align: center;
  }
  .read-checkbox { transform: scale(1.5); margin-right: 10px; cursor: pointer; }

  #notes-area { margin-top: 40px; padding: 15px; border: 2px solid var(--border); border-radius: 8px; }
  #notes-input { width: 100%; height: 120px; background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px; margin-top: 10px; }
  .book-btn, .chapter-btn { width: 100%; padding: 14px; border: none; background: none; text-align: left; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; }
  .chapter-btn.completed::after { content: ' ✅'; float: right; }
  .chapter-nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="btn-group">
      <button id="menu-toggle" onclick="toggleMenu()">☰ 目錄</button>
      <button onclick="changeTheme('sepia')">🌾 護眼</button>
      <button onclick="changeTheme('dark')">🌙 深色</button>
    </div>
    <div id="overall-progress-text" style="font-size: 12px; font-weight: bold;">全書進度: 0%</div>
    <div class="btn-group">
      <button onclick="exportData()">💾 匯出</button>
      <button onclick="document.getElementById('importFile').click()">🔄 匯入</button>
      <input type="file" id="importFile" style="display:none" onchange="handleFile(this)">
    </div>
  </div>
  <div class="progress-container"><div id="overall-progress-bar"></div></div>
</header>

<div id="layout">
  <nav id="drawer">
    <div style="padding:10px; border-bottom:1px solid var(--border); background: var(--bg); position: sticky; top:0; z-index:11;">
      <input type="text" id="search-input" placeholder="全文搜尋..." style="width:100%; padding:8px; border-radius:4px; border:1px solid var(--border); background:transparent; color:var(--text);">
    </div>
    <div id="drawer-content"></div>
  </nav>
  <main id="content">讀取中...</main>
</div>

<script src="./books.js"></script>
<script>
let bible = {};
let currentBook = null, currentChapter = null;

/* 主題設定 */
function applyTheme() {
  const t = localStorage.getItem('userTheme') || 'default';
  document.body.classList.remove('dark', 'sepia');
  if(t !== 'default') document.body.classList.add(t);
}
function changeTheme(t) {
  const b = document.body; let active = 'default';
  if(t==='dark') { b.classList.toggle('dark'); b.classList.remove('sepia'); if(b.classList.contains('dark')) active='dark'; }
  else { b.classList.toggle('sepia'); b.classList.remove('dark'); if(b.classList.contains('sepia')) active='sepia'; }
  localStorage.setItem('userTheme', active);
}
applyTheme();

/* 進度計算核心 */
function refreshProgressUI() {
  let globalDone = 0;
  for(let i=0; i<localStorage.length; i++) {
    if(localStorage.key(i).startsWith('prog_') && localStorage.getItem(localStorage.key(i)) === 'true') globalDone++;
  }
  const globalPercent = ((globalDone / 1189) * 100).toFixed(1);
  document.getElementById('overall-progress-bar').style.width = globalPercent + '%';
  document.getElementById('overall-progress-text').textContent = `全書進度: ${globalPercent}% (${globalDone}/1189 章)`;

  // 如果正在閱讀某卷書，更新卷進度條
  if(currentBook) {
    const bookTotal = Object.keys(bible[currentBook]).length;
    let bookDone = 0;
    Object.keys(bible[currentBook]).forEach(ch => {
      if(localStorage.getItem(`prog_${currentBook}_${ch}`) === 'true') bookDone++;
    });
    const bookPercent = ((bookDone / bookTotal) * 100).toFixed(0);
    const bar = document.getElementById('book-progress-bar');
    const txt = document.getElementById('book-progress-text');
    if(bar && txt) {
      bar.style.width = bookPercent + '%';
      txt.textContent = `${BOOKS[currentBook]} 已完成 ${bookPercent}% (${bookDone}/${bookTotal} 章)`;
    }
  }
}

fetch('./bible.txt').then(r => r.text()).then(text => {
  text.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    const chNum = parseInt(ch);
    bible[b] ??= {}; bible[b][chNum] ??= [];
    bible[b][chNum].push({ v, verse });
  });
  renderBooks(); autoResume(); refreshProgressUI();
});

function showChapter(book, ch) {
  currentBook = book; currentChapter = ch;
  localStorage.setItem('lastRead', JSON.stringify({book, ch}));
  document.getElementById('drawer').classList.remove('open');
  window.scrollTo(0,0);

  const isDone = localStorage.getItem(`prog_${book}_${ch}`) === 'true';
  const hls = JSON.parse(localStorage.getItem(`hl_${book}_${ch}`) || "[]");

  // 卷書標題與專屬進度條
  let html = `<div>
                <div id="book-progress-text">${BOOKS[book]} 進度</div>
                <div class="book-progress-wrapper"><div id="book-progress-bar"></div></div>
                <h2 style="margin-top:0;">${BOOKS[book]} 第 ${ch} 章</h2>
              </div>`;

  // 經文內容
  html += bible[book][ch].map(v => {
    const isHl = hls.includes(v.v) ? 'hl' : '';
    const vNote = localStorage.getItem(`vnote_${book}_${ch}_${v.v}`) || "";
    return `<div class="verse-wrapper">
              <div class="verse ${isHl} ${vNote?'has-note-icon':''}" id="v-${v.v}">
                <strong onclick="toggleHighlight('${v.v}')">${v.v}</strong>
                <span onclick="toggleNoteField('${v.v}')">${v.verse}</span>
              </div>
              <textarea class="v-note-input" id="input-${v.v}" placeholder="寫下對此節的筆記..." 
                oninput="saveVerseNote('${v.v}', this)">${vNote}</textarea>
            </div>`;
  }).join('');

  // 章節末尾：已讀選項、導航、本章總筆記
  html += `
    <div class="finish-chapter-box">
      <label style="cursor:pointer; font-size:1.2em; font-weight:bold;">
        <input type="checkbox" class="read-checkbox" onchange="toggleProgress('${book}',${ch},this)" ${isDone?'checked':''}> 
        我已讀完本章經文
      </label>
    </div>

    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>

    <div id="notes-area">
      <h4>📝 本章總結筆記</h4>
      <textarea id="notes-input" oninput="saveChapterNote()" placeholder="寫下這一章的整體心得..."></textarea>
    </div>`;
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('notes-input').value = localStorage.getItem(`note_${book}_${ch}`) || "";
  refreshProgressUI(); 
  renderChapters(book);
}

function toggleProgress(book, ch, el) {
  localStorage.setItem(`prog_${book}_${ch}`, el.checked);
  refreshProgressUI();
  renderChapters(book); // 更新側欄 ✅
}

/* 目錄渲染 (分開新舊約) */
function renderBooks() {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = '';
  const books = Object.keys(BOOKS);
  const addSection = (title, items) => {
    const div = document.createElement('div');
    div.className = 'drawer-section'; div.textContent = title;
    dr.appendChild(div);
    items.forEach(b => { if(bible[b]) dr.appendChild(createBookBtn(b)); });
  };
  addSection('舊約全書', books.slice(0, 39));
  addSection('新約全書', books.slice(39));
}

function createBookBtn(b) {
  const btn = document.createElement('button');
  btn.className = 'book-btn'; btn.textContent = BOOKS[b];
  btn.onclick = () => renderChapters(b);
  return btn;
}

function renderChapters(book) {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="background:rgba(0,0,0,0.05); font-weight:bold;">⬅ 返回卷目</button>`;
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const isDone = localStorage.getItem(`prog_${book}_${ch}`) === 'true';
    const btn = document.createElement('button');
    btn.className = `chapter-btn ${isDone ? 'completed' : ''}`;
    btn.textContent = `${BOOKS[book]} ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    dr.appendChild(btn);
  });
}

/* 功能函式 */
function toggleHighlight(vNum) {
  const el = document.getElementById(`v-${vNum}`);
  el.classList.toggle('hl');
  const key = `hl_${currentBook}_${currentChapter}`;
  let hls = JSON.parse(localStorage.getItem(key) || "[]");
  if(el.classList.contains('hl')) { if(!hls.includes(vNum)) hls.push(vNum); }
  else { hls = hls.filter(i => i !== vNum); }
  localStorage.setItem(key, JSON.stringify(hls));
}
function toggleNoteField(vNum) {
  const input = document.getElementById(`input-${vNum}`);
  input.classList.toggle('active');
  if(input.classList.contains('active')) input.focus();
}
function saveVerseNote(vNum, el) {
  const key = `vnote_${currentBook}_${currentChapter}_${vNum}`;
  if(el.value.trim()) {
    localStorage.setItem(key, el.value);
    document.getElementById(`v-${vNum}`).classList.add('has-note-icon');
  } else {
    localStorage.removeItem(key);
    document.getElementById(`v-${vNum}`).classList.remove('has-note-icon');
  }
}
function saveChapterNote() {
  localStorage.setItem(`note_${currentBook}_${currentChapter}`, document.getElementById('notes-input').value);
}
function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }
function autoResume() {
  const s = JSON.parse(localStorage.getItem('lastRead'));
  if(s && bible[s.book]) showChapter(s.book, s.ch);
}
function goPrev() {
  const chs = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chs.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chs[i-1]);
  const bks = Object.keys(BOOKS);
  const bi = bks.indexOf(currentBook);
  if (bi > 0) {
    const pb = bks[bi-1];
    const last = Math.max(...Object.keys(bible[pb]).map(Number));
    showChapter(pb, last);
  }
}
function goNext() {
  const chs = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chs.indexOf(currentChapter);
  if (i < chs.length-1) return showChapter(currentBook, chs[i+1]);
  const bks = Object.keys(BOOKS);
  const bi = bks.indexOf(currentBook);
  if (bi < bks.length-1) showChapter(bks[bi+1], 1);
}
function exportData() {
  const b = new Blob([JSON.stringify(localStorage)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = 'bible_pwa_study.json'; a.click();
}
function handleFile(input) {
  const r = new FileReader();
  r.onload = (e) => {
    const d = JSON.parse(e.target.result);
    localStorage.clear(); for(let k in d) localStorage.setItem(k, d[k]); location.reload();
  };
  r.readAsText(input.files[0]);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
</script>
</body>
</html>
