<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經學習工作台</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; }
  :root { 
    --font-size: 20px; --bg: #fdfdfd; --text: #1a1a1a; --border: #e0e0e0; 
    --header-h: 70px; --sidebar-w: 300px; --highlight-color: #fff176; --accent: #2196f3;
  }
  body.dark { --bg: #121212; --text: #dcdcdc; --border: #333; --highlight-color: #f57f17; }
  body.sepia { --bg: #f4ecd8; --text: #5b4636; --border: #dcd0b9; --highlight-color: #ffd54f; }

  body { 
    margin: 0; font-family: system-ui, sans-serif; 
    font-size: var(--font-size); background: var(--bg); color: var(--text); 
  }

  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 1000;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; flex: 1; }
  
  /* 進度條樣式 */
  .progress-container { width: 100%; height: 6px; background: var(--border); overflow: hidden; }
  #overall-progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.5s ease; }

  .btn-group { display: flex; gap: 5px; }
  header button { font-size: 13px; padding: 5px 8px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; }

  #layout { display: flex; margin-top: var(--header-h); }
  #drawer {
    width: var(--sidebar-w); height: calc(100vh - var(--header-h));
    position: fixed; left: 0; background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto;
    transition: transform 0.3s ease; z-index: 999;
  }
  main { flex: 1; padding: 20px 15px 80px; max-width: 800px; margin: 0 auto; }

  @media (min-width: 1024px) { #drawer { transform: translateX(0) !important; } main { margin-left: var(--sidebar-w); } #menu-toggle { display: none; } }
  @media (max-width: 1023px) { #drawer { transform: translateX(-100%); } #drawer.open { transform: translateX(0); } }

  /* 經文與筆記 */
  .verse-wrapper { margin-bottom: 10px; border-bottom: 1px dotted var(--border); padding-bottom: 10px; }
  .verse { padding: 8px; cursor: pointer; border-radius: 4px; line-height: 1.8; }
  .verse.hl { background-color: var(--highlight-color); color: #000; }
  .verse strong { color: #c62828; margin-right: 8px; font-size: 0.8em; }
  
  /* 逐句筆記輸入框 */
  .v-note-input {
    width: 95%; margin: 5px auto; display: block; background: rgba(0,0,0,0.03);
    border: 1px solid var(--border); border-radius: 4px; padding: 8px;
    font-size: 14px; color: var(--text); resize: none; display: none;
  }
  .v-note-input.active { display: block; }
  .has-note-icon::after { content: ' 📝'; font-size: 12px; }

  /* 章節狀態 */
  .chapter-btn.completed::after { content: ' ✅'; float: right; }
  .read-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #notes-area { margin-top: 40px; padding: 15px; border: 2px solid var(--border); border-radius: 8px; }
  #notes-input { width: 100%; height: 150px; background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="btn-group">
      <button id="menu-toggle" onclick="toggleMenu()">☰ 目錄</button>
      <button onclick="changeTheme('sepia')">🌾 護眼</button>
      <button onclick="changeTheme('dark')">🌙 深色</button>
    </div>
    <div id="progress-text" style="font-size: 12px; font-weight: bold;">總進度: 0%</div>
    <div class="btn-group">
      <button onclick="exportData()">💾 匯出</button>
      <button onclick="document.getElementById('importFile').click()">🔄 匯入</button>
      <input type="file" id="importFile" style="display:none" onchange="handleFile(this)">
    </div>
  </div>
  <div class="progress-container"><div id="overall-progress-bar"></div></div>
</header>

<div id="layout">
  <nav id="drawer">
    <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; gap:5px;">
      <input type="text" id="search-input" placeholder="搜尋..." style="flex:1; padding:5px;">
      <button onclick="executeSearch()">🔍</button>
    </div>
    <div id="drawer-content"></div>
  </nav>
  <main id="content">載入中...</main>
</div>

<script src="./books.js"></script>
<script>
let bible = {};
let currentBook = null, currentChapter = null;
let totalChapters = 1189; // 聖經總章數

/* 主題與初始化 */
function applyTheme() {
  const t = localStorage.getItem('userTheme') || 'default';
  document.body.classList.remove('dark', 'sepia');
  if(t !== 'default') document.body.classList.add(t);
}
function changeTheme(t) {
  const b = document.body; let active = 'default';
  if(t==='dark') { b.classList.toggle('dark'); b.classList.remove('sepia'); if(b.classList.contains('dark')) active='dark'; }
  else { b.classList.toggle('sepia'); b.classList.remove('dark'); if(b.classList.contains('sepia')) active='sepia'; }
  localStorage.setItem('userTheme', active);
}
applyTheme();

/* 進度條更新 */
function updateProgressBar() {
  let done = 0;
  for(let i=0; i<localStorage.length; i++) {
    if(localStorage.key(i).startsWith('prog_') && localStorage.getItem(localStorage.key(i)) === 'true') done++;
  }
  const percent = ((done / totalChapters) * 100).toFixed(1);
  document.getElementById('overall-progress-bar').style.width = percent + '%';
  document.getElementById('progress-text').textContent = `總進度: ${percent}%`;
}

/* 數據讀取 */
fetch('./bible.txt').then(r => r.text()).then(text => {
  text.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    const chNum = parseInt(ch);
    bible[b] ??= {}; bible[b][chNum] ??= [];
    bible[b][chNum].push({ v, verse });
  });
  renderBooks(); autoResume(); updateProgressBar();
});

function showChapter(book, ch) {
  currentBook = book; currentChapter = ch;
  localStorage.setItem('lastRead', JSON.stringify({book, ch}));
  document.getElementById('drawer').classList.remove('open');
  window.scrollTo(0,0);

  const isDone = localStorage.getItem(`prog_${book}_${ch}`) === 'true';
  const hls = JSON.parse(localStorage.getItem(`hl_${book}_${ch}`) || "[]");

  let html = `<div class="read-header">
                <h2>${BOOKS[book]} ${ch} 章</h2>
                <label style="font-size:14px;"><input type="checkbox" onchange="toggleProgress('${book}',${ch},this)" ${isDone?'checked':''}> 已讀完</label>
              </div>`;

  html += bible[book][ch].map(v => {
    const isHl = hls.includes(v.v) ? 'hl' : '';
    const vNote = localStorage.getItem(`vnote_${book}_${ch}_${v.v}`) || "";
    const hasNoteClass = vNote ? 'has-note-icon' : '';
    return `<div class="verse-wrapper">
              <div class="verse ${isHl} ${hasNoteClass}" id="v-${v.v}" onclick="handleVerseClick('${v.v}')">
                <strong>${v.v}</strong>${v.verse}
              </div>
              <textarea class="v-note-input" id="input-${v.v}" placeholder="寫下這句的筆記..." 
                oninput="saveVerseNote('${v.v}', this)">${vNote}</textarea>
            </div>`;
  }).join('');

  html += `<div class="chapter-nav"><button onclick="goPrev()">⬅ 上一章</button><button onclick="goNext()">下一章 ➡</button></div>
           <div id="notes-area"><h4>📝 本章總結筆記</h4><textarea id="notes-input" oninput="saveChapterNote()"></textarea></div>`;
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('notes-input').value = localStorage.getItem(`note_${book}_${ch}`) || "";
  renderChapters(book);
}

/* 逐句筆記邏輯 */
function handleVerseClick(vNum) {
  const input = document.getElementById(`input-${vNum}`);
  const isCurrentlyOpen = input.classList.contains('active');
  
  // 先關閉所有打開的輸入框 (可選)
  document.querySelectorAll('.v-note-input').forEach(el => el.classList.remove('active'));
  
  // 如果點擊的是高亮，則切換高亮；如果點擊的是為了寫筆記，則展開輸入框
  // 這裡我們設計為：點擊後展開筆記框，長按或雙擊則高亮 (或是點擊後展開，再點一次關閉)
  if(!isCurrentlyOpen) {
    input.classList.add('active');
    input.focus();
  } else {
    toggleHighlight(vNum); // 這裡可以自訂：第二次點擊變高亮或關閉
    input.classList.remove('active');
  }
}

function saveVerseNote(vNum, el) {
  const key = `vnote_${currentBook}_${currentChapter}_${vNum}`;
  if(el.value.trim()) {
    localStorage.setItem(key, el.value);
    document.getElementById(`v-${vNum}`).classList.add('has-note-icon');
  } else {
    localStorage.removeItem(key);
    document.getElementById(`v-${vNum}`).classList.remove('has-note-icon');
  }
}

/* 其他核心功能 */
function toggleHighlight(vNum) {
  const el = document.getElementById(`v-${vNum}`);
  el.classList.toggle('hl');
  const key = `hl_${currentBook}_${currentChapter}`;
  let hls = JSON.parse(localStorage.getItem(key) || "[]");
  if(el.classList.contains('hl')) { if(!hls.includes(vNum)) hls.push(vNum); }
  else { hls = hls.filter(i => i !== vNum); }
  localStorage.setItem(key, JSON.stringify(hls));
}

function saveChapterNote() {
  localStorage.setItem(`note_${currentBook}_${currentChapter}`, document.getElementById('notes-input').value);
}

function toggleProgress(book, ch, el) {
  localStorage.setItem(`prog_${book}_${ch}`, el.checked);
  renderChapters(book);
  updateProgressBar();
}

/* 導航與選單 (同前版) */
function renderBooks() {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = '<h3 style="padding:15px">目錄</h3>';
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button'); btn.className = 'book-btn';
    btn.textContent = BOOKS[b]; btn.onclick = () => renderChapters(b);
    dr.appendChild(btn);
  });
}
function renderChapters(book) {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = `<button class="book-btn" onclick="renderBooks()">⬅ 返回目錄</button>`;
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const isDone = localStorage.getItem(`prog_${book}_${ch}`) === 'true';
    const btn = document.createElement('button');
    btn.className = `chapter-btn ${isDone ? 'completed' : ''}`;
    btn.textContent = `${BOOKS[book]} ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    dr.appendChild(btn);
  });
}

function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }
function autoResume() {
  const saved = JSON.parse(localStorage.getItem('lastRead'));
  if(saved && bible[saved.book]) showChapter(saved.book, saved.ch);
}
function goPrev() { /* 邏輯同前 ... */ }
function goNext() { /* 邏輯同前 ... */ }
function exportData() { /* 邏輯同前 ... */ }
function handleFile(input) { /* 邏輯同前 ... */ }

</script>
</body>
</html>
