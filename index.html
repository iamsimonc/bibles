<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>聖經（和合本）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
:root {
  --font-size: 20px;
  --bg: #fafafa;
  --text: #000;
  --border: #ccc;
}

body.dark {
  --bg: #121212;
  --text: #e0e0e0;
  --border: #444;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system;
  font-size: var(--font-size);
  line-height: 1.8;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 56px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  z-index: 100;
}

header button { font-size: 18px; }

#drawer {
  position: fixed;
  top: 56px;
  left: 0;
  width: 260px;
  height: calc(100% - 56px);
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transform: translateX(-100%);
  transition: 0.3s;
}

#drawer.open { transform: translateX(0); }

.book-btn, .chapter-btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}

main {
  padding: 76px 16px 40px;
  word-break: break-word;
  overflow-wrap: break-word;
}

.verse { border-bottom: 1px dotted var(--border); padding: 6px 0; }

.chapter-nav {
  display: flex;
  justify-content: space-between;
  margin: 24px 0;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">☰</button>
  <button onclick="changeFont(-2)">A−</button>
  <button onclick="changeFont(2)">A+</button>
  <button onclick="toggleDark()">🌙</button>
</header>

<nav id="drawer"></nav>
<main id="content">載入中…</main>

<script src="books.js"></script>
<script>
const bible = {};
let currentBook = null;
let currentChapter = null;

const drawer = document.getElementById('drawer');
const content = document.getElementById('content');

/* UI */
function toggleMenu() { drawer.classList.toggle('open'); }
function changeFont(d) {
  let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
  s = Math.max(14, s + d);
  document.documentElement.style.setProperty('--font-size', s + 'px');
}
function toggleDark() { document.body.classList.toggle('dark'); }

/* Load Bible */
fetch('bible.txt')
.then(r => r.text())
.then(text => {
  text.split('\n').forEach(line => {
    const m = line.match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    bible[b] ??= {};
    bible[b][ch] ??= [];
    bible[b][ch].push({ v, verse });
  });
  renderBooks();
});

/* Menu from BOOKS order */
function renderBooks() {
  drawer.innerHTML = '';
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[b];
    btn.onclick = () => renderChapters(b);
    drawer.appendChild(btn);
  });
}

function renderChapters(book) {
  drawer.innerHTML = '';
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    drawer.appendChild(btn);
  });
}

function showChapter(book, ch) {
  currentBook = book;
  currentChapter = ch;
  drawer.classList.remove('open');

  content.innerHTML =
    bible[book][ch].map(v =>
      `<div class="verse"><strong>${v.v}</strong> ${v.verse}</div>`
    ).join('') + `
      <div class="chapter-nav">
        <button onclick="goPrev()">⬅ 上一章</button>
        <button onclick="goNext()">下一章 ➡</button>
      </div>`;
}

function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chapters[i-1]);

  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi > 0) {
    const pb = books[bi-1];
    const last = Math.max(...Object.keys(bible[pb]).map(Number));
    showChapter(pb, last);
  }
}

function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i < chapters.length-1) return showChapter(currentBook, chapters[i+1]);

  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi < books.length-1) {
    const nb = books[bi+1];
    showChapter(nb, 1);
  }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
</script>

</body>
</html>
