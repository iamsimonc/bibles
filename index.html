<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>聖經（和合本）</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; }
  :root { --font-size: 20px; --bg: #fafafa; --text: #000; --border: #ccc; --header-h: 60px; }
  body.dark { --bg: #1a1a1a; --text: #dcdcdc; --border: #333; }
  body { 
    margin: 0; font-family: system-ui, -apple-system, sans-serif; 
    font-size: var(--font-size); line-height: 1.8; 
    background: var(--bg); color: var(--text); 
  }
  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px; z-index: 100;
  }
  header button { 
    font-size: 18px; padding: 6px 12px; background: transparent; 
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
  }
  #drawer {
    position: fixed; top: var(--header-h); left: 0; width: 85%; max-width: 300px;
    height: calc(100% - var(--header-h)); background: var(--bg);
    border-right: 1px solid var(--border); overflow-y: auto;
    transform: translateX(-100%); transition: transform 0.3s ease; z-index: 99;
  }
  #drawer.open { transform: translateX(0); }
  .book-btn, .chapter-btn {
    width: 100%; padding: 16px; border: none; background: none;
    text-align: left; color: var(--text); border-bottom: 1px solid var(--border);
    font-size: 18px; cursor: pointer;
  }
  main { padding: calc(var(--header-h) + 20px) 20px 60px; max-width: 800px; margin: 0 auto; }
  .verse { border-bottom: 1px dotted var(--border); padding: 10px 0; }
  .verse strong { color: #c62828; margin-right: 8px; font-size: 0.9em; }
  body.dark .verse strong { color: #ffab91; }
  .chapter-nav { display: flex; justify-content: space-between; margin-top: 40px; }
  .chapter-nav button { padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .loading { text-align: center; margin-top: 50px; opacity: 0.7; }
</style>
</head>
<body>

<header>
  <button onclick="toggleMenu()">☰ 經卷</button>
  <button onclick="changeFont(-2)">A−</button>
  <button onclick="changeFont(2)">A+</button>
  <button onclick="toggleDark()">🌓 模式</button>
</header>

<nav id="drawer"></nav>
<main id="content"><div class="loading">正在載入聖經數據...</div></main>

<script src="./books.js"></script>
<script>
const bible = {};
let currentBook = null;
let currentChapter = null;

const drawer = document.getElementById('drawer');
const content = document.getElementById('content');

function toggleMenu() { drawer.classList.toggle('open'); }
function changeFont(d) {
  let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
  s = Math.max(14, s + d);
  document.documentElement.style.setProperty('--font-size', s + 'px');
}
function toggleDark() { document.body.classList.toggle('dark'); }

/* 核心解析邏輯 */
fetch('./bible.txt')
  .then(r => r.ok ? r.text() : Promise.reject("無法開啟 bible.txt"))
  .then(text => {
    text.split(/\r?\n/).forEach(line => {
      const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
      if (!m) return;
      const [, b, ch, v, verse] = m;
      const chNum = parseInt(ch);
      bible[b] ??= {};
      bible[b][chNum] ??= [];
      bible[b][chNum].push({ v, verse });
    });
    renderBooks();
    content.innerHTML = "數據載入完成，請點擊上方「經卷」開始閱讀。";
  })
  .catch(err => {
    content.innerHTML = "載入失敗：<br>" + err;
  });

function renderBooks() {
  drawer.innerHTML = '';
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[b];
    btn.onclick = () => renderChapters(b);
    drawer.appendChild(btn);
  });
}

function renderChapters(book) {
  drawer.scrollTo(0,0);
  drawer.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="background:rgba(0,0,0,0.1)">⬅ 返回卷目</button>`;
  const chapters = Object.keys(bible[book]).map(Number).sort((a,b)=>a-b);
  chapters.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `${BOOKS[book]} 第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    drawer.appendChild(btn);
  });
}

function showChapter(book, ch) {
  currentBook = book;
  currentChapter = ch;
  window.scrollTo(0,0);
  drawer.classList.remove('open');

  let html = `<h2>${BOOKS[book]} 第 ${ch} 章</h2>`;
  html += bible[book][ch].map(v => 
    `<div class="verse"><strong>${v.v}</strong>${v.verse}</div>`
  ).join('');
  
  html += `
    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>`;
  content.innerHTML = html;
}

function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chapters[i-1]);
  
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi > 0) {
    const prevBook = books[bi-1];
    const prevChapters = Object.keys(bible[prevBook]).map(Number).sort((a,b)=>a-b);
    showChapter(prevBook, prevChapters[prevChapters.length-1]);
  }
}

function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i < chapters.length-1) return showChapter(currentBook, chapters[i+1]);

  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi < books.length-1) {
    showChapter(books[bi+1], 1);
  }
}

/* Service Worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</body>
</html>
