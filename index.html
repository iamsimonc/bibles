<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經研讀 PWA</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; }
  :root { 
    --font-size: 20px; --bg: #fdfdfd; --text: #1a1a1a; --border: #e0e0e0; 
    --header-h: 60px; --sidebar-w: 280px; --highlight-color: #fff176;
  }
  body.dark { 
    --bg: #121212; --text: #dcdcdc; --border: #333; --highlight-color: #f57f17;
  }
  body.sepia { 
    --bg: #f4ecd8; --text: #5b4636; --border: #dcd0b9; --highlight-color: #ffd54f;
  }

  body { 
    margin: 0; font-family: "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif; 
    font-size: var(--font-size); line-height: 1.9; background: var(--bg); color: var(--text); 
  }

  /* 頂部導航 */
  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 15px; z-index: 1000;
  }

  .btn-group { display: flex; gap: 8px; }
  header button { 
    font-size: 16px; padding: 6px 12px; background: transparent; 
    border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer;
  }

  /* 側邊欄與主要內容佈局 */
  #layout { display: flex; margin-top: var(--header-h); }

  #drawer {
    width: var(--sidebar-w); height: calc(100vh - var(--header-h));
    position: fixed; left: 0; background: var(--bg);
    border-right: 1px solid var(--border); overflow-y: auto;
    transition: transform 0.3s ease; z-index: 999;
  }

  main { 
    flex: 1; padding: 20px 20px 80px; max-width: 800px; margin: 0 auto;
    transition: margin-left 0.3s ease;
  }

  /* 電腦版優化：螢幕寬度 > 1024px 時選單常駐 */
  @media (min-width: 1024px) {
    #drawer { transform: translateX(0) !important; }
    main { margin-left: var(--sidebar-w); }
    #menu-toggle { display: none; }
  }

  /* 手機版隱藏選單 */
  @media (max-width: 1023px) {
    #drawer { transform: translateX(-100%); }
    #drawer.open { transform: translateX(0); }
  }

  /* 經文樣式 */
  .verse { 
    padding: 10px; border-bottom: 1px dotted var(--border); 
    cursor: pointer; position: relative;
  }
  .verse.hl { background-color: var(--highlight-color); border-radius: 4px; color: #000; }
  .verse strong { color: #c62828; margin-right: 10px; font-size: 0.8em; }
  body.dark .verse strong { color: #ffab91; }

  /* 筆記區域 */
  #notes-area {
    margin-top: 40px; padding: 20px; border: 1px solid var(--border); border-radius: 8px;
  }
  #notes-input {
    width: 100%; height: 150px; background: transparent; color: var(--text);
    border: 1px solid var(--border); padding: 10px; font-size: 16px; border-radius: 4px;
  }

  .book-btn, .chapter-btn {
    width: 100%; padding: 15px; border: none; background: none;
    text-align: left; color: var(--text); border-bottom: 1px solid var(--border);
    font-size: 17px; cursor: pointer;
  }
  .chapter-nav { display: flex; justify-content: space-between; margin: 30px 0; }
</style>
</head>
<body>

<header>
  <div class="btn-group">
    <button id="menu-toggle" onclick="toggleMenu()">☰ 經卷</button>
    <button onclick="changeTheme('sepia')">🌾 護眼</button>
    <button onclick="changeTheme('dark')">🌙 深色</button>
  </div>
  <div class="btn-group">
    <button onclick="changeFont(-2)">A−</button>
    <button onclick="changeFont(2)">A+</button>
  </div>
</header>

<div id="layout">
  <nav id="drawer"></nav>
  <main id="content">載入中...</main>
</div>

<script src="./books.js"></script>
<script>
let bible = {};
let currentBook = null;
let currentChapter = null;

// 初始化 UI 狀態
function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }
function changeFont(d) {
  let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
  document.documentElement.style.setProperty('--font-size', Math.max(14, s + d) + 'px');
}
function changeTheme(t) {
  document.body.classList.toggle(t);
  if(t === 'dark') document.body.classList.remove('sepia');
  else document.body.classList.remove('dark');
}

// 數據載入
fetch('./bible.txt').then(r => r.text()).then(text => {
  text.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    const chNum = parseInt(ch);
    bible[b] ??= {};
    bible[b][chNum] ??= [];
    bible[b][chNum].push({ v, verse });
  });
  renderBooks();
  autoResume(); // 自動回到上次位置
});

function renderBooks() {
  const dr = document.getElementById('drawer');
  dr.innerHTML = '<h3 style="padding:15px">新舊約全書</h3>';
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[b];
    btn.onclick = () => renderChapters(b);
    dr.appendChild(btn);
  });
}

function renderChapters(book) {
  const dr = document.getElementById('drawer');
  dr.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="background:rgba(0,0,0,0.05)">⬅ 返回卷目</button>`;
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `${BOOKS[book]} 第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    dr.appendChild(btn);
  });
}

function showChapter(book, ch) {
  currentBook = book;
  currentChapter = ch;
  localStorage.setItem('lastRead', JSON.stringify({book, ch}));
  document.getElementById('drawer').classList.remove('open');
  window.scrollTo(0,0);

  // 取得 Highlight 紀錄
  const hlKey = `hl_${book}_${ch}`;
  let highlights = JSON.parse(localStorage.getItem(hlKey) || "[]");

  let html = `<h2>${BOOKS[book]} 第 ${ch} 章</h2>`;
  html += bible[book][ch].map(v => {
    const isHl = highlights.includes(v.v) ? 'hl' : '';
    return `<div class="verse ${isHl}" id="v-${v.v}" onclick="toggleHighlight('${v.v}')">
              <strong>${v.v}</strong>${v.verse}
            </div>`;
  }).join('');

  // 加入導航與筆記
  html += `
    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>
    <div id="notes-area">
      <h4>📝 本章筆記</h4>
      <textarea id="notes-input" placeholder="在這裡寫下心得..." oninput="saveNote()"></textarea>
    </div>`;
  
  document.getElementById('content').innerHTML = html;
  
  // 載入筆記內容
  const noteKey = `note_${book}_${ch}`;
  document.getElementById('notes-input').value = localStorage.getItem(noteKey) || "";
}

// 功能：Highlight
function toggleHighlight(vNum) {
  const el = document.getElementById(`v-${vNum}`);
  el.classList.toggle('hl');
  const hlKey = `hl_${currentBook}_${currentChapter}`;
  let highlights = JSON.parse(localStorage.getItem(hlKey) || "[]");
  
  if(el.classList.contains('hl')) {
    if(!highlights.includes(vNum)) highlights.push(vNum);
  } else {
    highlights = highlights.filter(i => i !== vNum);
  }
  localStorage.setItem(hlKey, JSON.stringify(highlights));
}

// 功能：儲存筆記
function saveNote() {
  const val = document.getElementById('notes-input').value;
  const noteKey = `note_${currentBook}_${currentChapter}`;
  localStorage.setItem(noteKey, val);
}

// 功能：自動恢復閱讀
function autoResume() {
  const saved = JSON.parse(localStorage.getItem('lastRead'));
  if(saved && bible[saved.book]) showChapter(saved.book, saved.ch);
  else document.getElementById('content').innerHTML = "請從左側選擇經卷開始閱讀";
}

// 導航邏輯 (goPrev, goNext 同前) ...
function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chapters[i-1]);
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi > 0) {
    const pb = books[bi-1];
    const last = Math.max(...Object.keys(bible[pb]).map(Number));
    showChapter(pb, last);
  }
}
function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i < chapters.length-1) return showChapter(currentBook, chapters[i+1]);
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi < books.length-1) showChapter(books[bi+1], 1);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
</body>
</html>
