<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經研讀 PWA (導航強化版)</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; }
  :root { 
    --font-size: 20px; --bg: #fdfdfd; --text: #1a1a1a; --border: #e0e0e0; 
    --header-h: 95px; --sidebar-w: 300px; --accent: #2196f3; --book-accent: #4caf50;
  }
  body.dark { --bg: #121212; --text: #dcdcdc; --border: #333; }
  body.sepia { --bg: #f4ecd8; --text: #5b4636; --border: #dcd0b9; }

  body { margin: 0; font-family: system-ui, sans-serif; font-size: var(--font-size); background: var(--bg); color: var(--text); }

  /* 雙層置頂 Header */
  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 1000;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; height: 50px; }
  .header-sub { display: flex; align-items: center; padding: 0 12px; height: 45px; background: rgba(0,0,0,0.02); border-top: 1px solid var(--border); }
  
  /* 進度條樣式 */
  .prog-bg { width: 100%; height: 4px; background: var(--border); position: absolute; bottom: 0; left: 0; }
  #global-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s; }
  #book-bar { height: 100%; background: var(--book-accent); width: 0%; transition: width 0.5s; }

  .btn-group { display: flex; gap: 5px; }
  header button { font-size: 13px; padding: 5px 8px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; }

  #layout { display: flex; margin-top: var(--header-h); }
  #drawer {
    width: var(--sidebar-w); height: calc(100vh - var(--header-h));
    position: fixed; left: 0; background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto; z-index: 999;
  }
  main { flex: 1; padding: 20px 15px 80px; max-width: 800px; margin: 0 auto; }

  /* Summary 總覽頁樣式 */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 20px; }
  .summary-card { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.02); cursor: pointer; }
  .summary-card h4 { margin: 0 0 5px; font-size: 16px; }
  .small-bar-bg { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .small-bar-fill { height: 100%; background: var(--book-accent); }

  /* 經文與筆記 (保留之前邏輯) */
  .verse-wrapper { margin-bottom: 8px; border-bottom: 1px dotted var(--border); padding-bottom: 8px; }
  .verse { padding: 8px; border-radius: 6px; line-height: 1.8; display: flex; }
  .verse.hl { background-color: #fff176; color: #000 !important; }
  .verse strong { color: #c62828; margin-right: 10px; cursor: pointer; min-width: 25px; }
  .v-note-input { width: 100%; height: 0; opacity: 0; overflow: hidden; transition: all 0.3s; background: rgba(0,0,0,0.04); border: none; }
  .v-note-input.active { height: 80px; opacity: 1; padding: 8px; border: 1px solid var(--border); margin-top: 5px; }
  
  .finish-chapter-box { margin: 30px 0; padding: 20px; background: rgba(76,175,80,0.1); border-radius: 8px; text-align: center; }
  .chapter-btn.completed::after { content: ' ✅'; float: right; }
  .chapter-nav { display: flex; justify-content: space-between; margin: 20px 0; }

  @media (max-width: 1023px) { 
    #drawer { transform: translateX(-100%); transition: transform 0.3s; }
    #drawer.open { transform: translateX(0); }
    main { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <button onclick="toggleMenu()">☰ 目錄</button>
    <div id="global-txt" style="font-size: 11px; font-weight: bold;">全書: 0%</div>
    <div class="btn-group">
      <button onclick="changeTheme('sepia')">🌾</button>
      <button onclick="changeTheme('dark')">🌙</button>
      <button onclick="exportData()">💾</button>
    </div>
    <div class="prog-bg"><div id="global-bar"></div></div>
  </div>
  <div class="header-sub">
    <div id="book-txt" style="font-size: 13px; font-weight: bold; color: var(--book-accent);">請選擇經卷...</div>
    <div class="prog-bg"><div id="book-bar"></div></div>
  </div>
</header>

<div id="layout">
  <nav id="drawer">
    <button class="book-btn" onclick="showSummary()" style="background: var(--accent); color: white; font-weight: bold;">📊 進度總覽 SUMMARY</button>
    <div id="drawer-content"></div>
  </nav>
  <main id="content">讀取中...</main>
</div>

<script src="./books.js"></script>
<script>
let bible = {};
let currentBook = null, currentChapter = null;

/* 初始化與主題 */
function applyTheme() {
  const t = localStorage.getItem('userTheme') || 'default';
  document.body.classList.remove('dark', 'sepia');
  if(t !== 'default') document.body.classList.add(t);
}
function changeTheme(t) {
  const b = document.body; let active = 'default';
  if(t==='dark') { b.classList.toggle('dark'); b.classList.remove('sepia'); if(b.classList.contains('dark')) active='dark'; }
  else { b.classList.toggle('sepia'); b.classList.remove('dark'); if(b.classList.contains('sepia')) active='sepia'; }
  localStorage.setItem('userTheme', active);
}
applyTheme();

/* 進度核心更新 */
function refreshProgressUI() {
  let globalDone = 0;
  for(let i=0; i<localStorage.length; i++) {
    if(localStorage.key(i).startsWith('prog_') && localStorage.getItem(localStorage.key(i)) === 'true') globalDone++;
  }
  const gPercent = ((globalDone / 1189) * 100).toFixed(1);
  document.getElementById('global-bar').style.width = gPercent + '%';
  document.getElementById('global-txt').textContent = `全書: ${gPercent}% (${globalDone}/1189)`;

  if(currentBook && bible[currentBook]) {
    const chs = Object.keys(bible[currentBook]);
    let bDone = 0;
    chs.forEach(c => { if(localStorage.getItem(`prog_${currentBook}_${c}`) === 'true') bDone++; });
    const bPercent = ((bDone / chs.length) * 100).toFixed(0);
    document.getElementById('book-bar').style.width = bPercent + '%';
    document.getElementById('book-txt').textContent = `${BOOKS[currentBook]}: ${bPercent}% (${bDone}/${chs.length})`;
  }
}

fetch('./bible.txt').then(r => r.text()).then(text => {
  text.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    const chNum = parseInt(ch);
    bible[b] ??= {}; bible[b][chNum] ??= [];
    bible[b][chNum].push({ v, verse });
  });
  renderBooks(); autoResume(); refreshProgressUI();
});

/* 新增：進度總覽頁面 */
function showSummary() {
  currentBook = null;
  document.getElementById('drawer').classList.remove('open');
  let html = `<h2>📊 閱讀進度總覽</h2><div class="summary-grid">`;
  
  Object.keys(BOOKS).forEach(b => {
    if(!bible[b]) return;
    const chs = Object.keys(bible[b]);
    let done = 0;
    chs.forEach(c => { if(localStorage.getItem(`prog_${b}_${c}`) === 'true') done++; });
    const pc = ((done / chs.length) * 100).toFixed(0);
    
    html += `
      <div class="summary-card" onclick="renderChapters('${b}')">
        <h4>${BOOKS[b]}</h4>
        <div style="font-size:12px; margin-bottom:5px;">${done}/${chs.length} 章 (${pc}%)</div>
        <div class="small-bar-bg"><div class="small-bar-fill" style="width:${pc}%"></div></div>
      </div>`;
  });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
  document.getElementById('book-txt').textContent = "進度總覽";
  document.getElementById('book-bar').style.width = "0%";
}

function showChapter(book, ch) {
  currentBook = book; currentChapter = ch;
  localStorage.setItem('lastRead', JSON.stringify({book, ch}));
  document.getElementById('drawer').classList.remove('open');
  window.scrollTo(0,0);

  const isDone = localStorage.getItem(`prog_${book}_${ch}`) === 'true';
  const hls = JSON.parse(localStorage.getItem(`hl_${book}_${ch}`) || "[]");

  let html = `<h3>${BOOKS[book]} 第 ${ch} 章</h3>`;
  html += bible[book][ch].map(v => {
    const vNote = localStorage.getItem(`vnote_${book}_${ch}_${v.v}`) || "";
    return `<div class="verse-wrapper">
              <div class="verse ${hls.includes(v.v)?'hl':''} ${vNote?'has-note-icon':''}" id="v-${v.v}">
                <strong onclick="toggleHighlight('${v.v}')">${v.v}</strong>
                <span onclick="toggleNoteField('${v.v}')">${v.verse}</span>
              </div>
              <textarea class="v-note-input" id="input-${v.v}" oninput="saveVerseNote('${v.v}', this)">${vNote}</textarea>
            </div>`;
  }).join('');

  html += `
    <div class="finish-chapter-box">
      <label style="cursor:pointer; font-weight:bold;">
        <input type="checkbox" style="transform:scale(1.3)" onchange="toggleProgress('${book}',${ch},this)" ${isDone?'checked':''}> 已讀完本章
      </label>
    </div>
    <div class="chapter-nav"><button onclick="goPrev()">⬅ 上一章</button><button onclick="goNext()">下一章 ➡</button></div>
    <textarea id="notes-input" style="width:100%;height:100px;margin-top:20px;" oninput="saveChapterNote()" placeholder="本章筆記..."></textarea>`;
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('notes-input').value = localStorage.getItem(`note_${book}_${ch}`) || "";
  refreshProgressUI(); renderChapters(book);
}

function toggleProgress(book, ch, el) {
  localStorage.setItem(`prog_${book}_${ch}`, el.checked);
  refreshProgressUI(); renderChapters(book);
}

/* 目錄渲染 (分卷與分章) */
function renderBooks() {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = '';
  const books = Object.keys(BOOKS);
  const addSec = (t, start, end) => {
    const d = document.createElement('div'); d.className = 'drawer-section'; d.textContent = t;
    dr.appendChild(d);
    books.slice(start, end).forEach(b => { if(bible[b]) dr.appendChild(createBtn(b)); });
  };
  addSec('舊約', 0, 39); addSec('新約', 39, 66);
}
function createBtn(b) {
  const btn = document.createElement('button'); btn.className = 'book-btn'; btn.style.width="100%";
  btn.textContent = BOOKS[b]; btn.onclick = () => renderChapters(b); return btn;
}
function renderChapters(book) {
  const dr = document.getElementById('drawer-content');
  dr.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="width:100%;background:#eee;">⬅ 返回卷目</button>`;
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const btn = document.createElement('button'); btn.className = `chapter-btn ${localStorage.getItem(`prog_${book}_${ch}`)==='true'?'completed':''}`;
    btn.style.width="100%"; btn.textContent = `${BOOKS[book]} ${ch}章`; btn.onclick = () => showChapter(book, ch);
    dr.appendChild(btn);
  });
}

/* 其餘邏輯 (Highlight, Note, Nav, Export) */
function toggleHighlight(v) {
  const el = document.getElementById(`v-${v}`); el.classList.toggle('hl');
  const key = `hl_${currentBook}_${currentChapter}`;
  let hls = JSON.parse(localStorage.getItem(key) || "[]");
  if(el.classList.contains('hl')) { if(!hls.includes(v)) hls.push(v); }
  else { hls = hls.filter(i => i !== v); }
  localStorage.setItem(key, JSON.stringify(hls));
}
function toggleNoteField(v) { const i = document.getElementById(`input-${v}`); i.classList.toggle('active'); if(i.classList.contains('active')) i.focus(); }
function saveVerseNote(v, el) { localStorage.setItem(`vnote_${currentBook}_${currentChapter}_${v}`, el.value); }
function saveChapterNote() { localStorage.setItem(`note_${currentBook}_${currentChapter}`, document.getElementById('notes-input').value); }
function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }
function autoResume() { const s = JSON.parse(localStorage.getItem('lastRead')); if(s && bible[s.book]) showChapter(s.book, s.ch); }
function goPrev() { /* 同前 ... */ } function goNext() { /* 同前 ... */ }
function exportData() { const b = new Blob([JSON.stringify(localStorage)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'bible_study.json'; a.click(); }
function handleFile(i) { const r = new FileReader(); r.onload = (e) => { const d = JSON.parse(e.target.result); localStorage.clear(); for(let k in d) localStorage.setItem(k, d[k]); location.reload(); }; r.readAsText(i.files[0]); }
</script>
</body>
</html>
