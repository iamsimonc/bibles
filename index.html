<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>聖經（和合本）</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
* { box-sizing: border-box; }
:root {
  --font-size: 20px;
  --bg: #fafafa;
  --text: #000;
  --border: #ccc;
  --header-h: 56px;
}

body.dark {
  --bg: #121212;
  --text: #e0e0e0;
  --border: #444;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--font-size);
  line-height: 1.8;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: var(--header-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  z-index: 100;
}

header button { 
  font-size: 18px; 
  padding: 5px 10px;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
}

#drawer {
  position: fixed;
  top: var(--header-h);
  left: 0;
  width: 280px;
  height: calc(100% - var(--header-h));
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transform: translateX(-100%);
  transition: 0.3s ease;
  z-index: 99;
}

#drawer.open { transform: translateX(0); }

.book-btn, .chapter-btn {
  width: 100%;
  padding: 15px;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  font-size: 18px;
}

main {
  padding: calc(var(--header-h) + 20px) 16px 40px;
  max-width: 800px;
  margin: 0 auto;
}

.verse { border-bottom: 1px dotted var(--border); padding: 8px 0; }
.verse strong { color: #d32f2f; margin-right: 8px; }
body.dark .verse strong { color: #ff8a80; }

.chapter-nav {
  display: flex;
  justify-content: space-between;
  margin: 30px 0;
}

.chapter-nav button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>
  <button onclick="toggleMenu()">☰ 卷目</button>
  <button onclick="changeFont(-2)">A−</button>
  <button onclick="changeFont(2)">A+</button>
  <button onclick="toggleDark()">🌓</button>
</header>

<nav id="drawer"></nav>
<main id="content">正在初始化...</main>

<script src="./books.js"></script>
<script>
const bible = {};
let currentBook = null;
let currentChapter = null;

const drawer = document.getElementById('drawer');
const content = document.getElementById('content');

function toggleMenu() { drawer.classList.toggle('open'); }
function changeFont(d) {
  let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
  s = Math.max(14, s + d);
  document.documentElement.style.setProperty('--font-size', s + 'px');
}
function toggleDark() { document.body.classList.toggle('dark'); }

/* 載入數據 */
fetch('./bible.txt')
  .then(r => {
    if(!r.ok) throw new Error("找不到 bible.txt，請確認檔案路徑");
    return r.text();
  })
  .then(text => {
    const lines = text.split(/\r?\n/);
    lines.forEach(line => {
      // 修正 Regex，確保能處理可能的空白
      const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
      if (!m) return;
      const [, b, ch, v, verse] = m;
      const chNum = parseInt(ch);
      bible[b] ??= {};
      bible[b][chNum] ??= [];
      bible[b][chNum].push({ v, verse });
    });
    renderBooks();
    content.innerHTML = "請從選單選擇經卷";
  })
  .catch(err => {
    content.innerHTML = "載入失敗：" + err.message;
    console.error(err);
  });

function renderBooks() {
  drawer.innerHTML = '';
  // 假設 BOOKS 在 books.js 裡是一個 Object，如 { "Gen": "創世記" }
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[b];
    btn.onclick = () => renderChapters(b);
    drawer.appendChild(btn);
  });
}

function renderChapters(book) {
  drawer.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="background:#eee; color:#000">⬅ 返回卷目</button>`;
  const chapters = Object.keys(bible[book]).map(Number).sort((a,b)=>a-b);
  chapters.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    drawer.appendChild(btn);
  });
}

function showChapter(book, ch) {
  currentBook = book;
  currentChapter = ch;
  window.scrollTo(0,0);
  drawer.classList.remove('open');

  let html = `<h3>${BOOKS[book]} 第 ${ch} 章</h3>`;
  html += bible[book][ch].map(v => 
    `<div class="verse"><strong>${v.v}</strong> ${v.verse}</div>`
  ).join('');
  
  html += `
    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>`;
  
  content.innerHTML = html;
}

function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chapters[i-1]);
  
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi > 0) {
    const pb = books[bi-1];
    const last = Math.max(...Object.keys(bible[pb]).map(Number));
    showChapter(pb, last);
  }
}

function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i < chapters.length-1) return showChapter(currentBook, chapters[i+1]);

  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi < books.length-1) {
    const nb = books[bi+1];
    showChapter(nb, 1);
  }
}

/* Service Worker 註冊使用相對路徑 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('SW 註冊成功'))
      .catch(err => console.log('SW 註冊失敗', err));
  });
}
</script>

</body>
</html>
