<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>聖經（和合本）</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 220px;
  border-right: 1px solid #ddd;
  overflow-y: auto;
  padding: 10px;
  box-sizing: border-box;
}

#content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  box-sizing: border-box;
}

.book-btn {
  display: block;
  width: 100%;
  margin: 4px 0;
  padding: 6px;
  border: none;
  background: #f5f5f5;
  cursor: pointer;
  text-align: left;
}

.book-btn:hover {
  background: #e0e0e0;
}

h2 {
  margin-top: 0;
}

pre {
  white-space: pre-wrap;
  line-height: 1.6;
}
</style>
</head>

<body>

<div id="sidebar">
  <strong>書卷</strong>
  <div id="bookList"></div>
</div>

<div id="content">
  <p>請從左邊選擇書卷</p>
</div>

<!-- 書卷對照表 -->
<script src="books.js"></script>

<script>
let bibleData = {};

// 讀取 bible.txt
fetch('bible.txt')
  .then(response => response.text())
  .then(text => {
    const lines = text.split('\n');

    lines.forEach(line => {
      // 例：Gen 1:1 起初　神創造天地。
      const match = line.match(/^(\w+)\s+/);
      if (!match) return;

      const bookCode = match[1];
      if (!bibleData[bookCode]) {
        bibleData[bookCode] = [];
      }
      bibleData[bookCode].push(line);
    });

    renderBookList();
  })
  .catch(err => {
    document.getElementById('content').innerText = '讀取聖經檔案失敗';
    console.error(err);
  });

// 顯示書卷清單
function renderBookList() {
  const bookList = document.getElementById('bookList');
  bookList.innerHTML = '';

  Object.keys(BOOKS).forEach(code => {
    if (!bibleData[code]) return;

    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[code];
    btn.onclick = () => showBook(code);

    bookList.appendChild(btn);
  });
}

// 顯示某一書卷
function showBook(code) {
  const content = document.getElementById('content');
  const title = BOOKS[code] || code;
  const verses = bibleData[code].join('\n');

  content.innerHTML = `
    <h2>${title}</h2>
    <pre>${verses}</pre>
  `;
}
</script>

</body>
</html>
