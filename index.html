<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>聖經（和合本）</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
:root {
  --font-size: 20px;
  --bg: #fafafa;
  --text: #000;
  --border: #ccc;
}

body.dark {
  --bg: #121212;
  --text: #e0e0e0;
  --border: #444;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system;
  font-size: var(--font-size);
  line-height: 1.8;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden; /* ⭐ 防止橫向捲動 */
}

/* Header */
header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 56px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  box-sizing: border-box;
  z-index: 100;
}

header button {
  font-size: 18px;
}

header input {
  flex: 1;
  font-size: 16px;
  padding: 4px 6px;
}

/* Drawer */
#drawer {
  position: fixed;
  top: 56px;
  left: 0;
  width: 260px;
  height: calc(100% - 56px);
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 90;
}

#drawer.open {
  transform: translateX(0);
}

.book-btn,
.chapter-btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}

/* Content */
main {
  padding: 76px 16px 40px;
  overflow-wrap: break-word;
  word-break: break-word;
}

/* Verse */
.verse {
  padding: 6px 0;
  border-bottom: 1px dotted var(--border);
  white-space: normal;          /* ⭐ 強制可斷行 */
  overflow-wrap: break-word;
  word-break: break-word;
}

.vnum {
  font-weight: bold;
  margin-right: 6px;
}

.note {
  margin-top: 6px;
  padding: 8px;
  background: rgba(255,255,0,0.18);
  font-size: 0.9em;
}

/* Chapter Nav */
.chapter-nav {
  display: flex;
  justify-content: space-between;
  margin: 24px 0;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">☰</button>
  <button onclick="changeFont(-2)">A−</button>
  <button onclick="changeFont(2)">A+</button>
  <button onclick="toggleDark()">🌙</button>
  <input id="searchBox" placeholder="搜尋經文">
</header>

<nav id="drawer"></nav>

<main id="content">
  <p>請點擊左上角 ☰ 選擇書卷</p>
</main>

<script src="books.js"></script>
<script>
let bible = {};
let drawer = document.getElementById('drawer');
let content = document.getElementById('content');

let currentBook = null;
let currentChapter = null;

/* UI */
function toggleMenu() {
  drawer.classList.toggle('open');
}

function changeFont(delta) {
  let size = parseInt(getComputedStyle(document.body).fontSize);
  size = Math.max(14, size + delta);
  document.documentElement.style.setProperty('--font-size', size + 'px');
  localStorage.setItem('fontSize', size);
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark'));
}

/* Restore settings */
if (localStorage.getItem('dark') === 'true') {
  document.body.classList.add('dark');
}
const savedSize = localStorage.getItem('fontSize');
if (savedSize) {
  document.documentElement.style.setProperty('--font-size', savedSize + 'px');
}

/* Load Bible */
fetch('bible.txt')
.then(r => r.text())
.then(text => {
  text.split('\n').forEach(line => {
    const m = line.match(/^(\w+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, book, ch, v, verse] = m;
    bible[book] ??= {};
    bible[book][ch] ??= [];
    bible[book][ch].push({ v, verse });
  });
  renderBooks();
  restoreLast();
});

/* Menu */
function renderBooks() {
  drawer.innerHTML = '';
  Object.keys(bible).forEach(book => {
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[book] || book;
    btn.onclick = () => renderChapters(book);
    drawer.appendChild(btn);
  });
}

function renderChapters(book) {
  drawer.innerHTML = '';
  Object.keys(bible[book]).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    drawer.appendChild(btn);
  });
}

/* Show Chapter */
function showChapter(book, ch) {
  currentBook = book;
  currentChapter = parseInt(ch);

  drawer.classList.remove('open');
  document.title = `${BOOKS[book]} 第 ${ch} 章`;

  content.innerHTML =
    bible[book][ch].map(v => `
      <div class="verse" id="${book}-${ch}-${v.v}">
        <span class="vnum">${v.v}</span>
        <span>${v.verse}</span>
      </div>
    `).join('')
    + renderChapterNav();

  localStorage.setItem('last', JSON.stringify({book, ch}));
}

/* Chapter Navigation */
function renderChapterNav() {
  return `
    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>
  `;
}

function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number);
  const idx = chapters.indexOf(currentChapter);

  if (idx > 0) {
    showChapter(currentBook, chapters[idx - 1]);
  } else {
    const books = Object.keys(bible);
    const bIdx = books.indexOf(currentBook);
    if (bIdx > 0) {
      const prevBook = books[bIdx - 1];
      const lastCh = Math.max(...Object.keys(bible[prevBook]).map(Number));
      showChapter(prevBook, lastCh);
    }
  }
}

function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number);
  const idx = chapters.indexOf(currentChapter);

  if (idx < chapters.length - 1) {
    showChapter(currentBook, chapters[idx + 1]);
  } else {
    const books = Object.keys(bible);
    const bIdx = books.indexOf(currentBook);
    if (bIdx < books.length - 1) {
      const nextBook = books[bIdx + 1];
      showChapter(nextBook, 1);
    }
  }
}

/* Restore last */
function restoreLast() {
  const last = localStorage.getItem('last');
  if (!last) return;
  const {book, ch} = JSON.parse(last);
  showChapter(book, ch);
}
</script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
