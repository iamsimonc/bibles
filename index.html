<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經（和合本）</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
:root {
  --font-size: 20px;
  --bg: #fafafa;
  --text: #000;
}

body.dark {
  --bg: #121212;
  --text: #e0e0e0;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system;
  font-size: var(--font-size);
  line-height: 1.8;
  background: var(--bg);
  color: var(--text);
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 56px;
  background: var(--bg);
  border-bottom: 1px solid #ccc;
  display: flex;
  align-items: center;
  padding: 0 10px;
  z-index: 100;
}

header button {
  font-size: 20px;
  margin-right: 10px;
}

#drawer {
  position: fixed;
  top: 56px;
  left: 0;
  width: 260px;
  height: calc(100% - 56px);
  background: var(--bg);
  border-right: 1px solid #ccc;
  overflow-y: auto;
  transform: translateX(-100%);
  transition: 0.3s;
}

#drawer.open { transform: translateX(0); }

.book-btn, .chapter-btn {
  width: 100%;
  padding: 10px;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
}

main {
  padding: 76px 16px 30px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">☰</button>
  <button onclick="fontSize(-2)">A−</button>
  <button onclick="fontSize(2)">A+</button>
  <button onclick="toggleDark()">🌙</button>
  <strong id="title">聖經</strong>
</header>

<nav id="drawer"></nav>

<main id="content">
  <p>請選擇書卷</p>
</main>

<script src="books.js"></script>
<script>
let bible = {};
let currentBook = null;

const drawer = document.getElementById('drawer');
const content = document.getElementById('content');

/* UI 控制 */
function toggleMenu() { drawer.classList.toggle('open'); }
function fontSize(delta) {
  let size = parseInt(getComputedStyle(document.body).fontSize);
  size = Math.max(14, size + delta);
  document.documentElement.style.setProperty('--font-size', size + 'px');
  localStorage.setItem('fontSize', size);
}
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark'));
}

/* 載入設定 */
if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark');
const savedSize = localStorage.getItem('fontSize');
if (savedSize) document.documentElement.style.setProperty('--font-size', savedSize + 'px');

/* 讀取聖經 */
fetch('bible.txt')
.then(r => r.text())
.then(text => {
  text.split('\n').forEach(line => {
    const m = line.match(/^(\w+)\s+(\d+):(\d+)/);
    if (!m) return;
    const [ , book, ch ] = m;
    bible[book] ??= {};
    bible[book][ch] ??= [];
    bible[book][ch].push(line);
  });
  renderBooks();
});

/* 書卷 */
function renderBooks() {
  drawer.innerHTML = '';
  Object.keys(bible).forEach(code => {
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[code] || code;
    btn.onclick = () => renderChapters(code);
    drawer.appendChild(btn);
  });
}

/* 章 */
function renderChapters(code) {
  currentBook = code;
  drawer.innerHTML = '';
  Object.keys(bible[code]).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `第 ${ch} 章`;
    btn.onclick = () => showChapter(code, ch);
    drawer.appendChild(btn);
  });
}

/* 顯示經文 */
function showChapter(book, ch) {
  drawer.classList.remove('open');
  document.getElementById('title').textContent = `${BOOKS[book]} 第 ${ch} 章`;
  content.innerHTML = `<pre>${bible[book][ch].join('\n')}</pre>`;
  localStorage.setItem('last', JSON.stringify({book, ch}));
}

/* 回復上次閱讀 */
const last = localStorage.getItem('last');
if (last) {
  const {book, ch} = JSON.parse(last);
  showChapter(book, ch);
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
