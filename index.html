<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>聖經（和合本）</title>

<!-- ✅ PWA 必須 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
:root {
  --font-size: 20px;
  --bg: #fafafa;
  --text: #000;
  --border: #ccc;
}

body.dark {
  --bg: #121212;
  --text: #e0e0e0;
  --border: #444;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system;
  font-size: var(--font-size);
  line-height: 1.8;
  background: var(--bg);
  color: var(--text);
}

/* Header */
header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 56px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  box-sizing: border-box;
  z-index: 100;
}

header button {
  font-size: 18px;
}

header input {
  flex: 1;
  font-size: 16px;
  padding: 4px 6px;
}

/* Drawer */
#drawer {
  position: fixed;
  top: 56px;
  left: 0;
  width: 260px;
  height: calc(100% - 56px);
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 90;
}

#drawer.open {
  transform: translateX(0);
}

.book-btn,
.chapter-btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}

/* Content */
main {
  padding: 76px 16px 40px;
}

/* Verse */
.verse {
  padding: 6px 0;
  border-bottom: 1px dotted var(--border);
}

.vnum {
  font-weight: bold;
  margin-right: 6px;
}

.verse button {
  margin-left: 6px;
}

.note {
  margin-top: 6px;
  padding: 8px;
  background: rgba(255,255,0,0.18);
  font-size: 0.9em;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">☰</button>
  <button onclick="changeFont(-2)">A−</button>
  <button onclick="changeFont(2)">A+</button>
  <button onclick="toggleDark()">🌙</button>
  <input id="searchBox" placeholder="搜尋經文">
</header>

<nav id="drawer"></nav>

<main id="content">
  <p>請點擊左上角 ☰ 選擇書卷</p>
</main>

<script src="books.js"></script>
<script>
let bible = {};
let drawer = document.getElementById('drawer');
let content = document.getElementById('content');

/* ========== UI 控制 ========== */
function toggleMenu() {
  drawer.classList.toggle('open');
}

function changeFont(delta) {
  let size = parseInt(getComputedStyle(document.body).fontSize);
  size = Math.max(14, size + delta);
  document.documentElement.style.setProperty('--font-size', size + 'px');
  localStorage.setItem('fontSize', size);
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark'));
}

/* 載入設定 */
if (localStorage.getItem('dark') === 'true') {
  document.body.classList.add('dark');
}
const savedSize = localStorage.getItem('fontSize');
if (savedSize) {
  document.documentElement.style.setProperty('--font-size', savedSize + 'px');
}

/* ========== 載入聖經 ========== */
fetch('bible.txt')
.then(r => r.text())
.then(text => {
  text.split('\n').forEach(line => {
    const m = line.match(/^(\w+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, book, ch, v, verse] = m;
    bible[book] ??= {};
    bible[book][ch] ??= [];
    bible[book][ch].push({ v, verse });
  });
  renderBooks();
  restoreLast();
});

/* ========== 書卷 / 章 ========== */
function renderBooks() {
  drawer.innerHTML = '';
  Object.keys(bible).forEach(book => {
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[book] || book;
    btn.onclick = () => renderChapters(book);
    drawer.appendChild(btn);
  });
}

function renderChapters(book) {
  drawer.innerHTML = '';
  Object.keys(bible[book]).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    drawer.appendChild(btn);
  });
}

/* ========== 顯示經文 ========== */
function showChapter(book, ch) {
  drawer.classList.remove('open');
  document.title = `${BOOKS[book]} ${ch}`;
  content.innerHTML = bible[book][ch].map(v => {
    const id = `${book}-${ch}-${v.v}`;
    const noteKey = `note-${id}`;
    const note = localStorage.getItem(noteKey) || '';
    return `
      <div class="verse" id="${id}">
        <span class="vnum">${v.v}</span>
        <span>${v.verse}</span>
        <button onclick="copyLink('${id}')">🔗</button>
        <button onclick="editNote('${id}')">📝</button>
        ${note ? `<div class="note">${note}</div>` : ''}
      </div>
    `;
  }).join('');
  localStorage.setItem('last', JSON.stringify({book, ch}));
}

/* ========== 搜尋 ========== */
document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.trim();
  if (q.length < 2) return;
  let out = [];
  for (const b in bible) {
    for (const ch in bible[b]) {
      bible[b][ch].forEach(v => {
        if (v.verse.includes(q)) {
          out.push(`
            <div class="verse">
              <strong>${BOOKS[b]} ${ch}:${v.v}</strong><br>
              ${v.verse}
            </div>
          `);
        }
      });
    }
  }
  content.innerHTML = out.join('');
});

/* ========== 分享 / 註解 ========== */
function copyLink(id) {
  const url = location.origin + location.pathname + '#' + id;
  navigator.clipboard.writeText(url);
  alert('經文連結已複製');
}

function editNote(id) {
  const key = `note-${id}`;
  const cur = localStorage.getItem(key) || '';
  const note = prompt('輸入你的註解：', cur);
  if (note !== null) {
    localStorage.setItem(key, note);
    location.hash = id;
    location.reload();
  }
}

/* ========== 回復閱讀位置 ========== */
function restoreLast() {
  const last = localStorage.getItem('last');
  if (!last) return;
  const {book, ch} = JSON.parse(last);
  showChapter(book, ch);
}

window.addEventListener('load', () => {
  if (location.hash) {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView();
  }
});
</script>

<!-- ✅ Service Worker 註冊（非常重要） -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
