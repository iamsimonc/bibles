<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經研讀 PWA</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; }
  :root { 
    --font-size: 20px; --bg: #fdfdfd; --text: #1a1a1a; --border: #e0e0e0; 
    --header-h: 60px; --sidebar-w: 280px; --highlight-color: #fff176;
  }
  /* 三種模式的 CSS */
  body.dark { --bg: #121212; --text: #dcdcdc; --border: #333; --highlight-color: #f57f17; }
  body.sepia { --bg: #f4ecd8; --text: #5b4636; --border: #dcd0b9; --highlight-color: #ffd54f; }

  body { 
    margin: 0; font-family: "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif; 
    font-size: var(--font-size); line-height: 1.9; background: var(--bg); color: var(--text); 
  }

  header {
    position: fixed; top: 0; width: 100%; height: var(--header-h);
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; z-index: 1000;
  }

  .btn-group { display: flex; gap: 5px; }
  header button { 
    font-size: 14px; padding: 5px 8px; background: transparent; 
    border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer;
  }

  #layout { display: flex; margin-top: var(--header-h); }
  #drawer {
    width: var(--sidebar-w); height: calc(100vh - var(--header-h));
    position: fixed; left: 0; background: var(--bg);
    border-right: 1px solid var(--border); overflow-y: auto;
    transition: transform 0.3s ease; z-index: 999;
  }

  main { flex: 1; padding: 20px 15px 80px; max-width: 800px; margin: 0 auto; transition: margin-left 0.3s ease; }

  @media (min-width: 1024px) {
    #drawer { transform: translateX(0) !important; }
    main { margin-left: var(--sidebar-w); }
    #menu-toggle { display: none; }
  }

  @media (max-width: 1023px) {
    #drawer { transform: translateX(-100%); }
    #drawer.open { transform: translateX(0); }
  }

  .verse { padding: 8px; border-bottom: 1px dotted var(--border); cursor: pointer; border-radius: 4px; }
  .verse.hl { background-color: var(--highlight-color); color: #000; }
  .verse strong { color: #c62828; margin-right: 10px; font-size: 0.85em; }
  body.dark .verse strong { color: #ffab91; }

  #notes-area { margin-top: 40px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; }
  #notes-input {
    width: 100%; height: 120px; background: transparent; color: var(--text);
    border: 1px solid var(--border); padding: 10px; font-size: 16px; border-radius: 4px; resize: vertical;
  }

  .book-btn, .chapter-btn {
    width: 100%; padding: 14px; border: none; background: none;
    text-align: left; color: var(--text); border-bottom: 1px solid var(--border); font-size: 16px;
  }
  .chapter-nav { display: flex; justify-content: space-between; margin: 30px 0; }
</style>
</head>
<body class="default"> <header>
  <div class="btn-group">
    <button id="menu-toggle" onclick="toggleMenu()">☰ 經卷</button>
    <button onclick="changeTheme('sepia')">🌾 護眼</button>
    <button onclick="changeTheme('dark')">🌙 深色</button>
  </div>
  <div class="btn-group">
    <button onclick="exportData()">💾 匯出</button>
    <button onclick="document.getElementById('importFile').click()">🔄 匯入</button>
    <input type="file" id="importFile" style="display:none" onchange="handleFile(this)">
  </div>
</header>

<div id="layout">
  <nav id="drawer"></nav>
  <main id="content">載入中...</main>
</div>

<script src="./books.js"></script>
<script>
let bible = {};
let currentBook = null;
let currentChapter = null;

// --- 主題記憶功能 ---
function applySavedTheme() {
  const savedTheme = localStorage.getItem('userTheme');
  if (savedTheme) {
    document.body.classList.remove('dark', 'sepia');
    if (savedTheme !== 'default') {
      document.body.classList.add(savedTheme);
    }
  }
}

function changeTheme(t) {
  const b = document.body;
  let activeTheme = 'default';

  if (t === 'dark') {
    if (b.classList.contains('dark')) {
      b.classList.remove('dark');
    } else {
      b.classList.add('dark');
      b.classList.remove('sepia');
      activeTheme = 'dark';
    }
  } else if (t === 'sepia') {
    if (b.classList.contains('sepia')) {
      b.classList.remove('sepia');
    } else {
      b.classList.add('sepia');
      b.classList.remove('dark');
      activeTheme = 'sepia';
    }
  }
  
  // 如果身上什麼都沒有，就是 default
  if (!b.classList.contains('dark') && !b.classList.contains('sepia')) {
    activeTheme = 'default';
  }
  
  localStorage.setItem('userTheme', activeTheme);
}

// 初始化時立即套用主題
applySavedTheme();

function toggleMenu() { document.getElementById('drawer').classList.toggle('open'); }

/* 數據解析與顯示 */
fetch('./bible.txt').then(r => r.text()).then(text => {
  text.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^([\u4e00-\u9fa5\w]+)\s+(\d+):(\d+)\s+(.*)$/);
    if (!m) return;
    const [, b, ch, v, verse] = m;
    const chNum = parseInt(ch);
    bible[b] ??= {};
    bible[b][chNum] ??= [];
    bible[b][chNum].push({ v, verse });
  });
  renderBooks();
  autoResume();
});

function renderBooks() {
  const dr = document.getElementById('drawer');
  dr.innerHTML = '<h3 style="padding:15px">新舊約全書</h3>';
  Object.keys(BOOKS).forEach(b => {
    if (!bible[b]) return;
    const btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.textContent = BOOKS[b];
    btn.onclick = () => renderChapters(b);
    dr.appendChild(btn);
  });
}

function renderChapters(book) {
  const dr = document.getElementById('drawer');
  dr.innerHTML = `<button class="book-btn" onclick="renderBooks()" style="background:rgba(0,0,0,0.05)">⬅ 返回卷目</button>`;
  Object.keys(bible[book]).map(Number).sort((a,b)=>a-b).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = `${BOOKS[book]} 第 ${ch} 章`;
    btn.onclick = () => showChapter(book, ch);
    dr.appendChild(btn);
  });
}

function showChapter(book, ch) {
  currentBook = book; currentChapter = ch;
  localStorage.setItem('lastRead', JSON.stringify({book, ch}));
  document.getElementById('drawer').classList.remove('open');
  window.scrollTo(0,0);

  const hlKey = `hl_${book}_${ch}`;
  let highlights = JSON.parse(localStorage.getItem(hlKey) || "[]");

  let html = `<h2>${BOOKS[book]} 第 ${ch} 章</h2>`;
  html += bible[book][ch].map(v => {
    const isHl = highlights.includes(v.v) ? 'hl' : '';
    return `<div class="verse ${isHl}" id="v-${v.v}" onclick="toggleHighlight('${v.v}')">
              <strong>${v.v}</strong>${v.verse}
            </div>`;
  }).join('');

  html += `
    <div class="chapter-nav">
      <button onclick="goPrev()">⬅ 上一章</button>
      <button onclick="goNext()">下一章 ➡</button>
    </div>
    <div id="notes-area">
      <h4>📝 本章筆記</h4>
      <textarea id="notes-input" placeholder="在此輸入心得..." oninput="saveNote()"></textarea>
    </div>`;
  
  document.getElementById('content').innerHTML = html;
  const noteKey = `note_${book}_${ch}`;
  document.getElementById('notes-input').value = localStorage.getItem(noteKey) || "";
}

function toggleHighlight(vNum) {
  const el = document.getElementById(`v-${vNum}`);
  el.classList.toggle('hl');
  const hlKey = `hl_${currentBook}_${currentChapter}`;
  let highlights = JSON.parse(localStorage.getItem(hlKey) || "[]");
  if(el.classList.contains('hl')) { if(!highlights.includes(vNum)) highlights.push(vNum); }
  else { highlights = highlights.filter(i => i !== vNum); }
  localStorage.setItem(hlKey, JSON.stringify(highlights));
}

function saveNote() {
  const val = document.getElementById('notes-input').value;
  localStorage.setItem(`note_${currentBook}_${currentChapter}`, val);
}

function autoResume() {
  const saved = JSON.parse(localStorage.getItem('lastRead'));
  if(saved && bible[saved.book]) showChapter(saved.book, saved.ch);
  else document.getElementById('content').innerHTML = "請從選單選擇經卷開始閱讀";
}

/* 備份與還原 */
function exportData() {
  const data = JSON.stringify(localStorage);
  const blob = new Blob([data], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bible_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm("這將還原檔案中的設定與筆記，確定嗎？")) {
        localStorage.clear();
        for (let key in data) localStorage.setItem(key, data[key]);
        location.reload();
      }
    } catch (err) { alert("檔案讀取失敗。"); }
  };
  reader.readAsText(file);
}

// 導航邏輯
function goPrev() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i > 0) return showChapter(currentBook, chapters[i-1]);
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi > 0) {
    const pb = books[bi-1];
    const last = Math.max(...Object.keys(bible[pb]).map(Number));
    showChapter(pb, last);
  }
}
function goNext() {
  const chapters = Object.keys(bible[currentBook]).map(Number).sort((a,b)=>a-b);
  const i = chapters.indexOf(currentChapter);
  if (i < chapters.length-1) return showChapter(currentBook, chapters[i+1]);
  const books = Object.keys(BOOKS);
  const bi = books.indexOf(currentBook);
  if (bi < books.length-1) showChapter(books[bi+1], 1);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
</body>
</html>
