歷代志下六18~31 
 
具體的懇求(上) 
 
所羅門要建的殿，不僅是獻祭的殿(二4)，它更是一個禱告的殿 (18~21)。耶和華雖然偉大無比，超越一切，但他卻甘願在殿中與人相遇，俯聽人的禱告。 
 
以下是所羅門獻上的七項具體要求： 
1.	求神以行動印證義人的清白(22~23) —— 起誓是一種嚴肅的行動，爲的是表白自己的無罪。既是如此，起誓後發生的事就很關鍵性，以色列人願意見到的是罪人受禍、義人蒙福。 
2.	求神改變失敗的國運（24～25）—— 當國家因罪而被敵人打敗，以色列人需要回心轉意歸向神時也就是表示他們有悔改的心了。這樣，國家命運才能有改變，才能繼續在巴勒斯坦這地方立國。 
3.	求神除掉旱災(26~27)—— 古代的以色列以農立國，故雨水與民生關係十分重大。他們認定神賜雨水就表示神喜悅他們，反之，就是神發怒不悅納他們。當這種乾旱情況發生，以色列人就需要檢討自己的行為，並要離罪行善，才能蒙受降雨的福分。 
4.	求神除掉饑荒等災(28-31)—— 饑荒的形成，可能是因爲旱災的緣故，但其他疫症也會導致這種情況出現。災禍固然使人受苦，但積極方面它也可使人操練敬畏神的心。 
 
基督徒的禱告其中可有的内容之一是「懇求」。當我們遇到一些不如意的事情，我們可以向神禱告求改變。這是一種權利，也是一份莫大的福氣。這樣的舉動，是表示尊神為大，以神旨意為至高的標準。不過有一件事我們絕不能輕忽的，就是當這一切不如意的事情是因我們得罪神而出現的時候，我們便需要悔改回轉！ 
 
祈禱	主啊，賜我一顆敏感的心，叫我知道在何事上曾得罪祢。

具體的懇求(下) 
  
建造聖殿的經文較具體懇求的經文為短，這有理由叫人相信歷代志下的作者是十分重視禱告的。上次我們已談過四項具體的懇求，今次讓我們再繼續說及其餘的懇求事項。 
5.	求神使外邦人認識祂(32~33) —— 這裏所羅門對外邦人的態度是寬容的，蓋他們也需要認識神的名。當然，以色列民有責任向天下萬民作見證，表揚神的能力與大名，好使外邦人歸向神。 
6.	求神使以色列軍隊得勝(34~35) —— 奉神的名受差遣往各處爭戰，意思是這些爭戰都有神的引導，並非他們胡亂發動戰爭。在這情况下求神幫助，神也會給予他們勝利。其後有很多例證證明這點，就是勝過埃及、摩押及以東等軍隊。 
7.	求神憐憫被擄的悔改子民(36~39) —— 他們犯罪戰敗被擄至外地，雖暫無機會回到自己的地方，但他們若肯向神認罪悔改，神必會再次照顧他們的。 
 
所羅門深信神會悅納他這樣的懇求，原因有二：神與約櫃同是人安息之所， 表明神是永久住在聖殿裏的;祂既不離開受膏者大衛、所羅門及繼後的王，所以守約施慈愛的福氣就必不中斷。 
 
基督徒要認識一件事，無論身在何方，只要我們認真、謙卑、悔罪的向神禱告，神必會垂聽。地理上的遠近也不會攔阻神能力的彰顯。當然，蒙允之先，我們必須清楚禱告內容是否為了高舉主的名，又合乎神的引導，自己又肯否正視罪惡。否則，神就不悅納了! 
 
思想	禱告祈求是否已經成了你生命中重要的一部分？ —《新舊約輔讀》 
 
歷代志下七 1～10 
 
聖殿奉獻禮 
 
所羅門祈禱言畢後，神對他就立刻作出積極的回應，透過連串行動來表示他的認可及接納： 
•	降火及顯榮光（1-3）——所羅門祈禱前所擺上的祭物被從天而降下的火燒盡。這是一個超自然的現象，引證了神的喜悅。此外，同一時間神顯出其榮光。這次榮光的顯現，與上一次不同，上次只有祭司看見，今次則是全以色列民都看到。結果，人人都對神生發敬畏、敬拜及感恩的心。 
這時，為了向神表達更大的敬意與感謝，所羅門與眾民乃再次獻祭，並將聖殿呈獻。 
•	盛大的獻祭（4-7）——這是一次人人參與的獻祭儀式，它包括了王、祭司、利未人、以色列人及眾民等。此外，祭牲數目也實在龐大，以致大如銅壇都容不下，而不得不使用殿前院子作輔助。 
所羅門選擇獻殿的日子十分正確。因他與住棚節的慶祝連在一起，使更多人得參與這次奉獻禮。 
•	獻殿並守節（8-10）——「從哈馬口直到埃及小河」是以色列最理想的邊界。他們不是在住棚節獻殿，而是在其前一週舉行。日期安排如下：七月八至十四日為獻殿禮，十五至二十一日為慶祝住棚節，二十二日為嚴肅會，二十三日則遣散眾民歸家。 
我們需要對神「向我們施恩的行動」作出進一步的回應，就是稱謝祂，又將自己獻給主。只有這樣，屬靈生命才會保持活潑及充滿喜樂。我們參與外在的感恩奉獻儀節固然重要，但假若內心缺乏真誠擺上及謝恩的心，則只會落入「形式主義」的陷阱中，這絕不是真宗教的意義。 
 
思想	你享受每主日的崇拜生活嗎？如果答案是否定的，要好好思想一下原因了。 
 
歷代志下七11～22 
有條件的應許與警告 
神悅納了所羅門的祈求，並透過顯現，清楚的指出祂歡喜見到這殿宇能成為禱告及獻祭的殿。接著，神提出了兩個有條件的應許及一個有條件的警告。 
•	人若肯悔改回轉，神必改變其悲慘景況（13-16）——旱災、蟲災及瘟疫代表了神給予以色列民的懲罰。當然，這並非因神胡亂降災所造成，乃因人反叛不從聽從神的吩咐所導致。要改變這種悲慘景況而成為神名下的子民，他們必須具備以下四個條件： 
1.	自卑：願意將己心完全降服在神的主權下。 
2.	禱告：就是先肯自我審查，了解為何因罪受咒詛；然後轉求神停止降禍，改以因福來對待。 
3.	尋求神的面：就是尋找神，不但想見祂的面，更想進入祂的同在中並得到祂的喜悅。 
4.	轉離惡行：真誠悔改，離開神不喜悅的罪行，尤其是異教徒所造的。若是如此，神必賜福，必關心有這種心態及行動的子民。 
 
•	所羅門若肯守主道，神必堅立大衛王朝（17-18）——神對王有道德要求，神的吩咐及律例典章就是標準。 
•	警告勿離棄神（19-22）——神警告全以色列民切勿服侍別的假神，否則整個民族都會連根拔起，聖殿也必遭破壞。 
神樂意向我們施恩賜福，但不是以縱容及溺愛的方式。人若放縱自己，偏行己路，必自吃苦果，經歷苦難。不過，人若在轉念間領悟到自己的罪，有甘心降服在神的權柄底下，悔改認罪，這苦果定得挪開。今日，你若正吃著苦果、經歷苦難，也許就要在這方面多多反思了。 
 
思想	挫敗、苦楚及傷痛所帶給你的是更多的苦毒、忿怒，還是更深的反省與自卑呢？—《新舊約輔讀》 
 
 
 
 
歷代志下八1~10 
大展鴻圖 
所羅門是一位偉大的建殿者，這是人所公認的。不過，他的建設計劃並非只限於聖殿，他還作了其他大規範建設。 
•	修築城邑(1~2) ——所羅門曾以二十座城報答希蘭過往在材料及經濟上對他的支持，這裏則強調希蘭送給所羅門的城邑。有解經家認為很可能同是那二十座城，蓋希蘭對此等城邑難大喜歡，感到無多大價值，乃退回。於是所羅門決心將這些城重新修築。 
•	其他建造計劃(3-6) ——所羅門是和平之子，他極少發動軍事侵略，擴展國家版圖。雖然他不停的建造，但主要都是作為保衛作用。哈馬項巴、達莫及哈馬，均處於以色列北部及東北部，與美索不達米亞貿易路線有關。所羅門加强這些城邑的建設，自然在商業貿易上可取得更大成就。上下伯，和崙與西海岸公路有連繫，居戰略性地位，也易受侵略，故必須加強保障。巴拉約在耶路撒冷西北三十五公里。所羅門廣泛地為這些建設計劃努力。 
•	强迫勞工(7~10) ——他們主要是居於迦南地的外邦人。有其他記載指出，以色列人也曾被徵召作苦工(王上五13)，似與這裏所說的有衝突。可能的解釋是:以色列人被徵召只是短期的、臨時的，但外邦人則是長久作奴僕，所以兩者仍有分別。 
神與所羅門同在，故他所作的事，盡都亨通，神亦處處有供應。我們要對神的信實與承諾有信心，知道祂會保守與引導。這樣，無論我們推行甚麼事工計劃，或大或小、或近或遠，只要以神的榮耀為中心，自己又懷着謙卑的心來服侍主，相信就會經歷到神的福分，叫神的名被高舉，人也得着各種益處。 
祈禱 主啊，願祢堅立我手所作的工。 
 
歷代志下八11~18 
神聖的事奉 
這裏所描述的，是所羅門事奉的心。 
•	聖殿並所及之處都為聖潔(11) ——關於所羅門將外邦妻子遷移到自己的宮室一事，這裏特給予理由解釋:聖殿及周圍地方不能受玷污。外邦女子是被視為不聖潔的，若她們太接近聖潔的殿，可能生命受到威脅，就是得罪聖潔的神而招致滅亡。 
•	經常獻祭事奉(12~13) ——不是所羅門扮演了祭司角色去親自獻祭，乃是在他引導下由祭司主理。這是在廊子前的事奉，是全以色列人均可出席之處。建殿最大目的是向神獻祭敬拜，現今成就了。不是一時或只在特定時間才如此做，乃是經常獻祭事奉。每年三大節日及其他一般節日都有這種獻祭儀節。 
•	有條理及甘心的事奉(14~15) ——事奉不能隨便及毫無安排，故所羅門便按着班次來進行各項事奉工作。參與事奉的祭司及利未人，他們甘心投入，不違背當行的決定。 
所羅門既是如此盡心的事奉神，帶領國民過着正常的宗教生活，神自然繼續祝福他，使一切財富與物料都豐富非常。希蘭將船隻送到所羅門那裏，相信不是透過水路，乃是透過陸路，就是將船隻零件以陸路運送到以色列後才組合起來。 
基督徒有極大的福氣，在今世有資格事奉那位永恒神聖的主。但我們必須小心謹慎，不要將事奉視作平常，久而久之就會敷衍了事。從所羅門的表現得知，在生命上我們不能以污穢本性呈獻在主前，在行動上又不應一曝十寒或是毫無計劃與安排。神會祝福真正事奉祂的人，卻會拒絕「無心」的事奉者。 
思想	信主多年的你仍有珍惜目前的事奉嗎？—《新舊約輔讀》 
 
歷代志下九1~12 
偉人背後  
所羅門是一位偉大的君王，這是本書卷不斷重複的主題。在此之前，主要是從建殿事工上看所羅門的偉大，這一段經文則從另一角度來表達： 
•	享譽國際(1) ——不單以色列民知道所羅門的偉大，連國外的人也有所聞，示巴女王來到耶路撒冷就是最好的明證。示巴大概在阿拉伯南部，以貿易發達見稱，女王可能是透過商人而得知所羅門的名聲。從示巴來到耶路撒冷，需要完成 2600 公里的旅程。 
•	從智慧及財富上見偉大(2~7、9~12) ——所羅門的智慧分別顯明在宮室的建造、國民的治理、服飾與其他建設上，致使女王受感動而顯詫異。所羅門財富充裕、物質豐富。他收下別人的進貢固然極多，但他賜予出去的就更多。他回禮給示巴女王，是超過當時外交禮節的標準，可知他實在是富有的。這裏提及與希蘭僕人一同參與貿易，無非在加強說明所羅門的豐富，這一切都是神的祝福。 
•	人的偉大指向神的偉大(8) 示巴女王看清楚了，所羅門的偉大至終乃因他的神偉大，故應當稱頌祂。所羅門坐的國位，不是屬他自己的，也不是屬以色列民的，乃是屬神的。 
神祝福人，會使他得着世上各種的財富與榮耀，這本是無可厚非;也是一些偉人出現的背後因素。然而，在景仰此等人物之餘，基督徒必須要超越「人」而看到「神」。水平面的觀點(人看人)應該有垂直面的觀點(人看神)來平衡。物質世界的偉大應該受到屬靈世界的偉大來規限。我有過分欣賞人，以致忘記了神的偉大嗎?當神抬舉我，使我被人欣賞，我有謙卑下來嗎? 
思想  
當你盡力顯示自己的才華與能力時，有深深的檢視一下自己的動機嗎?  
 
歷代志下九13~21 
人間至榮耀的日子  
所羅門在世上所享受的一切，可說是空前絕後，以色列在地上得着的威榮，也是一時無兩，列國都羨慕不已。 
•	所羅門為王中之王(13~14) ——他掌握着很多貿易通道，致使每年得到極多稅項。六百六十六他連得的金子，是驚人的數字，今天約值數千萬元。列國君王及省長都尊崇所羅門，願意進貢。 
•	榮耀生活化(15~20a) ——金子所表達的威榮，所羅門没有隱藏起來。藉着生活各層面所用的器皿，例如：擋牌、盾牌、大寶座、金腳凳、飲器及其他器皿來彰顯出自己擁有的榮耀與豐富。列國不能效法，只有欣賞羨慕而已。獅子象徵着王的力量與大能。 
•	財源滾滾(20b~21) ——所羅門不是只霎時享有豐富財物，仍是經常豐足，以致銀子已算不得甚麼。他施可以指西班牙南部的一個港口，也可能是指遙遠的意思。這裏表示了所羅門參與海外遠程貿易，開拓更遠的市場，獲取更多不同的商品。 
從人的角度看，所羅門確是活在人間至榮耀的日子裏。這裏經常出現「金子」的字眼，代表至高、至貴重及至榮耀的意思。誰人能得着呢？不是別人，正是所羅門。 
神應許賜極大的榮耀與豐富給所羅門，現在一一成就了。人活在世上可享有的福分可以是包括物質方面的。我們不應過分消極的去排斥此等所謂物質的東西。畢竟，這是天父的世界，物質是祂創造給我們享用的。 
不過，在至榮耀日子裏，我們當想念賜這一切豐富與榮耀的神，切勿讓這些「金子」成為我們信仰的絆腳石。 
思想 
當我接受別人給予我的推崇與讚賞，我有記念我的神嗎？—《新舊約輔讀》 
 
歷代志下九22~31 
一生的成就 
所羅門成功地治理國家，使以色列民在國運及地位上都達至高峯。雖然他並非毫無缺點，這可從其他書卷得知，但終其一生確有卓越的成就。 
•	天下列王皆尊崇所羅門(22~25) ——所羅門登位時，神應許賜他智慧和財富。結果，當應許一一實現時，他顯然凌駕諸王之上，以致他們都尊崇他，樂意求見和進貢，表示出一副心悅誠服的態度。 
•	所羅門統管廣闊大地(26~28) ——所羅門影響力遍及的範圍十分大，這包括了北界的幼發拉底河、西界的非利士及南界的埃及。此等地方都獻極多財物給他。同時，由於以色列王國處於歐、亞、非三洲交匯處，擁有貿易通路權，故也成了馬匹買賣的中樞地點。 
•	保守大衛王朝(29~31) ——所羅門統治以色列四十年，成功地完成兩大任務:建殿工作及保守王朝。最後他平平安安的離世了。國家强盛加上天下列王又臣服，已是他一生最大的成就了。記載他生平事蹟的資料很多，包括拿單的書(指廣泛的歷史記錄)、亞希雅與易多所領受的預言與默示的記錄(較狹窄的觀點，僅指他們所看見、所洞悉的各種事件意義)。 
我們未必擁有所羅門的偉大與成就，但神既給予我們在世生存的機會，祂必然有一定的人生計劃期盼我們去完成。若是這樣，我就不能不問自己:我有敬畏神、得着屬靈智慧與豐富，好贏得別人對我的尊崇嗎?我屬靈的影響力能否使更多人蒙受神的祝福呢?我在世上曾竭力完成神交託給我的任務，並成功地傳遞異象給下一代嗎？對生命多一點認真，人生所成就的應該會多一點。 
思想 
我怎樣理解每天慣常要完成的工作。是漫無目的，還是有重大意義？—《新舊約輔讀》 
 
歷代志下十1~11 
錯誤的抉擇 
羅波安繼位不久，便前往示劍，接受以色列十支派的冠冕，無奈，他卻遇到困難。示劍位於基利心山和以巴路山之間，是古代以色列的軍事、政治及宗教中心。 
•	眼前的難題(2~4) ——耶羅波安聽見這事，明顯是指所羅門的逝世及羅波安繼位的事。他代表以色列人祈求新王減輕負擔。根據考古資料，古代美索不達米亞一些君王會在登基之時有減輕百姓苦工的行動，故可能以色列人也期望着這種改變。他們要交重稅及作苦工，乃與所羅門極多建殿建城的行動有關。今羅波安要處理這難題。 
•	停一停、想一想(5) ——羅波安很明智，他没有即時回答，他需要想想。因此，他叫他們日後再來。 
•	不聽老人言(6~11) ——以色列傳統頗為尊重老年人及其智慧，故羅波安這次是作錯了，他不接受安撫及以退為進的方法。所謂「好話」，不僅是指好聽的話，更是與較為嚴謹的外交承諾有關。羅波安轉而求問其他少年人，相信大多是他的堂兄弟或其他王室成員，他們強調使用高壓政策。蠍子鞭本身帶有鐵鈎或鐵粒，故殺傷力也較大。羅波安採納他們的主意，帶來國家分裂，這顯明他作了錯誤的抉擇。 
無人願意作出錯誤的抉擇，人人都希望無錯誤，基督徒也没有例外。羅波安的失敗就在於他找錯了對象作諮詢人，加上他權力慾太强，過分逞勇所致。其實，面對抉擇時，我們切要禱告尋求神的心意。這裏，他好像全忘記了神一樣! 
思想  
無論大小事情，每當我要決定如何作時，我腦海中有想及神、並祂的吩咐嗎? 
 
歷代志下十12~19 
無法挽回的定局  
王國的分裂，背後的因素很多，我們可在這裏窺見一二。 
•	羅波安專橫使事情惡化(12~14) ——他本有責任以公正、公義的手法處理以色列人的要求;無奈他專橫自恃，不聽老年人的意見，乃以嚴厲的說話回覆以色列人，致使事情惡化下去。 
•	所羅門種下分裂遠因(15) ——所羅門曾多行神不喜悅的事，不專心順從耶和華，結果種下分裂的禍根(參王上十一 1-13)。是故，王不依從百姓而做成國家分裂可說是出於神的心意。這裏無明言說所羅門離棄神，但強調亞希雅所說的話顯然已作了暗示。 
•	耶羅波安與以色列人的反叛(16~17) —— 他們拒絕歸向大衛家，並以强硬態度回應。雖然他們知道羅波安是神所揀選的王，但他們仍決心反叛。從此，分裂局面就形成了。 
•	局勢不可逆轉(18~19) ——羅波安仍想强加管治權，故差派哈多蘭往以色列人那裏去。他完全不能準確掌握形勢，更低估了以色列人的力量，結果只好慌忙逃回耶路撒冷。 
這事如此發展，終極因素雖是出於神，但人仍要為自己錯誤的行動負責。人作惡無智慧，自然當承受惡果。保羅說得好:「不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼。順着情慾撒種的，必從情慾收敗壞;順着聖靈撒種的，必從聖靈收永生。」(加六 7~8) 人犯罪時，有時神並没有直接的阻止，但這不是說，神接受我們這種犯罪行動。神會尊重我們在道德行為上的自由抉擇而暫且緘默，可是，人承擔惡果確是免不了。今天，我想收甚麼果子呢? 
思想 
你是一個衝動的基督徒嗎？你曾否有後悔的經歷？ —《新舊約輔讀》 
 
歷代志下十一1~23 
成功管治猶大 
羅波安要承受王國分裂的惡果，只有二支派跟隨他。但就統治南國猶大而言，他開始時卻頗為成功。 
•	不再與北國爭戰(1~4) ——羅波安聽從神的吩咐，維持這分裂現狀，不再爭戰。北國以色列人仍是他們的「弟兄」，若期望復合，最好留待將來，現在不能靠軍事來解決。 
•	建立堅固城(5~12) ——城得堅固乃神的祝福。所修築的城，全部只在猶大的東方、西方及南方，卻没有在北方。這可能因為羅波安感到北國威脅不大，又可能他期待北國會回歸復合。結果，猶大和便雅憫都歸了他，也表示他已成功地阻擋外國力量犯境。 
•	忠心分子(13~17) ——北國離棄神，既不用利未人事奉神，又敬拜導人邪淫的鬼魔像，這都是神所不喜悅的事。利未人忠於其聖潔呼召，寧捨棄北國屬土，也不作惡。他們回歸羅波安，站在他一方，一羣不願離棄神，反倒定意尋求神的以色列人也加入這回歸行列，在南國建立高崇的宗教道德標準。這樣，神賜福他們，使他們享有三年平安的日子。 
•	家庭蒙福、國家强盛(18~23) ——多妻兒是蒙福的徵兆。為加强政治影響力及各地區効忠王室，羅波安乃以兒子管理各地。 
神的子民若行在神的旨意裏，又以神的律例作為生活標準，他們必蒙神祝福。在神眼中，他們是成功的一葉。今日，當我們發現自己的周圍景况，像是陷在一塌糊塗的地步，也許我們真要靜下來，思想自己是否有聽從神的吩咐而行;有沒有在信仰上持守忠貞的態度。忠於神的利未人及南下的百姓，他們為信仰緣故作了極大的犧牲，我自己又如何呢?我有貪戀世上的福樂嗎? 
思想 
你有「人在江湖，身不由己」的感覺嗎?若有，你會否相信這也許是我們没有行在神的引領中而導致的結果呢? —《新舊約輔讀》 
 
歷代志下十二1~16 
離棄神的收場 
羅波安因遵行大衛和所羅門的道，曾有三年時間蒙神悅納;然三年過後，他卻一反常態，走向叛逆的道路。 
•	離棄神招致國難(1~5) ——有點成就後，羅波安就看不起神，反倒敬拜假神，不行律法的要求。結果，神對不忠的子民施行審判，而且就是王在位第五年之時速速的臨到。示撒王大軍臨城，是因王和民得罪了耶和華，他們戰敗，也是這個緣故。 
•	自卑後略得拯救(6~12) ——其後的覺悟與自卑，拯救了他們免遭完全的毀滅，但仍要接受若干程度的懲罰，就是耶路撒冷被攻、神的殿及王宮的寶物被搶掠。羅波安離棄神確是錯了，故他不得不說耶和華是公義的。意思就是神是對的，他們卻是錯的。自卑、悔罪帶來一點生機，這是歷代志下七 14 神對所羅門應許的。這裏談及的善益事，並没有清楚說明是甚麼，可能是指國中仍存在一羣忠心分子，他們在真理中站穩，没有腐敗下去。 
•	王朝的結束(13~16) ——羅波安首三年作王確是自強，但整體來說卻只得着「行惡」的評價。基本原因乃因他没有尋求神的面，一失足成千古恨，真叫人為王惋惜! 
基督徒是指那一羣願意以神作為生命中心的人，理論上他們不會背道離棄神，但實際上卻非如此。離棄神的試探經常出現，又衝擊着他們弱小的心靈。稍一不慎，便會落入忘記神的光景中。面對這種試探，最佳之法莫如常存自卑、悔罪的態度，好叫我們不致自以為義，招致神的懲罰和管教。其實，我們更應積極尋求神的面，讓我們行惡的心得減至最低。 
思想  
你肯定自己永遠跟隨主嗎？你信不信自己有朝一日會「心易放蕩，離棄所愛之真神」呢？ —《新舊約輔讀》 
 
爭戰前的寶訓（歷代志下十三1~12）  
雖然在其他書卷記載了亞比雅的罪行,但在這裏則突出他的優點。亞比雅像是位作先知的，他在爭戰前說了番感人的話。 
•	猶大與以色列爭戰(1~3) ——在實力上顯然有分別,以色列的八十萬勇士佔盡了優勢。 
•	大衛王朝的正統性(4~8a) ——亞比雅的講話，第一點在指出神是站在大衛王朝一方。神是與大衛立誓約,意思是一個永久的承諾，是永遠有效的約。耶羅波安及跟從他的匪徒不服從大衛的統治是不當的。這樣作，不僅抗拒正統的王，也是敵擋神的表現。洗瑪臉山可能在伯特利南端、猶大與以色列的邊界上。 
•	耶路撒冷是聖潔之地(8b~12) ——亞比雅進步指出，只有南國耶路撒冷才是真正的宗教中心。北國的宗教腐敗，敬拜偶像，又隨便任用不合律法要求的人作人作祭司，這是離棄神的表現。相反，南國則按著律法要求進行各種儀節，是遵守神誡命的表現。最後，亞比雅直接向以色列人呼籲，叫他們回轉合一，不要與南國爭戰，不要忘記耶和華也是他們列祖的神。 
每位基督徒當處劣勢時都要仔細思量這番話。從人的角度看，我們可能是少數失勢分子；但假若有神同在，其實我們卻是「多數得勢」分子呢！神必因基督所成就的約繼續護衛我們，叫我們膽壯，又叫我們勇於面對前頭艱苦的歲月。 
當然，我們要問自己，我們仍有樂意事奉神的心嗎？有否按神的指引行事呢？否則，道路不亨通似乎不是神故意與我們為難，乃是我們沒有走在真理道路所得的結果而已。 
思想	你試過為真理奮鬥而落在孤單的處境中嗎？你的心路歷程怎樣？——《新舊約輔讀》 
倚靠神必得勝（歷代志下十三 13～12） 
亞比雅的一番話未能改變交戰的景況。耶羅波安決心採取軍事行動來定高下。 
雖然北國軍力較強，佈陣也較好，前呼後應，但神卻使他們敗在亞比雅的手下。猶大祭司「吹號」（14），象徵耶和華進入戰爭中。猶大人「吶喊」（15） ，表明以信心投靠神，且不是理論的信心，乃是有行動、有實踐的信心。 
以色列人「被制服」（18），這「被制服」一字與「自卑」相同，表明縱使耶羅波安先前不肯自卑，但終於他也要被神所折服而不得不「自卑」下來，接受最終的失敗。 
猶大人的勝利，至關鍵的因素不是別的，乃是「倚靠神」18節可算是整段經文的鑰節。 
這場爭戰影響深遠，從此耶羅波安一蹶不振，無復強盛。要或攻擊他，他就死了，意指一種突然的死亡。這是行惡者的收場，不順服神所得的結果。相反，亞比雅走順服神的道路，不僅是戰爭得勝，他也蒙神祝福，家庭妻兒眾多（21） 。 
在屬靈的爭戰上，基督徒應誇口甚麼呢？不是自己的知識、聰明或地位，乃是自己的軟弱，這樣才能得勝。 
當我們肯承認自己的無助、軟弱，我們就曉得依靠神，接受祂的能力和恩典；於是，我們就能真正剛強，打退惡魔、戰勝誘惑。 
這不是易學的功課，人好逞強的本性不易除掉，尤其是信主已久的基督徒，嘗過一些屬靈經歷。又懂得若干屬靈詞彙，就每每以為自己早已充分準備，靠己就必得勝。你我是這種人嗎？ 
思想	有人說基督教是「他力」（靠神得拯救）的宗教，而不是「自力」（靠己得拯救）的宗教，你同意嗎？若同意，你有貫徹始終走「他力」的道路嗎？——《新舊約輔讀》 
尋求神的結果（歷代志下十四 1~15） 
羅波安與亞比雅聯合統治大國達二十年時間，但繼位的亞撒的統治期卻有四十一年之久。由於亞撒敬虔事奉，促使國家有良好發展，這裏也用了極多篇幅來描述他的生平事蹟。 
•	尋求神使國家太平(1~8) ———這裏清楚指出,宗教與政治有密切關係。當王帶領人民尋求神，守律法誡命，又進行宗教改革，除掉偶像，神就在國家政治及社會建設上使猶大國蒙福，享受四境平安的福分，又有智慧力量建造城牆。「尋求神」這主題十分重要，這一章及接著之兩章都指出這是國家轉變的關鍵。邱壇是指迦南人建給外邦神的壇，那裏會進行一些淫褻的禮儀；柱像是獻給巴力神的；而木偶則與生育萬物的女神有關。 
•	仰賴神使戰爭得勝(9~15) ——尋求神的人自然會仰賴依靠神，而在急難中更是如此。凡事依靠神的人，縱然力量單薄，也可得勝。亞撒王向神的呼求，具體地表達了這個心聲。根據史學家考證，這次入侵可能發生在 900~897 B.C. 之間。古實人被打敗，不能再強盛，就是他們從此之後沒有鬥志爭戰。神使猶大國獲得徹底的勝利：猶大軍隊可乘勝追擊，甚至進城擄掠財物，然後才班師回朝。 
基督徒的人生是爭戰的人生，但意思不是與人爭鬥，乃是因天天都會面對各種試探與陷阱，若不以爭戰的心志去克服，就必失敗。爭戰得勝的要訣在那裏呢？是仰賴依靠神。我們切勿以為「己」的力量很大，面對罪惡勢力，「己」發揮的能力就算不得甚麼了。我們要仰賴神，自當尋求主的面。只有與主的關係打通了，遇到難處時才能奮力迎對。 
思想	即使你天天在社會圈子內拼命幹活，又在教會圈子內拼命事奉，但是否總感到失敗多於成功，沮喪多過快樂？你可曾想過或許皆因你從來沒有真正尋求神？——《新舊約輔讀》 
奮力從事改革（歷代志下十五 1~19） 
亞撒即位後已進行宗教革新工作，但他未見深廣，因此，神就藉著戰勝古實王事件鼓勵他繼續努力。 
•	鼓勵的信息(1~7) ——亞撒利雅在神的靈感動下，大膽準確的傳揚神的話。亞撒利雅的背景資料極稀少，但其姓名意指「神曾幫助」，在這裏卻富積極意義。信息可分三部分：第一部分指出神與人的條件式關係：人若忠於神，神必同在(2)；第二部分從救恩歷史裏舉出例證，來說明這事實：離棄神招致失敗和悲劇，忠於神則帶來勝利和福氣。這裏所描述的是士師時代。第 3、5並6 節指出當日受神懲罰的情況，第 4 節則在說明，人只要回轉尋求神，就可恢復正常和好的關係；第三部分則是勉勵的話，呼籲亞撒王繼續奮力下去，推動改革事工（7）。「你們」是非常強烈的個人化字眼，用以加強王及眾民積極回應的心。 
•	奮力革新（8～19）——亞撒的工作從各方面展開，包括了除掉偶像、修建聖典、帶領子民守約、貶太后及奉獻金銀器皿等。眾民於亞撒十五年三月聚集在耶路撒冷，乃為要慶祝五旬節。不尋求神者必被治死，這不是嚴厲，摩西律法早已申明（申十三6～10），亞撒一生誠實，直至亞撒三十五年止。其後，他跌倒了。 
今日教會面對荒涼景況，我們若要推行革新工作，人人就必須奮興起來。靠著聖靈的感動及領受激發人心的信息，相信是極好的開始。可惜今日，我們很少見到當代的「亞撒利雅」。我們也忽略了，外在的改革工作是必須有內裡生命、靈性的更新支持才能成功展開。弟兄姊妹，讓我們都一同謙卑地到主前，求祂先以祂的名和信息，來感動及激發我們的心。 
思想	你常感到今日教會陷入悶局、困境嗎？你常感到自己無力面對今日教會低落的景況嗎？——《新舊約輔讀》 
 
晚節不保（歷代志下十六1～14） 
亞撒曾奮力為神作工，使國家子民行在正道上。可惜，他沒有堅持到底。在位第三十六年，他跌倒了。 
•	靠軍力解決國家危機(1~6) ——拉瑪在耶路撒冷北十公里之處。以色列王修築拉瑪，欲切斷猶大國的通路。亞撒本可藉此機會，重新仰望神，得著奇蹟般的拯救，就像從前一樣。但他沒有如此，他投靠亞蘭王便哈達，以金銀促使亞蘭王在以色列之北展開另一戰線。結果，巴沙在不能兩面兼顧下，乃停止修築拉瑪。 
•	先知的責備(7~10) ——先見哈拿尼清楚指出，亞撒在這些事情上顯得愚昧，他對神失去信心，此後國家不再四境平安，反有爭戰。若當時亞撒投靠神，不單可征服以色列，也可攻陷亞蘭國。但因他依靠別國軍力，這事不成了，亞蘭王的軍兵就脫離了他的手。亞撒不獨沒有悔改，更將先見下在監裡，又虐待那些站在先見一方的人民。 
•	悲慘收場(11~14) ——王反叛神，直到死亡時也沒有悔改。他腳上的病，不能使他反思己過。他也只向醫生尋求醫治，沒有尋求耶和華幫助。尋找醫生本身不一定錯，但亞撒的錯則在於他再不理會神。王死後，國家按著當時習俗將他下葬。 
箴言說得對：「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」(箴四23)亞撒晚年沒有保守自己的心，導致他不再倚靠神，結果晚節不保，令人惋惜！我們作基督徒真要求神憐憫，保守我們一生行在主道上。一時的熱心未嘗沒有價值，但主卻要求我們熱心的為祂活一生。一時的得勝縱然令人興奮，然而一生的得勝，似乎才是我們當持守的目標。 
思想	你今天的事奉很成功嗎？若是，請細心思想亞撒晚年的人生片段。也求神賜你「虛心」來閱讀這段經文。 
 
深化改革（歷代志下十七 1~19） 
亞撒晚年離棄神，導致國家低落不安，但到了其兒子約沙法作王後，形勢便逐漸轉過來。 
•	靠神建立王權(1~6) ——約沙法即位後，由於了解到南北國的軍事緊張局面，乃加強駐防工作。不過，與其父親亞撒不同，他乃靠神而作事。此外，他行人衛初行的道，暗指他沒有跟隨大衛後期所犯的罪。他除掉邱壇，就是去掉那些「將迦南人廟宇改裝為獻祭給耶和華」的拜祭場所。他也破除亞舍拉女神像。約沙法高興作這些事情，意指他為此等行動感到自豪，神乃堅立他所作的一切。 
•	教導神的話語(7~9) ——約沙法看重神的話語，乃積極推行教導事工，使神的道更深入地影響子民的心思意念： 
1.	教導的時間：在他作王的第三年。很大可能首二年是與父親共政，他父親亞撒因腳病不能親自參政。 
2.	教導的負責人：有宗教領袖(祭司、利未人)及平信徒(臣子)。 
3.	教導的內容和對象：教導摩西五經給各城的百姓。 
•	神大大的祝福王(10~19) ————約沙法忠心地發展宗教改革事工，神乃使他在國際威望上、工程上及軍力上得福。 
罪惡勢力極易捲土重來，除非我們肯在敬虔生活上不斷操練。約沙法定意推行改革事工不遺餘力，表明他絕不與罪惡妥協。我們也當有這股銳氣面對各種誘惑試探。然則，這股進深力量從何而來呢？是神的話。今天，我渴慕主的話語嗎？其實，基督徒成長得勝的過程，就是讓神的話語溶入我們生命裡頭的過程。每個基督徒都想蒙神大大賜福，但相信只有服從神話語者才能得著。 
祈禱 主啊，願我的生命可以被祢話語所革新。——《新舊約輔讀》 
 
向罪惡勢力妥協（歷代志下十八 1~11） 
約沙法曾經靠著神話語的力量，奮力消除國內極大的罪惡勢力。無奈，當他大享威榮時，他竟逐漸走向腐敗之路。 
•	失敗的第一步(1) ——北國亞哈王是一位敗壞的君王，他不行耶和華眼中看為正的事。但約沙法完全不計較，竟與亞哈建立姻親關係。他忘記了自己蒙神祝福乃因忠於神的緣故，結親的決定實屬不當。 
•	進一步與罪惡勢力結連(2~3) ——在歡樂的飲宴吃喝中，約沙法不再理會神的心意，決定與北國結盟，共同攻打基列的拉末。 
•	正邪力量醞釀鬥法(4~11) ——約沙法對這次軍事行動仍有點猶疑，他盼望從先知口中得到一些確據。北國四百位先知雖異口同聲說可以去，但他仍感不滿意；他的良知已亮起紅燈。結果，米該雅被召說預言。米該雅是位孤獨的先知，因他常說逆耳之忠言，與大眾期望的意見不相符。代表四百位先知的西底家，拿出兩個鐵角，象徵「有力量」，可以上去攻打拉末，取得完全的勝利。他們也相信，藉著此等預言和行動，有助於奪取勝利而歸。米該雅卻不同意他們的見解。 
列王的失敗經驗一次又一次的提醒我們，警醒是十分難學的功課。尤其當我們在屬靈事工取得一定的成果時，往往又在不知不覺中走回倒退妥協的道路上。我們的失敗多不會在朝夕之間發生，卻往往因在微小的事情上讓步所致。結果，妥協愈多，聽從神的聲音就越少。這不是說，神不願意再提醒我們何謂善何謂惡，其實，乃是我們聽而不聞而已！心妥協了，求問真先知之言又有何用呢！ 
思想	靜靜回想一下，這些日子有否與罪惡勢力妥協。 
真先知的勝利（歷代志下十八12~34） 
•	真先知權柄來源（12～13）——米該雅認為真先知之言有權柄，不在乎眾人怎樣説，乃在乎神怎樣說。 
•	真先知的話洞悉真相（14～22）——起初米該雅的話與其他四百位先知所說的相同，好像他與他們的立場一致。其實不然，他還看到其他先知所看不見的，就是以色列王（即牧人）將會死亡，戰爭只得結束，各人平安回家。米該雅還更深的看到靈界真相，就是導致亞哈敢於起兵攻打亞蘭王，乃因謊言的靈藉著四百位先知的口，引誘王踏上陣亡的腦路。這一切發生，都為神所准許，所以說「耶和華坐在寶座上，天上的萬軍侍立在他左右」（18），表明神掌管一切。終極上耶和華與這些有關連，所以經文在描述時將神放在主動策劃的位置上。 
•	否定真先知的話（23～27）——他們不相信米該雅的話。但米該雅指出，西底家終有一天逃避神的審判時，躲在屋內，就會想通了。「王的兒子」多是指一種與處理囚犯有關的王室職分。平安回來即安全返國的意思，也就是亞哈不相信自己會陣亡。 
•	真先知的話應驗了（28～34）——真先知之言經得起考驗。果然，「恰巧」的箭就成了「耶和華」的箭，亞哈蘭難逃劫數。 
當國家陷在罪惡中，宗教也極易腐敗。縱然維持了表面的宗教儀節及職分，但屬靈的實況卻是貧乏的，再不能聽到神的聲音及洞察到神的心意。我們處身在極世俗化的社會裡，也當小心。否則，我們一切的外表宗教儀節與職分盡歸徒然，不能在生命裡觸及靈界真相，更不用談明白神的旨意爲何。在混亂景況中洞悉神的心意及為神說話確是孤單的，但能作過現代的米該雅豈不是也常也是蒙福的人嗎！ 
祈禱	主呀，求你容我進到祢的深處，得見祢的權柄與榮光。——《新舊約輔讀》 
 
謹慎行主道（歷代志下十九 1~11） 
人誰過！知要緊的，乃是錯誤中醒悟過來。約沙發是一個好例子，他犯了過錯後，經反思而曉得人要謹慎活在主面前。 
•	王受譴責（1～3）——當約沙法安全的回到耶路撒冷，神就差遣先知來責備他，表示神絶不喜悅他在政治軍事上與亞哈聯合。幸而王受到的審判不太嚴重，神仍會祝福他。 
•	推行良好的審判工作（4～11）——經過失敗的教訓，王願意親自進入民間，從南到北，帶領人民歸向神。 
1.	設立區域審判官（5～7）——王從堅固城作開始，因這些地方受中央的影響較大，易於施行者這審判制度。約沙法需強調「謹慎」的功課，蓋他過去就曾不謹慎，胡亂與亞哈結盟，得罪了神。這些審判官只代表神行使權力，故在審判時，一定要持敬畏神的心去辦事，否則，就會偏離公正的道路。 
2.	設立上訴庭（8～11）——「以色列族長」（8） 意指猶大族長。約沙法在耶路撒冷設上訴庭，大凡各地不能圓滿解決的傻訴訟案，都交由這地方判決判斷。判斷的標準是神的律法，依著行才能避免得罪神。同時，神聖的個案（關乎聖殿敬拜）及世俗的個案（關乎政治外交）需要分開處理。 
太多時候，基督徒沒有謹慎行事，因而得罪神，招致神憤怒的臨到。要避免這種情況發生，我們必須敬畏神，這樣就不會隨意作出不討神喜悅的決定和行動。此外，接受清楚的教導也十分重要，有了真理的教導，我們才可以判斷正確、明辨是非，並可進一步行在主的道路上。弟兄姊妹，你願意如此活在神的面前嗎？ 
思想	當你做了錯事，除了認罪悔改外，你有否總結出一些教訓，來幫助你日後正確的行走前路？——《新舊約輔讀》 
 
靠神面對敵人（歷代志下二十1～19） 
本段經文可從四方面理解： 
•	國難臨近（1～2）——這次軍事攻擊是從南方來的，米烏尼人多是以東西珥山一帶的民族。隱．基底在死海西岸的中心地帶。 
•	禱告投靠神（3～13）——猶大國形勢險峻，但王沒有自恃，反倒以謙卑的心宣告禁食，全身投靠神。「新院」即外院或大院。約沙法以四大理求神幫助： 
1.	承認神是大能大力的主宰，祂有能力幫助他們（6）。 
2.	神曾應許賜福亞伯拉罕的後裔，居住這地不受干擾（7）。 
3.	神曾應許聆聽、成就從聖殿發出的呼求（8～9）。 
4.	敵人是無故的入侵（10～11） 。 
王乃聯同整體百姓向神仰望。 
•	神賜勝利的應許（14～17）——神藉利未人雅哈悉的口，應許猶大人必得勝。他們只要做三件事：不要懼怕、面對敵人毋需打仗、觀看神的作為。當然不是每一次遇敵都毋須採取軍事行動，但這次神級明確的如此吩咐。 
•	已經拜作回應18至19曉明他們深深的張信。 
人生不如意的事十常八九，我們無法逃避。基督徒要面對各種困難；基督教的信仰也是叫我們積極的面對苦難。我們被敵人惡人圍困，最大的盼望不在乎自己的能力，乃在乎大能的神。然則，我們有否藉禱告尋求神呢？人性的軟弱會使人懼怕即將臨到的痛苦和失敗。克服之道，不在於否定這種感受，或憑血氣力拼一次以求解決；乃是要我們信靠神，並認定勝敗之決定來自神。 
思想	有人説：「天助自助者」；也有人説：「天助無助者」。你的見解如何呢？ 
靠神全然得勝（歷代志下二十 20～37） 
•	信心的歌唱（20～21）——猶大子民順從神的吩咐，第二天便出來面對強敵。他們大有信心，以詩歌、等候及觀看來期待神的干預。王更扮演了祭司角色，用說話來激發會眾的信心。一般的爭戰重視軍隊的呼喊，但這時他們卻用頌讚來代替。 
•	神滅絕敵人（22～24）——不知何種緣故，他們的歌唱產生了一股殺敵的力量。敵軍彼此爭鬥，結果全軍覆亡。 
•	勝利帶來的結果（25～30）有四個： 
1.	得到大量財物珍寶，可見真是一次偉大的勝利。 
2.	猶大子民歡欣非常，不僅在戰場上如此，回到耶路撒冷也一樣，他們深深體會神實在是聽禱告的神。 
3.	列國懼怕猶大國，不敢隨意興兵犯境。 
4.	猶大國再次進入太平局面，沒有戰爭，這是神祝福的兆徵。 
•	約沙法一生的得與失（31～37）——總受來說，約沙法不失為一位敬虔的君王。然仍有兩件事有偏差：其一是部分百姓心不專一，繼續使用邱壇燒香獻祭；其二是王在晚年與以色列王聯盟，對神不忠，結果神毁壞其船隻，使之不能用作航海來表明祂的審判。 
神是信實的，祂說過要做的事，必然成就出來。我們當對神有信心，否則，怎能經歷勝利的時刻及分享勝利的成果呢！我們單有知識上的信心是不夠的，我們需要有行動上的信心。當日，約沙法所具備的信心行動是「大敵當前歌唱」；今日，我們的信心行動又是什麼呢？真正的信心，必會帶領我們穿越幽谷、熬煉而得勝，好使我們真正享受著喜樂、感恩，並神永遠長存的慈愛。 
祈禱	神啊，當我面對困境時，求祢最後仍使我嘗到得勝與歡欣。——《新舊約輔讀》 
 
乏善可陳的一生（歷代志下二十一 1~20） 
約蘭一生乏善可陳，因他是一位惡毒的君王。 
•	建立勢力（1～4）——他得國位，乃因他是長子，這暗示他在各方面的表現都不如其他兄弟。果然，為剷除異己分子，他狠心殺了眾兄弟及一些首領。 
•	心不正（5～7）——他與以色列國的政治及宗教關係緊密，以致不遵守神的律例典章，反倒向牛犢及巴力敬拜。神不立刻除滅他，乃因神極重視與大衛所立的約。 
•	離棄神的結果（8～17）——離棄神者，神必不保護他的國。這裡，我們看見以東人、立拿人、非利士人及阿拉伯人等起來抗拒猶大國的管治，或是成功地獨立，或是出兵攻擊，這都大大削弱了猶大國的勢力，也是神對約蘭的懲罰。此外，神使他患腸病，這是神對他個人直接的審判。有人以為以利亞不可能寫信給王，因按著列王紀下三11， 以利亞似在約沙法死前已離世。其實不一定，以利亞仍可能活至約蘭作王的早期，只因在約沙法晚年，他已甚少露面，好像死了一樣，故約沙法便找以利沙代替之。 
•	慘淡收場（18～20）——無人燒物件、無人思慕，就是指無人想他繼續活下去； 不與列王同葬，免玷污墳墓；這裡也不提及其他參考資料，似乎叫讀者不要再閱讀他的生平事蹟！ 
作為一個有信仰的人，相信最大的諷刺是一生所表現的，竟與所信的背道而馳。基督徒的名稱容易取得到，但基督的生命流露則不能蒙騙人。今天，你我是否只有基督徒的虛名而沒有實質呢？在神眼中，若我一生只落得乏善可陳的收場，我想我仍未真正相信過神。 
祈禱	主啊，教我行出祢喜悅的吩咐和教導。——《新舊約輔讀》 
 
惡勢力蔓延（歷代志下二十二 1～12） 
自從約沙法與亞哈建立姻親關係後，北國的罪惡勢力便一直干擾著南國王室。約蘭一生乏善可陳，其兒子亞哈謝也如此。 
•	亞哈謝登位（1～2）——通常君王登位不會只由耶路撒冷的居民擁立，應包括其他區域，但可能因處在非常時期才如此。登基時亞哈謝應為二十二歲，否則亞哈謝在他父親出生時已兩歲大！ 
•	繼續犯罪（3～6）——受了亞他利雅影響，亞哈謝行惡，罪惡勢力正不斷蔓延。王決定與亞哈兒子約蘭攜手爭戰，這事當然不為神所喜悅。基列的拉末地位重要，常成為列國必爭之地。 
•	審判突然臨到（7～9）——王對神不忠，神就藉著耶戶的手向亞哈謝施行審判。「突然死亡」就是結果。「出乎神」的意思就是一切在神引導下成就了。亞哈謝的惡運，正好與其祖父約沙法的忠貞成強烈對比。這裡也明顯不想提及其作惡的父親約蘭，反高舉了約沙法。 
•	篡位（10～12）——亞她利雅像其母耶洗別一樣，權力慾十分大。「剿滅」指殺掉所有男性繼承王位者。這裡沒有用傳統術語方式，介紹女王的掌權，可見她不屬正統君主。由於神重視與大衛所立的約，祂保存了大衛的後裔約阿施。 
我們不能輕看罪惡勢力，只要稍微一不慎，它就能吞食我們，使我們落在敵擋神的景況中。在日常生活裡，防止罪惡勢力侵佔我們的心靈的最好方法是「杜漸防微」，絲毫不讓它有機會坐大。此外，我們也當曉得，生命影響生命（無論好與不好）這道理是真確的。王受了其母親及他親戚的影響而陷在罪惡權勢下，這豈不提醒了我們當留意自己周圍的朋友親戚，究竟他們帶給我的是好還是壞的影響呢？ 
思想	你日常最多接觸的是那一類朋友？你感到他們對你的靈性生命有壞影響嗎？ 
 
重掌王權（歷代志下二十三 1～21） 
亞她利雅篡位後第七年，約阿施在耶何耶大協助下重掌王權。 
•	作王前的準備（1～7）——耶何耶大想到，先有實力作後盾才能取回政權，乃分別召見一些領袖及利未人，而且不限於居住耶路撒冷者，還包括猶大各城。立約就是訂定盟約，彼此同意，達致共識。他們最大的目標是恢復神的心意，讓大衛子孫作王，不准別人進耶和華的殿，目的是保護王免受殺害。 
•	正式立王（8～11）——王正式出來接受冠冕。「戴上冠冕」象徵王將自己獻給神，願按神的律法管治子民。「律法書」也可譯作「見證書」，就是指王每天要閱讀內裡的見證，叫他要守約、敬畏神、行律法等。「膏」是將油澆灌在頭上，象徵神揀選他作王。 
•	除掉罪魁禍首（12～15）——就是殺死亞她利雅。「柱旁」是指波阿斯柱或雅斤柱。王站在這裡，是敬拜時的特定位置。女王說反了、反了，從她眼中看確是造反，但從原來權力看卻不是。不在耶和華殿裡殺她，是不想玷污聖殿。 
•	進行改革（16～21） ——新的行動包括同心在神面前獻心、除偶像、重建敬拜生活及讓全國都尊約阿施為王。「安靜」是神賜給忠心者的福分。 
神喜悅祂的旨意行在地上，然罪惡勢力一時得逞，但終久必被除掉。在這個逆轉的過程中，基督徒可扮演什麼角色呢？我想我們必須如耶何耶大一樣，曉得並堅持神的心意，又把握良機讓它展現在地上。「重掌王權」意味著神與其子民的關係再次恢復。今天，我為「神人關係相通」的事工又擺上多少呢？ 
思想	面對教會信徒種種衰敗及俗世的生活表現，你曾作過何種改善與努力？——《新舊約輔讀》 
 
重修聖殿（歷代志下二十四1～16） 
有關約阿施的經文不多，因他不大忠心。然他也有善行，就是重修聖殿。這裏「神的殿」一詞出現了十多次。 
•	家庭與政治的情況（1～3）——約阿施作王後，蒙神祝福，生兒養女，與先前他自己為孤兒的苦況大大不同。王願意行耶和華眼中看為正的事，可惜，只限耶何耶大在世時才如此。這暗示了日後態度有改變。 
•	修殿事工遇困難（4～7）——這時敬拜生活已恢復，無奈聖殿仍有損壞，需要修理。王決心改善，但他沒有出錢，也沒有向利未人直接收取款項，乃是呼籲子民自由奉獻。不過，可能利未人感到出外募捐似不是他們分內的工作，反應不大好。 
•	修殿事工的完成（8～14）——王採取新募捐方法，就是將捐獻櫃放在殿門外，困難就解決了，修殿工程也得以完成。櫃放在門外，乃因百姓不能進入內院。「捐院」即捐滿的意思。百姓繼續忠心事奉神，但經文點出只限耶何耶大在世的時候，表明他們對神的心並不完全。 
•	耶何耶大逝世（15～16）——他一生為神重用，死時與王同葬，是極高的榮譽。他死時一百三十歲，較摩西、亞倫及約瑟還高。在以色列人心目中，司壽乃是神的祝福。 
我們需要重視敬拜生活，這不單指重視儀節的進行，也包括教會建築物及有關設備。我們對這些事物的態度，反映了是否樂意事奉神。不過，最重要的，還是我們是不是自發的敬畏尊重神，抑或只是受外在環境所逼才如此。王與百姓敬拜的心似都不是發乎百分百愛神的心，環境一變，他們的心也就隨之改變，這是有信仰者的悲劇。 
祈禱	神啊，求祢光照我的心，叫我曉得是否全心愛祢。——《新舊約輔讀》 
忘恩負義（歷代志下二十四17～27） 
耶何耶大去世後，猶大國的宗教政治生活立刻倒退過來。 
•	忘記神的厚恩（17～19）——神過去怎樣保守約阿施的性命，怎樣讓他重登王位，又祝福他的家庭，王全都忘記了。眾首領提出了背道的意見，他很快就同意並實行。不聽取神藉先知的多番警告。 
•	忘記耶何耶大的厚恩（20～22）——王離棄神後，自然也不將人放在眼內，縱使是恩人的兒子撒迦利亞來規勸，他竟忍心以兇殘手法對待。這是何等的諷刺：昔日他被保護之地，今卻成了他殺人之處；昔日恩人耶何耶大避免血濺聖殿，但王卻毫無忌憚的加以破壞，且流的竟是恩兒子的血。 
•	神施行審判（23～27）——面對這位忘恩負義的王，神不得不施行審判。只一年時間，懲罰就臨到猶大國。耶路撒冷雖沒有失守，但王的損失也極大。約阿施的生命也不保，很快便被背叛的臣僕殺掉。他雖被葬在大衛城，但經文清楚指出不能與列王同葬，這就表示他屬不義之王，他的死與耶何耶大的死，在意義上有極大的不同。這裡強調亞捫及摩押地，可能想藉此叫人知道，與外族建立婚姻關係（像猶大王一樣）是無好處的。 
人心是何等的兇殘與惡毒，在這件事上又再一次證明出來。今天，當我們享受主恩的時候，真需要主幫助我們永遠銘記在心中。指摘王的失敗倒是容易的，但我們何嘗不是常面臨這樣的試探！也許，我們需要間中撥些時間出來，讓自己安靜在神面前數算主恩，以至這種操練成為我們生活形態的一部分。這樣，才不會辜負神在我們身上施恩的作為。各位弟兄姊妹，你有這種感動媽嗎？ 
思想	中國人的文化傳統極之重視「報恩」的觀念，你認為它與聖經的教導有沒有共通之處？——《新舊約輔讀》 
 
心不專誠的鑒戒（歷代志下二十五 1～16） 
行為是生活的重要事，心思更是生活的重要事！ 
亞瑪謝行耶和華眼中看為正的事： 
1.	他照摩西律法書的教導，為父報仇而不濫殺無辜（3～4）。 
2.	他接受神人的忠告，撤走以色列十萬軍兵（6～10）。 
在日常生活中，神以書卷的記載教導我們，故我們要有每日讀經時間，研讀神的話語，並遵行其中的教訓。同樣神也使用祂僕人的宣講，我們領受了，也要切實執行！ 
這種每日每週的操練，是每個基督徒屬靈生命的需要，恒守的人，心靈必能茁壯成長。 
亞瑪謝雖行耶和華眼中看為正的事，但這不表示他是全人，因他「心不專誠」！ 
他看重金錢，並貪愛金錢。在撤回以色列十萬軍兵時，他關注「那一百他連得銀子」怎麼樣（9）。及至撤走軍兵，他卻不將當給的分予人，致惹怒了以色列人（10）。 
他戰勝以後，心高氣傲，也就敬拜偶像去了（14）！自大的人，必不敬拜真神，因為他自以為義，也自以為是。 
行為上的操守固然重要，但心靈的操練更不可忽略：「心懷二意的人哪，要清潔你們的心！」（雅四8） 
在當今的世代，金錢和自我常是我們信仰上很大的考驗，你曾經歷這些試探嗎？你又怎樣強壯自己的靈命，勝過金錢、自我的迷惑和衝擊呢？ 
思想	心思意念真是這麼重要嗎？為什麼聖經要多番提及？「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」（箴四23）——《新舊約輔讀》 
心高氣傲的收場（歷代志下二十五 17~28） 
有之於內必形於外！ 
亞瑪謝心高氣傲，連耶和華獨一真神他也放下，又豈會將以色列國放在眼內？ 
自高自大的人，仇恨相爭的心必重，眼中無人、目中無神，必然希望獨步宇內。「我們二人相見於戰場！」（17） 
約阿施點出亞瑪謝的弱點，就是「心高氣傲」。其實，彼此共存，生活在太平日子豈不好，何必殺戮於戰場之上呢？蒺藜豈配得上香柏樹，為何要苦苦相逼，而遭野獸踐踏呢？ 
一個連神的話也不肯聽從的人，又怎能接納忠告？於是，一個人的心高氣傲引致族人受苦、國家受苦。亞瑪謝被擒、耶路撒冷城牆被毁、神殿的一切金銀器皿被奪、王宮的財寶被拿去，並有人成了人質。一人作孽，全國蒙受苦難，何苦由來！ 
多少時候，我們總是偏執個人的成見，為報復而生活，為戰勝別人而生活，這都是心高氣傲在背後作崇。箴言明證：「驕傲在敗壞以先；狂心在跌倒之前。」（箴十六18）  
亞瑪謝初時守神誡命，蒙恩得力；但後來離棄耶和華，眾叛親離，並被人背叛，逃亡而被殺於路上（27），真是叫人嘆息！ 
「但各人被試探，乃是被自己的私慾牽引誘惑的，私慾既懷了胎，就生出罪來； 罪既成長，就生出死來。」（雅一14～15） 
祈禱	求主賜我謙卑的心，叫我懂得過尊主為大的生活。——《新舊約輔讀》 
 
才略與生命（歷代志下二十六 1～23） 
在南國諸王中，烏西雅是最具才略的君王： 
•	他敬拜真神（5） ， 
•	他征服四鄰（6～8）， 
•	他修築軍事設施（9）， 
•	他添設農業裝備（10）， 
•	他設立軍隊階級（11～13）， 
•	他設軍隊器械（14～15）。 
烏西雅是一位政治、軍事、經濟的專才，他的執政帶來南國一片美麗的憧憬，昔日大衛和所羅門的光輝似乎是指日可待了。 
但烏西雅的成功，並不全然是他的才略，最重要的因素，是他得了「非常的幫助」（15）。這非常的幫助不是從人的本能來的，而是天上的耶和華使他亨通（5）！ 
有些人不能遭挫敗，一遇挫敗，就放下信仰；有些更不能成功，一旦成功，便把救主忘記。烏西雅既強盛起來，也就心高氣傲，干犯耶和華的誡命，上殿燒香了。 
君王的職事是負責國家行政事務，祭司的職事是處理聖殿事務。掃羅王已於早前犯了禍而成了鑒戒，現在的烏西亞又漠視神的法則，公然向八十位勇敢難攔阻他的祭司發怒，神的刑罰隨即臨到他——「額上忽然發出大痲瘋」（19）。 
一代英雄得此下場，實在令人三炭！才略成為他的試金石，我們在事奉上或有些微可誇之處，但豈能不謹慎小心？求主憐憫我們，使用我們！ 
當這一代英雄駕崩之際，神的心意卻在一位青年人的身上開啟，但他的事奉不是在於才略，而是在於從上頭來的力量。 
祈禱	求主除去我的驕傲，賜我一顆謙卑的心。——《新舊約輔讀》 
 
美中不足的憾事（歷代志下二十七1～9） 
約坦行耶和華眼中看為正的事！ 
1.	他愛護神的殿宇，建立耶和華殿的上門（3）。 
2.	他忠於君王職守，為國家設置屏障，保護國民（4）。 
3.	他是勇於的戰士，戰勝亞捫人，並得著他們每年的進貢（5）。 
4.	他行為正直，遵守正道，得神喜悅，以致國勢日漸強盛（6）。 
人生的缺憾是否必然的呢？約坦實在有其優點、被神稱讚之處；然而，約坦「只是不人耶和華的殿」（2）。詩人說：「萬軍之耶和華啊，祢的居所何等可愛！我羨慕渴想耶和華的院宇；我的心腸，我的肉體向永生神呼籲⋯⋯祢是我們的盾牌；求祢垂顧看祢受膏者的面！在祢的院宇住一日，勝似在別處住千年；寧可在我神殿中看門，不願住在惡人的帳棚裏。」（詩八十四1～2，9～10） 
聖經中沒有解釋約坦為什麼不入耶和華的殿，但記述了他一生中「美中不足的憾事」；同樣地，有一些信徒也不入耶和華的殿，他們不在神的家敬拜，不在神的家團契，不在神的家事奉。他們是基督徒，卻不是一名負責任的會友。可能的原因很多，或是歷史的因素，或是客觀的難處。但不入耶和華的殿，不享受完全聖潔的基督徒生命，就是人生的損失，也就是你個人的過失！ 
人生的缺憾不是必然的，詩人說：「靠祢有力量、心中想往錫安大道的，這人便為有福！他們經過「流淚浴」，叫這谷變為泉源之地；並有秋雨之福蓋滿了全谷。他們行走、力上加力，各人到錫安朝見神。」（詩八十四5～7） 
思想	人生的缺憾是否必然？——《新舊約輔讀》 


爭戰前的寶訓（歷代志下十三1~12）  
雖然在其他書卷記載了亞比雅的罪行,但在這裏則突出他的優點。亞比雅像是位作先知的，他在爭戰前說了番感人的話。 
•	猶大與以色列爭戰(1~3) ——在實力上顯然有分別,以色列的八十萬勇士佔盡了優勢。 
•	大衛王朝的正統性(4~8a) ——亞比雅的講話，第一點在指出神是站在大衛王朝一方。神是與大衛立誓約,意思是一個永久的承諾，是永遠有效的約。耶羅波安及跟從他的匪徒不服從大衛的統治是不當的。這樣作，不僅抗拒正統的王，也是敵擋神的表現。洗瑪臉山可能在伯特利南端、猶大與以色列的邊界上。 
•	耶路撒冷是聖潔之地(8b~12) ——亞比雅進步指出，只有南國耶路撒冷才是真正的宗教中心。北國的宗教腐敗，敬拜偶像，又隨便任用不合律法要求的人作人作祭司，這是離棄神的表現。相反，南國則按著律法要求進行各種儀節，是遵守神誡命的表現。最後，亞比雅直接向以色列人呼籲，叫他們回轉合一，不要與南國爭戰，不要忘記耶和華也是他們列祖的神。 
每位基督徒當處劣勢時都要仔細思量這番話。從人的角度看，我們可能是少數失勢分子；但假若有神同在，其實我們卻是「多數得勢」分子呢！神必因基督所成就的約繼續護衛我們，叫我們膽壯，又叫我們勇於面對前頭艱苦的歲月。 
當然，我們要問自己，我們仍有樂意事奉神的心嗎？有否按神的指引行事呢？否則，道路不亨通似乎不是神故意與我們為難，乃是我們沒有走在真理道路所得的結果而已。 
思想	你試過為真理奮鬥而落在孤單的處境中嗎？你的心路歷程怎樣？——《新舊約輔讀》 
倚靠神必得勝（歷代志下十三 13～12） 
亞比雅的一番話未能改變交戰的景況。耶羅波安決心採取軍事行動來定高下。 
雖然北國軍力較強，佈陣也較好，前呼後應，但神卻使他們敗在亞比雅的手下。猶大祭司「吹號」（14），象徵耶和華進入戰爭中。猶大人「吶喊」（15） ，表明以信心投靠神，且不是理論的信心，乃是有行動、有實踐的信心。 
以色列人「被制服」（18），這「被制服」一字與「自卑」相同，表明縱使耶羅波安先前不肯自卑，但終於他也要被神所折服而不得不「自卑」下來，接受最終的失敗。 
猶大人的勝利，至關鍵的因素不是別的，乃是「倚靠神」18節可算是整段經文的鑰節。 
這場爭戰影響深遠，從此耶羅波安一蹶不振，無復強盛。要或攻擊他，他就死了，意指一種突然的死亡。這是行惡者的收場，不順服神所得的結果。相反，亞比雅走順服神的道路，不僅是戰爭得勝，他也蒙神祝福，家庭妻兒眾多（21） 。 
在屬靈的爭戰上，基督徒應誇口甚麼呢？不是自己的知識、聰明或地位，乃是自己的軟弱，這樣才能得勝。 
當我們肯承認自己的無助、軟弱，我們就曉得依靠神，接受祂的能力和恩典；於是，我們就能真正剛強，打退惡魔、戰勝誘惑。 
這不是易學的功課，人好逞強的本性不易除掉，尤其是信主已久的基督徒，嘗過一些屬靈經歷。又懂得若干屬靈詞彙，就每每以為自己早已充分準備，靠己就必得勝。你我是這種人嗎？ 
思想	有人說基督教是「他力」（靠神得拯救）的宗教，而不是「自力」（靠己得拯救）的宗教，你同意嗎？若同意，你有貫徹始終走「他力」的道路嗎？——《新舊約輔讀》 
尋求神的結果（歷代志下十四 1~15） 
羅波安與亞比雅聯合統治大國達二十年時間，但繼位的亞撒的統治期卻有四十一年之久。由於亞撒敬虔事奉，促使國家有良好發展，這裏也用了極多篇幅來描述他的生平事蹟。 
•	尋求神使國家太平(1~8) ———這裏清楚指出,宗教與政治有密切關係。當王帶領人民尋求神，守律法誡命，又進行宗教改革，除掉偶像，神就在國家政治及社會建設上使猶大國蒙福，享受四境平安的福分，又有智慧力量建造城牆。「尋求神」這主題十分重要，這一章及接著之兩章都指出這是國家轉變的關鍵。邱壇是指迦南人建給外邦神的壇，那裏會進行一些淫褻的禮儀；柱像是獻給巴力神的；而木偶則與生育萬物的女神有關。 
•	仰賴神使戰爭得勝(9~15) ——尋求神的人自然會仰賴依靠神，而在急難中更是如此。凡事依靠神的人，縱然力量單薄，也可得勝。亞撒王向神的呼求，具體地表達了這個心聲。根據史學家考證，這次入侵可能發生在 900~897 B.C. 之間。古實人被打敗，不能再強盛，就是他們從此之後沒有鬥志爭戰。神使猶大國獲得徹底的勝利：猶大軍隊可乘勝追擊，甚至進城擄掠財物，然後才班師回朝。 
基督徒的人生是爭戰的人生，但意思不是與人爭鬥，乃是因天天都會面對各種試探與陷阱，若不以爭戰的心志去克服，就必失敗。爭戰得勝的要訣在那裏呢？是仰賴依靠神。我們切勿以為「己」的力量很大，面對罪惡勢力，「己」發揮的能力就算不得甚麼了。我們要仰賴神，自當尋求主的面。只有與主的關係打通了，遇到難處時才能奮力迎對。 
思想	即使你天天在社會圈子內拼命幹活，又在教會圈子內拼命事奉，但是否總感到失敗多於成功，沮喪多過快樂？你可曾想過或許皆因你從來沒有真正尋求神？——《新舊約輔讀》 
奮力從事改革（歷代志下十五 1~19） 
亞撒即位後已進行宗教革新工作，但他未見深廣，因此，神就藉著戰勝古實王事件鼓勵他繼續努力。 
•	鼓勵的信息(1~7) ——亞撒利雅在神的靈感動下，大膽準確的傳揚神的話。亞撒利雅的背景資料極稀少，但其姓名意指「神曾幫助」，在這裏卻富積極意義。信息可分三部分：第一部分指出神與人的條件式關係：人若忠於神，神必同在(2)；第二部分從救恩歷史裏舉出例證，來說明這事實：離棄神招致失敗和悲劇，忠於神則帶來勝利和福氣。這裏所描述的是士師時代。第 3、5並6 節指出當日受神懲罰的情況，第 4 節則在說明，人只要回轉尋求神，就可恢復正常和好的關係；第三部分則是勉勵的話，呼籲亞撒王繼續奮力下去，推動改革事工（7）。「你們」是非常強烈的個人化字眼，用以加強王及眾民積極回應的心。 
•	奮力革新（8～19）——亞撒的工作從各方面展開，包括了除掉偶像、修建聖典、帶領子民守約、貶太后及奉獻金銀器皿等。眾民於亞撒十五年三月聚集在耶路撒冷，乃為要慶祝五旬節。不尋求神者必被治死，這不是嚴厲，摩西律法早已申明（申十三6～10），亞撒一生誠實，直至亞撒三十五年止。其後，他跌倒了。 
今日教會面對荒涼景況，我們若要推行革新工作，人人就必須奮興起來。靠著聖靈的感動及領受激發人心的信息，相信是極好的開始。可惜今日，我們很少見到當代的「亞撒利雅」。我們也忽略了，外在的改革工作是必須有內裡生命、靈性的更新支持才能成功展開。弟兄姊妹，讓我們都一同謙卑地到主前，求祂先以祂的名和信息，來感動及激發我們的心。 
思想	你常感到今日教會陷入悶局、困境嗎？你常感到自己無力面對今日教會低落的景況嗎？——《新舊約輔讀》 
 
晚節不保（歷代志下十六1～14） 
亞撒曾奮力為神作工，使國家子民行在正道上。可惜，他沒有堅持到底。在位第三十六年，他跌倒了。 
•	靠軍力解決國家危機(1~6) ——拉瑪在耶路撒冷北十公里之處。以色列王修築拉瑪，欲切斷猶大國的通路。亞撒本可藉此機會，重新仰望神，得著奇蹟般的拯救，就像從前一樣。但他沒有如此，他投靠亞蘭王便哈達，以金銀促使亞蘭王在以色列之北展開另一戰線。結果，巴沙在不能兩面兼顧下，乃停止修築拉瑪。 
•	先知的責備(7~10) ——先見哈拿尼清楚指出，亞撒在這些事情上顯得愚昧，他對神失去信心，此後國家不再四境平安，反有爭戰。若當時亞撒投靠神，不單可征服以色列，也可攻陷亞蘭國。但因他依靠別國軍力，這事不成了，亞蘭王的軍兵就脫離了他的手。亞撒不獨沒有悔改，更將先見下在監裡，又虐待那些站在先見一方的人民。 
•	悲慘收場(11~14) ——王反叛神，直到死亡時也沒有悔改。他腳上的病，不能使他反思己過。他也只向醫生尋求醫治，沒有尋求耶和華幫助。尋找醫生本身不一定錯，但亞撒的錯則在於他再不理會神。王死後，國家按著當時習俗將他下葬。 
箴言說得對：「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」(箴四23)亞撒晚年沒有保守自己的心，導致他不再倚靠神，結果晚節不保，令人惋惜！我們作基督徒真要求神憐憫，保守我們一生行在主道上。一時的熱心未嘗沒有價值，但主卻要求我們熱心的為祂活一生。一時的得勝縱然令人興奮，然而一生的得勝，似乎才是我們當持守的目標。 
思想	你今天的事奉很成功嗎？若是，請細心思想亞撒晚年的人生片段。也求神賜你「虛心」來閱讀這段經文。 
 
深化改革（歷代志下十七 1~19） 
亞撒晚年離棄神，導致國家低落不安，但到了其兒子約沙法作王後，形勢便逐漸轉過來。 
•	靠神建立王權(1~6) ——約沙法即位後，由於了解到南北國的軍事緊張局面，乃加強駐防工作。不過，與其父親亞撒不同，他乃靠神而作事。此外，他行人衛初行的道，暗指他沒有跟隨大衛後期所犯的罪。他除掉邱壇，就是去掉那些「將迦南人廟宇改裝為獻祭給耶和華」的拜祭場所。他也破除亞舍拉女神像。約沙法高興作這些事情，意指他為此等行動感到自豪，神乃堅立他所作的一切。 
•	教導神的話語(7~9) ——約沙法看重神的話語，乃積極推行教導事工，使神的道更深入地影響子民的心思意念： 
1.	教導的時間：在他作王的第三年。很大可能首二年是與父親共政，他父親亞撒因腳病不能親自參政。 
2.	教導的負責人：有宗教領袖(祭司、利未人)及平信徒(臣子)。 
3.	教導的內容和對象：教導摩西五經給各城的百姓。 
•	神大大的祝福王(10~19) ————約沙法忠心地發展宗教改革事工，神乃使他在國際威望上、工程上及軍力上得福。 
罪惡勢力極易捲土重來，除非我們肯在敬虔生活上不斷操練。約沙法定意推行改革事工不遺餘力，表明他絕不與罪惡妥協。我們也當有這股銳氣面對各種誘惑試探。然則，這股進深力量從何而來呢？是神的話。今天，我渴慕主的話語嗎？其實，基督徒成長得勝的過程，就是讓神的話語溶入我們生命裡頭的過程。每個基督徒都想蒙神大大賜福，但相信只有服從神話語者才能得著。 
祈禱 主啊，願我的生命可以被祢話語所革新。——《新舊約輔讀》 
 
向罪惡勢力妥協（歷代志下十八 1~11） 
約沙法曾經靠著神話語的力量，奮力消除國內極大的罪惡勢力。無奈，當他大享威榮時，他竟逐漸走向腐敗之路。 
•	失敗的第一步(1) ——北國亞哈王是一位敗壞的君王，他不行耶和華眼中看為正的事。但約沙法完全不計較，竟與亞哈建立姻親關係。他忘記了自己蒙神祝福乃因忠於神的緣故，結親的決定實屬不當。 
•	進一步與罪惡勢力結連(2~3) ——在歡樂的飲宴吃喝中，約沙法不再理會神的心意，決定與北國結盟，共同攻打基列的拉末。 
•	正邪力量醞釀鬥法(4~11) ——約沙法對這次軍事行動仍有點猶疑，他盼望從先知口中得到一些確據。北國四百位先知雖異口同聲說可以去，但他仍感不滿意；他的良知已亮起紅燈。結果，米該雅被召說預言。米該雅是位孤獨的先知，因他常說逆耳之忠言，與大眾期望的意見不相符。代表四百位先知的西底家，拿出兩個鐵角，象徵「有力量」，可以上去攻打拉末，取得完全的勝利。他們也相信，藉著此等預言和行動，有助於奪取勝利而歸。米該雅卻不同意他們的見解。 
列王的失敗經驗一次又一次的提醒我們，警醒是十分難學的功課。尤其當我們在屬靈事工取得一定的成果時，往往又在不知不覺中走回倒退妥協的道路上。我們的失敗多不會在朝夕之間發生，卻往往因在微小的事情上讓步所致。結果，妥協愈多，聽從神的聲音就越少。這不是說，神不願意再提醒我們何謂善何謂惡，其實，乃是我們聽而不聞而已！心妥協了，求問真先知之言又有何用呢！ 
思想	靜靜回想一下，這些日子有否與罪惡勢力妥協。 
真先知的勝利（歷代志下十八12~34） 
•	真先知權柄來源（12～13）——米該雅認為真先知之言有權柄，不在乎眾人怎樣説，乃在乎神怎樣說。 
•	真先知的話洞悉真相（14～22）——起初米該雅的話與其他四百位先知所說的相同，好像他與他們的立場一致。其實不然，他還看到其他先知所看不見的，就是以色列王（即牧人）將會死亡，戰爭只得結束，各人平安回家。米該雅還更深的看到靈界真相，就是導致亞哈敢於起兵攻打亞蘭王，乃因謊言的靈藉著四百位先知的口，引誘王踏上陣亡的腦路。這一切發生，都為神所准許，所以說「耶和華坐在寶座上，天上的萬軍侍立在他左右」（18），表明神掌管一切。終極上耶和華與這些有關連，所以經文在描述時將神放在主動策劃的位置上。 
•	否定真先知的話（23～27）——他們不相信米該雅的話。但米該雅指出，西底家終有一天逃避神的審判時，躲在屋內，就會想通了。「王的兒子」多是指一種與處理囚犯有關的王室職分。平安回來即安全返國的意思，也就是亞哈不相信自己會陣亡。 
•	真先知的話應驗了（28～34）——真先知之言經得起考驗。果然，「恰巧」的箭就成了「耶和華」的箭，亞哈蘭難逃劫數。 
當國家陷在罪惡中，宗教也極易腐敗。縱然維持了表面的宗教儀節及職分，但屬靈的實況卻是貧乏的，再不能聽到神的聲音及洞察到神的心意。我們處身在極世俗化的社會裡，也當小心。否則，我們一切的外表宗教儀節與職分盡歸徒然，不能在生命裡觸及靈界真相，更不用談明白神的旨意爲何。在混亂景況中洞悉神的心意及為神說話確是孤單的，但能作過現代的米該雅豈不是也常也是蒙福的人嗎！ 
祈禱	主呀，求你容我進到祢的深處，得見祢的權柄與榮光。——《新舊約輔讀》 
 
謹慎行主道（歷代志下十九 1~11） 
人誰過！知要緊的，乃是錯誤中醒悟過來。約沙發是一個好例子，他犯了過錯後，經反思而曉得人要謹慎活在主面前。 
•	王受譴責（1～3）——當約沙法安全的回到耶路撒冷，神就差遣先知來責備他，表示神絶不喜悅他在政治軍事上與亞哈聯合。幸而王受到的審判不太嚴重，神仍會祝福他。 
•	推行良好的審判工作（4～11）——經過失敗的教訓，王願意親自進入民間，從南到北，帶領人民歸向神。 
1.	設立區域審判官（5～7）——王從堅固城作開始，因這些地方受中央的影響較大，易於施行者這審判制度。約沙法需強調「謹慎」的功課，蓋他過去就曾不謹慎，胡亂與亞哈結盟，得罪了神。這些審判官只代表神行使權力，故在審判時，一定要持敬畏神的心去辦事，否則，就會偏離公正的道路。 
2.	設立上訴庭（8～11）——「以色列族長」（8） 意指猶大族長。約沙法在耶路撒冷設上訴庭，大凡各地不能圓滿解決的傻訴訟案，都交由這地方判決判斷。判斷的標準是神的律法，依著行才能避免得罪神。同時，神聖的個案（關乎聖殿敬拜）及世俗的個案（關乎政治外交）需要分開處理。 
太多時候，基督徒沒有謹慎行事，因而得罪神，招致神憤怒的臨到。要避免這種情況發生，我們必須敬畏神，這樣就不會隨意作出不討神喜悅的決定和行動。此外，接受清楚的教導也十分重要，有了真理的教導，我們才可以判斷正確、明辨是非，並可進一步行在主的道路上。弟兄姊妹，你願意如此活在神的面前嗎？ 
思想	當你做了錯事，除了認罪悔改外，你有否總結出一些教訓，來幫助你日後正確的行走前路？——《新舊約輔讀》 
 
靠神面對敵人（歷代志下二十1～19） 
本段經文可從四方面理解： 
•	國難臨近（1～2）——這次軍事攻擊是從南方來的，米烏尼人多是以東西珥山一帶的民族。隱．基底在死海西岸的中心地帶。 
•	禱告投靠神（3～13）——猶大國形勢險峻，但王沒有自恃，反倒以謙卑的心宣告禁食，全身投靠神。「新院」即外院或大院。約沙法以四大理求神幫助： 
1.	承認神是大能大力的主宰，祂有能力幫助他們（6）。 
2.	神曾應許賜福亞伯拉罕的後裔，居住這地不受干擾（7）。 
3.	神曾應許聆聽、成就從聖殿發出的呼求（8～9）。 
4.	敵人是無故的入侵（10～11） 。 
王乃聯同整體百姓向神仰望。 
•	神賜勝利的應許（14～17）——神藉利未人雅哈悉的口，應許猶大人必得勝。他們只要做三件事：不要懼怕、面對敵人毋需打仗、觀看神的作為。當然不是每一次遇敵都毋須採取軍事行動，但這次神級明確的如此吩咐。 
•	已經拜作回應18至19曉明他們深深的張信。 
人生不如意的事十常八九，我們無法逃避。基督徒要面對各種困難；基督教的信仰也是叫我們積極的面對苦難。我們被敵人惡人圍困，最大的盼望不在乎自己的能力，乃在乎大能的神。然則，我們有否藉禱告尋求神呢？人性的軟弱會使人懼怕即將臨到的痛苦和失敗。克服之道，不在於否定這種感受，或憑血氣力拼一次以求解決；乃是要我們信靠神，並認定勝敗之決定來自神。 
思想	有人説：「天助自助者」；也有人説：「天助無助者」。你的見解如何呢？ 
靠神全然得勝（歷代志下二十 20～37） 
•	信心的歌唱（20～21）——猶大子民順從神的吩咐，第二天便出來面對強敵。他們大有信心，以詩歌、等候及觀看來期待神的干預。王更扮演了祭司角色，用說話來激發會眾的信心。一般的爭戰重視軍隊的呼喊，但這時他們卻用頌讚來代替。 
•	神滅絕敵人（22～24）——不知何種緣故，他們的歌唱產生了一股殺敵的力量。敵軍彼此爭鬥，結果全軍覆亡。 
•	勝利帶來的結果（25～30）有四個： 
1.	得到大量財物珍寶，可見真是一次偉大的勝利。 
2.	猶大子民歡欣非常，不僅在戰場上如此，回到耶路撒冷也一樣，他們深深體會神實在是聽禱告的神。 
3.	列國懼怕猶大國，不敢隨意興兵犯境。 
4.	猶大國再次進入太平局面，沒有戰爭，這是神祝福的兆徵。 
•	約沙法一生的得與失（31～37）——總受來說，約沙法不失為一位敬虔的君王。然仍有兩件事有偏差：其一是部分百姓心不專一，繼續使用邱壇燒香獻祭；其二是王在晚年與以色列王聯盟，對神不忠，結果神毁壞其船隻，使之不能用作航海來表明祂的審判。 
神是信實的，祂說過要做的事，必然成就出來。我們當對神有信心，否則，怎能經歷勝利的時刻及分享勝利的成果呢！我們單有知識上的信心是不夠的，我們需要有行動上的信心。當日，約沙法所具備的信心行動是「大敵當前歌唱」；今日，我們的信心行動又是什麼呢？真正的信心，必會帶領我們穿越幽谷、熬煉而得勝，好使我們真正享受著喜樂、感恩，並神永遠長存的慈愛。 
祈禱	神啊，當我面對困境時，求祢最後仍使我嘗到得勝與歡欣。——《新舊約輔讀》 
 
乏善可陳的一生（歷代志下二十一 1~20） 
約蘭一生乏善可陳，因他是一位惡毒的君王。 
•	建立勢力（1～4）——他得國位，乃因他是長子，這暗示他在各方面的表現都不如其他兄弟。果然，為剷除異己分子，他狠心殺了眾兄弟及一些首領。 
•	心不正（5～7）——他與以色列國的政治及宗教關係緊密，以致不遵守神的律例典章，反倒向牛犢及巴力敬拜。神不立刻除滅他，乃因神極重視與大衛所立的約。 
•	離棄神的結果（8～17）——離棄神者，神必不保護他的國。這裡，我們看見以東人、立拿人、非利士人及阿拉伯人等起來抗拒猶大國的管治，或是成功地獨立，或是出兵攻擊，這都大大削弱了猶大國的勢力，也是神對約蘭的懲罰。此外，神使他患腸病，這是神對他個人直接的審判。有人以為以利亞不可能寫信給王，因按著列王紀下三11， 以利亞似在約沙法死前已離世。其實不一定，以利亞仍可能活至約蘭作王的早期，只因在約沙法晚年，他已甚少露面，好像死了一樣，故約沙法便找以利沙代替之。 
•	慘淡收場（18～20）——無人燒物件、無人思慕，就是指無人想他繼續活下去； 不與列王同葬，免玷污墳墓；這裡也不提及其他參考資料，似乎叫讀者不要再閱讀他的生平事蹟！ 
作為一個有信仰的人，相信最大的諷刺是一生所表現的，竟與所信的背道而馳。基督徒的名稱容易取得到，但基督的生命流露則不能蒙騙人。今天，你我是否只有基督徒的虛名而沒有實質呢？在神眼中，若我一生只落得乏善可陳的收場，我想我仍未真正相信過神。 
祈禱	主啊，教我行出祢喜悅的吩咐和教導。——《新舊約輔讀》 
 
惡勢力蔓延（歷代志下二十二 1～12） 
自從約沙法與亞哈建立姻親關係後，北國的罪惡勢力便一直干擾著南國王室。約蘭一生乏善可陳，其兒子亞哈謝也如此。 
•	亞哈謝登位（1～2）——通常君王登位不會只由耶路撒冷的居民擁立，應包括其他區域，但可能因處在非常時期才如此。登基時亞哈謝應為二十二歲，否則亞哈謝在他父親出生時已兩歲大！ 
•	繼續犯罪（3～6）——受了亞他利雅影響，亞哈謝行惡，罪惡勢力正不斷蔓延。王決定與亞哈兒子約蘭攜手爭戰，這事當然不為神所喜悅。基列的拉末地位重要，常成為列國必爭之地。 
•	審判突然臨到（7～9）——王對神不忠，神就藉著耶戶的手向亞哈謝施行審判。「突然死亡」就是結果。「出乎神」的意思就是一切在神引導下成就了。亞哈謝的惡運，正好與其祖父約沙法的忠貞成強烈對比。這裡也明顯不想提及其作惡的父親約蘭，反高舉了約沙法。 
•	篡位（10～12）——亞她利雅像其母耶洗別一樣，權力慾十分大。「剿滅」指殺掉所有男性繼承王位者。這裡沒有用傳統術語方式，介紹女王的掌權，可見她不屬正統君主。由於神重視與大衛所立的約，祂保存了大衛的後裔約阿施。 
我們不能輕看罪惡勢力，只要稍微一不慎，它就能吞食我們，使我們落在敵擋神的景況中。在日常生活裡，防止罪惡勢力侵佔我們的心靈的最好方法是「杜漸防微」，絲毫不讓它有機會坐大。此外，我們也當曉得，生命影響生命（無論好與不好）這道理是真確的。王受了其母親及他親戚的影響而陷在罪惡權勢下，這豈不提醒了我們當留意自己周圍的朋友親戚，究竟他們帶給我的是好還是壞的影響呢？ 
思想	你日常最多接觸的是那一類朋友？你感到他們對你的靈性生命有壞影響嗎？ 
 
重掌王權（歷代志下二十三 1～21） 
亞她利雅篡位後第七年，約阿施在耶何耶大協助下重掌王權。 
•	作王前的準備（1～7）——耶何耶大想到，先有實力作後盾才能取回政權，乃分別召見一些領袖及利未人，而且不限於居住耶路撒冷者，還包括猶大各城。立約就是訂定盟約，彼此同意，達致共識。他們最大的目標是恢復神的心意，讓大衛子孫作王，不准別人進耶和華的殿，目的是保護王免受殺害。 
•	正式立王（8～11）——王正式出來接受冠冕。「戴上冠冕」象徵王將自己獻給神，願按神的律法管治子民。「律法書」也可譯作「見證書」，就是指王每天要閱讀內裡的見證，叫他要守約、敬畏神、行律法等。「膏」是將油澆灌在頭上，象徵神揀選他作王。 
•	除掉罪魁禍首（12～15）——就是殺死亞她利雅。「柱旁」是指波阿斯柱或雅斤柱。王站在這裡，是敬拜時的特定位置。女王說反了、反了，從她眼中看確是造反，但從原來權力看卻不是。不在耶和華殿裡殺她，是不想玷污聖殿。 
•	進行改革（16～21） ——新的行動包括同心在神面前獻心、除偶像、重建敬拜生活及讓全國都尊約阿施為王。「安靜」是神賜給忠心者的福分。 
神喜悅祂的旨意行在地上，然罪惡勢力一時得逞，但終久必被除掉。在這個逆轉的過程中，基督徒可扮演什麼角色呢？我想我們必須如耶何耶大一樣，曉得並堅持神的心意，又把握良機讓它展現在地上。「重掌王權」意味著神與其子民的關係再次恢復。今天，我為「神人關係相通」的事工又擺上多少呢？ 
思想	面對教會信徒種種衰敗及俗世的生活表現，你曾作過何種改善與努力？——《新舊約輔讀》 
 
重修聖殿（歷代志下二十四1～16） 
有關約阿施的經文不多，因他不大忠心。然他也有善行，就是重修聖殿。這裏「神的殿」一詞出現了十多次。 
•	家庭與政治的情況（1～3）——約阿施作王後，蒙神祝福，生兒養女，與先前他自己為孤兒的苦況大大不同。王願意行耶和華眼中看為正的事，可惜，只限耶何耶大在世時才如此。這暗示了日後態度有改變。 
•	修殿事工遇困難（4～7）——這時敬拜生活已恢復，無奈聖殿仍有損壞，需要修理。王決心改善，但他沒有出錢，也沒有向利未人直接收取款項，乃是呼籲子民自由奉獻。不過，可能利未人感到出外募捐似不是他們分內的工作，反應不大好。 
•	修殿事工的完成（8～14）——王採取新募捐方法，就是將捐獻櫃放在殿門外，困難就解決了，修殿工程也得以完成。櫃放在門外，乃因百姓不能進入內院。「捐院」即捐滿的意思。百姓繼續忠心事奉神，但經文點出只限耶何耶大在世的時候，表明他們對神的心並不完全。 
•	耶何耶大逝世（15～16）——他一生為神重用，死時與王同葬，是極高的榮譽。他死時一百三十歲，較摩西、亞倫及約瑟還高。在以色列人心目中，司壽乃是神的祝福。 
我們需要重視敬拜生活，這不單指重視儀節的進行，也包括教會建築物及有關設備。我們對這些事物的態度，反映了是否樂意事奉神。不過，最重要的，還是我們是不是自發的敬畏尊重神，抑或只是受外在環境所逼才如此。王與百姓敬拜的心似都不是發乎百分百愛神的心，環境一變，他們的心也就隨之改變，這是有信仰者的悲劇。 
祈禱	神啊，求祢光照我的心，叫我曉得是否全心愛祢。——《新舊約輔讀》 
忘恩負義（歷代志下二十四17～27） 
耶何耶大去世後，猶大國的宗教政治生活立刻倒退過來。 
•	忘記神的厚恩（17～19）——神過去怎樣保守約阿施的性命，怎樣讓他重登王位，又祝福他的家庭，王全都忘記了。眾首領提出了背道的意見，他很快就同意並實行。不聽取神藉先知的多番警告。 
•	忘記耶何耶大的厚恩（20～22）——王離棄神後，自然也不將人放在眼內，縱使是恩人的兒子撒迦利亞來規勸，他竟忍心以兇殘手法對待。這是何等的諷刺：昔日他被保護之地，今卻成了他殺人之處；昔日恩人耶何耶大避免血濺聖殿，但王卻毫無忌憚的加以破壞，且流的竟是恩兒子的血。 
•	神施行審判（23～27）——面對這位忘恩負義的王，神不得不施行審判。只一年時間，懲罰就臨到猶大國。耶路撒冷雖沒有失守，但王的損失也極大。約阿施的生命也不保，很快便被背叛的臣僕殺掉。他雖被葬在大衛城，但經文清楚指出不能與列王同葬，這就表示他屬不義之王，他的死與耶何耶大的死，在意義上有極大的不同。這裡強調亞捫及摩押地，可能想藉此叫人知道，與外族建立婚姻關係（像猶大王一樣）是無好處的。 
人心是何等的兇殘與惡毒，在這件事上又再一次證明出來。今天，當我們享受主恩的時候，真需要主幫助我們永遠銘記在心中。指摘王的失敗倒是容易的，但我們何嘗不是常面臨這樣的試探！也許，我們需要間中撥些時間出來，讓自己安靜在神面前數算主恩，以至這種操練成為我們生活形態的一部分。這樣，才不會辜負神在我們身上施恩的作為。各位弟兄姊妹，你有這種感動媽嗎？ 
思想	中國人的文化傳統極之重視「報恩」的觀念，你認為它與聖經的教導有沒有共通之處？——《新舊約輔讀》 
 
心不專誠的鑒戒（歷代志下二十五 1～16） 
行為是生活的重要事，心思更是生活的重要事！ 
亞瑪謝行耶和華眼中看為正的事： 
1.	他照摩西律法書的教導，為父報仇而不濫殺無辜（3～4）。 
2.	他接受神人的忠告，撤走以色列十萬軍兵（6～10）。 
在日常生活中，神以書卷的記載教導我們，故我們要有每日讀經時間，研讀神的話語，並遵行其中的教訓。同樣神也使用祂僕人的宣講，我們領受了，也要切實執行！ 
這種每日每週的操練，是每個基督徒屬靈生命的需要，恒守的人，心靈必能茁壯成長。 
亞瑪謝雖行耶和華眼中看為正的事，但這不表示他是全人，因他「心不專誠」！ 
他看重金錢，並貪愛金錢。在撤回以色列十萬軍兵時，他關注「那一百他連得銀子」怎麼樣（9）。及至撤走軍兵，他卻不將當給的分予人，致惹怒了以色列人（10）。 
他戰勝以後，心高氣傲，也就敬拜偶像去了（14）！自大的人，必不敬拜真神，因為他自以為義，也自以為是。 
行為上的操守固然重要，但心靈的操練更不可忽略：「心懷二意的人哪，要清潔你們的心！」（雅四8） 
在當今的世代，金錢和自我常是我們信仰上很大的考驗，你曾經歷這些試探嗎？你又怎樣強壯自己的靈命，勝過金錢、自我的迷惑和衝擊呢？ 
思想	心思意念真是這麼重要嗎？為什麼聖經要多番提及？「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」（箴四23）——《新舊約輔讀》 
心高氣傲的收場（歷代志下二十五 17~28） 
有之於內必形於外！ 
亞瑪謝心高氣傲，連耶和華獨一真神他也放下，又豈會將以色列國放在眼內？ 
自高自大的人，仇恨相爭的心必重，眼中無人、目中無神，必然希望獨步宇內。「我們二人相見於戰場！」（17） 
約阿施點出亞瑪謝的弱點，就是「心高氣傲」。其實，彼此共存，生活在太平日子豈不好，何必殺戮於戰場之上呢？蒺藜豈配得上香柏樹，為何要苦苦相逼，而遭野獸踐踏呢？ 
一個連神的話也不肯聽從的人，又怎能接納忠告？於是，一個人的心高氣傲引致族人受苦、國家受苦。亞瑪謝被擒、耶路撒冷城牆被毁、神殿的一切金銀器皿被奪、王宮的財寶被拿去，並有人成了人質。一人作孽，全國蒙受苦難，何苦由來！ 
多少時候，我們總是偏執個人的成見，為報復而生活，為戰勝別人而生活，這都是心高氣傲在背後作崇。箴言明證：「驕傲在敗壞以先；狂心在跌倒之前。」（箴十六18）  
亞瑪謝初時守神誡命，蒙恩得力；但後來離棄耶和華，眾叛親離，並被人背叛，逃亡而被殺於路上（27），真是叫人嘆息！ 
「但各人被試探，乃是被自己的私慾牽引誘惑的，私慾既懷了胎，就生出罪來； 罪既成長，就生出死來。」（雅一14～15） 
祈禱	求主賜我謙卑的心，叫我懂得過尊主為大的生活。——《新舊約輔讀》 
 
才略與生命（歷代志下二十六 1～23） 
在南國諸王中，烏西雅是最具才略的君王： 
•	他敬拜真神（5） ， 
•	他征服四鄰（6～8）， 
•	他修築軍事設施（9）， 
•	他添設農業裝備（10）， 
•	他設立軍隊階級（11～13）， 
•	他設軍隊器械（14～15）。 
烏西雅是一位政治、軍事、經濟的專才，他的執政帶來南國一片美麗的憧憬，昔日大衛和所羅門的光輝似乎是指日可待了。 
但烏西雅的成功，並不全然是他的才略，最重要的因素，是他得了「非常的幫助」（15）。這非常的幫助不是從人的本能來的，而是天上的耶和華使他亨通（5）！ 
有些人不能遭挫敗，一遇挫敗，就放下信仰；有些更不能成功，一旦成功，便把救主忘記。烏西雅既強盛起來，也就心高氣傲，干犯耶和華的誡命，上殿燒香了。 
君王的職事是負責國家行政事務，祭司的職事是處理聖殿事務。掃羅王已於早前犯了禍而成了鑒戒，現在的烏西亞又漠視神的法則，公然向八十位勇敢難攔阻他的祭司發怒，神的刑罰隨即臨到他——「額上忽然發出大痲瘋」（19）。 
一代英雄得此下場，實在令人三炭！才略成為他的試金石，我們在事奉上或有些微可誇之處，但豈能不謹慎小心？求主憐憫我們，使用我們！ 
當這一代英雄駕崩之際，神的心意卻在一位青年人的身上開啟，但他的事奉不是在於才略，而是在於從上頭來的力量。 
祈禱	求主除去我的驕傲，賜我一顆謙卑的心。——《新舊約輔讀》 
 
美中不足的憾事（歷代志下二十七1～9） 
約坦行耶和華眼中看為正的事！ 
1.	他愛護神的殿宇，建立耶和華殿的上門（3）。 
2.	他忠於君王職守，為國家設置屏障，保護國民（4）。 
3.	他是勇於的戰士，戰勝亞捫人，並得著他們每年的進貢（5）。 
4.	他行為正直，遵守正道，得神喜悅，以致國勢日漸強盛（6）。 
人生的缺憾是否必然的呢？約坦實在有其優點、被神稱讚之處；然而，約坦「只是不人耶和華的殿」（2）。詩人說：「萬軍之耶和華啊，祢的居所何等可愛！我羨慕渴想耶和華的院宇；我的心腸，我的肉體向永生神呼籲⋯⋯祢是我們的盾牌；求祢垂顧看祢受膏者的面！在祢的院宇住一日，勝似在別處住千年；寧可在我神殿中看門，不願住在惡人的帳棚裏。」（詩八十四1～2，9～10） 
聖經中沒有解釋約坦為什麼不入耶和華的殿，但記述了他一生中「美中不足的憾事」；同樣地，有一些信徒也不入耶和華的殿，他們不在神的家敬拜，不在神的家團契，不在神的家事奉。他們是基督徒，卻不是一名負責任的會友。可能的原因很多，或是歷史的因素，或是客觀的難處。但不入耶和華的殿，不享受完全聖潔的基督徒生命，就是人生的損失，也就是你個人的過失！ 
人生的缺憾不是必然的，詩人說：「靠祢有力量、心中想往錫安大道的，這人便為有福！他們經過「流淚浴」，叫這谷變為泉源之地；並有秋雨之福蓋滿了全谷。他們行走、力上加力，各人到錫安朝見神。」（詩八十四5～7） 
思想	人生的缺憾是否必然？——《新舊約輔讀》 


智慧與豐盛 （歷代志下— 1～17） 
經遏與亞多尼雅一番内部權力鬥爭後，所羅門终於在神引導下成焉以色列王。他「圆位堅固」，表明他的敵對力量始终勝不過他。 
·所羅門尋求神的面(2～6)—他招聚以色列人來到耶路撒冷，然後再往 
基遍睾行宗教大會。這是全國性的聚會，目的是敬拜神、荨求神的面。「邱壇」與異教高地敬拜有關，選用基遍這地方可能使人聊想到所羅門蔘與異教節。因此，歷代志的作者清楚指出，由於那裹有摩西所製造的會幕及比撤列所造的銅壇，所以，他不是去敬拜異教之神，乃是就近會幕、铜壇毒求主自己，故此主悦纳他所獻的燔祭。 
·所羅門求智慧(7～13)—神悦纳所羅門的心，於是向他颐現。所羅門 
求智慧聪明好管理以色列民。「智慧聰明」原先焉軍事衡語，是戢士所需要的，好能夠带领軍隊出入爭戢；但所羅門卻相信「智慧聘明」更可用在政治及管治人民上；言下之意，他不是焉征服别人，乃焉即将來臨的建殿事工。所羅門本可向神祈求富貴榮華，但他卻因棰之重視神人間的敬拜開係而放棄了。這種體贴神心腸的祈求，神當然十分欣赏，不罩應允所求的，連他没有求的也都赐予。 
·所羅門的豐盛(14～17)—這裹印證了神的信實，因袍實踐了所承諾 
的。所羅門在物質货財上這様豐富，又有智慧聽明，萬事俱備，自然成岛適當的人選去作偉大的建殿工作。 
從其他資料，我們得知所羅門在人生路途上有失敗之處。但這並不妨礙我們學習他在這裹所表現的優點:他焉了神的工作尊求神的面及求智慧，所以他能夠完成神所交託的事工絕非偶然。今天，也許我們不應急急的焉神作這些那些，乃是先安静在神面前得着领受，才進行要作的事。 
思想  
每當我承擔起一項屬靈事工時，我的態度是怎様的呢? —《新舊約輔讀》 
 
 
 
歷代志下二1～18 
熱心與預備 
所羅門「定意」為建殿作預備，他採取的是主動態度。為突出他是建造聖殿的中心人物，經文不多述他自己宮室的建造情況。 
•	勞動力的凖備(2) — 建殿人力絕不能缺少。 
•	與希蘭的協議(3～16) — 所羅門需要泰爾王希蘭的協助，因此，他就主動與希蘭聯絡。在過程中他大膽見證神是至大的神，强調神的超越性。所羅門不得不説「我是誰」，以表明他在這位偉大的神面前需要谦卑。所羅門需要一個「巧匠」來為他們作工，同時，他感到大衛所預備的木料仍不足，必须增加多一點。為了使這個協議成功，所羅門定出交換條件，就是一次過送給他們大量的小麥、大麥、酒和油。原來泰爾國雖强於貿易，但國家卻缺少食物。故這個提議相當切合他們的需要。歌珥焉乾糧單位，一歌珥的等於100公斤；罷特為流質單位，一罷特約有20公升。 
希蘭接受這個提議，在回信中，他高舉所羅門的智慧，認定他有謀略聰明，足以為神建殿。他應允所羅門的要求，打發一位巧匠來幫助，他就是戶蘭 (王上七13~14)。這人多才多藝，可比美摩西時代建造會幕的巧匠比撒列及亞何利亞伯 (出三十五30～35)。他又同意將木料送到約帕，因這是當日最接近耶路撒冷的港口。 
•	動員勞動力(17~18) — 所羅門動員那些留在迦南地居住的外邦人來建造聖殿。 
所羅門為了神的工作而滿有熟心，且積極主動的去實行：他的部署與安排都十分精密。今日，我們事奉的態度又如何呢？「有姿勢、無實際」的事奉生活，縱能迷惑別人一時，至终必為人所洞悉，神也不會悦納。 
思想 
我為教會事工努力之先，有否花上足夠的時間與心思作充分的預備？ —《新舊約輔讀》 
 
 
 
歷代志下三1～17 
建造敬拜的聖殿 
萬事俱備後，所羅門就起來建造聖殿。 
•	建殿的地點與日期 (1~2) — 所羅門決定將聖殿建在摩利亞山上，一方面這地方是其父親降服神、誠心築壇獻祭之處；另一方面，這地又是先祖亞伯拉罕順服主的命令，獻上以撒的地方(創二十二1~14)。聖殿若建在此處，正好表明人要繼承優美屬靈傳統，謙卑的進到神面前敬拜祂。 
•	聖殿的整體外形(3~7) — 整個聖殿面積不算大，大概為31.5公尺乘10.5公尺，這是按着古時的尺寸計算的。古時的標凖，是以0.525公尺(21英吋)為一肘，而不是以所羅門當時0.4公尺(18英吋)為一肘。雖然面積不大，但聖殿所探用的質料部屬上乘 (經文多處重複説用金子或精金來裝飾)。 
•	聖殿的内部建設(8～14) — 至聖所是聖殿最神聖的地方，所羅門用了六百他連得的金子來裝飾；那大概是 20 公噸，以今日價值的計算是極高的了。基路伯象徵着神的同在，它們向外殿而立，表示要保衛至聖所，防止任何非法人士入内。 
•	兩根柱子(15～17) — 在殿前有兩根柱子，雖非力柱，但意羲重大。「雅斤」及「波阿斯」合起來的含義是：只要透過聖殿敬拜神，所羅門王朝就能永遠被堅立。 
所羅門十分看重敬拜的事奉，所以在建造聖殿工作上，他一點也不馬虎。他本着謙卑的心，全然投入建造工作中，又以最好、最榮耀的質料獻給神。今日，我重視敬拜生活又到哪一程度呢? 
思想 
每次主日崇拜，你都懷着當有的敬畏、謙卑態度進到神面前嗎? —《新舊約輔讀》 
 
 
 
歷代志下四 1～22 
殿內的設備 
聖殿裡的設備是多方面的，我們嘗試了解多一點： 
•	銅壇（1）——是仿效曠野時期作的祭壇而造的，但體積較大，以便容納更多祭性。 
•	海與及盆（2～6）——海的作用主要與禮儀上的潔淨有關。十二銅牛象徵了以色列十二支派，他們都是神的僕人。銅牛東南西北的擺放，提醒他們在曠野時怎樣安排營地以便神帶領他們進入應許之地。 
•	金燈臺、桌及金碗（7~8) ——「所定的樣式」可能是指摩西時期會幕的做法，也可能是指大衛先前告訴所羅門建殿的樣式。桌子的用處，多數是用作擺放金燈臺；但也可能為陳設餅而設。金碗則用作盛載祭牲的血。 
•	祭司院和大院(9) —— 這兩院是不同的。前者也可稱作内院，只限祭司進入；後者則可稱外院，一般子民皆可去。 
•	其他設備(10~18) —— 有重複先前所講的，但也有一些是新介紹的器具。盆(16)用作煮獻祭的肉，鏟子可處理灰燼，而肉鍤子則用作處理祭肉。 
•	各種設備總摘要(19-22) —— 金壇用作燒香。陳設餅的桌子有「眾數」的意思，但相信只有一張是擺放陳設餅用的。這裏再次強調「金」在各樣物件上的使用，目的是指出聖殿的榮耀。 
•	所羅門十分重視聖殿敬拜的生活，故此殿內的設備他都細心安排、裝飾及製造。這是敬畏神的一種表現。今天，我們的身體就是神的殿，我們有否作最好最細心的安排，來參與主日的敬拜生活呢？在敬拜神的時候，我敬畏神的程度夠不夠，還是經常内心散漫呢？ 
思想  
我有没有在禮拜六晚上就開始預備身、心、靈，來參加主日的敬拜生活呢？ —《新舊約輔讀》 
 
 
 
歷代志下五1~4 
 
求自潔・神顯現 
 
經過七年的艱辛工作，聖殿終於在所羅門第十一年八月完成 (王上六38)。但在七月，所羅門便舉行獻殿禮。這是一件重要的事，不能馬虎，必須要大大慶祝一番。 
 
•	巡遊並獻祭(2~6) —— 這是大事，招聚全部以色列人來參與自是理所當然的。運送約櫃、會幕，及會幕一切聖器具，所羅門安排了祭司利未人來負責，他不再假手於其他人，相信是從過去烏撒被殺一事所學得的功課 —— 只有神分別為聖的利未人才可扛抬神聖之物。 
•	約櫃進入至聖所(7~10) —— 這裏清楚顯示，只有祭司才可以將約櫃抬入至聖所。約櫃內有兩塊石版，表明神對以色列人在道德上的要求。他們要守約、守律法和誡命，這樣才能進到神的面前。過去，約櫃曾經擺放過一罐嗎哪及亞倫的杖，現今則沒有這些東西。 
•	神榮耀充滿聖殿(11~14) —— 他們既自潔，人人樂意事奉，隨着唱詩、歌頌、感恩儀節的進行，神就顯明祂自己。「雲的充滿」象徵神榮耀在祂子民中間顯現了。神有榮光，其高貴的本性令人震撼。這都在内殿發生，祭司們也看見，神願意這一處為祂永久居所。 
 
基督徒今日所面對的神，仍是那一位神聖、高貴、滿有榮光的主。我們進到祂跟前，就應該在生命上自潔，並且重視自己成聖的操練；否則，神又怎會向我們顯明祂自己呢？ 
 
神聖潔的靈既内住在我們生命裏，祂看重我們生命的聖殿，樂意垂聽我們的禱告和悅納我們心靈誠實的敬拜，我們豈能忽略這莫大的恩典，而任意妄為呢？ 
 
思想 
你的道德生活表現在信主前與信主後有分別嗎? —《新舊約輔讀》 
 
 
歷代志下六1~11 
信實的神成就救恩 
面對神榮光充滿聖殿的時刻，怎能無動於衷？所羅門也不例外，他作出了回應: 
•	神在我們中間(1~2) 以色列人相信神的住處為幽暗之處，這是受到西奈山上神顯現的傳統而引發的(出二十21)。上文說有「雲」充滿就與這觀念有關，蓋幽暗之處有雲是極自然的事。現今神臨在了，以殿作為祂的居所，人就可在殿裏遇見神 
•	信實的神成就大事 ( 3 ~ 11 ) —— 這裏的一番話表達了所羅門稱頌神的心聲，原因是： 
2.	祂向大衛所應許的現在親自成就了。他讓所羅門登位及完成建殿工作就是明證。過去大衞流人血太多，神不許他建殿宇，但現今所羅門作為太平之子，在神的供應下完成了這項工作。 
3.	神與大衛的立約關係並非一件獨立事件，它與出埃及的經歷有密切關係神救贖以色列民出埃及，揀選耶路撒冷為祂的居所及選立大衛治理國家等事情都表明神没有離棄祂的子民，祂遵守了約的要求。 
在這情况下，所羅門樂意在慶祝聖殿建成的典禮中高舉約的關係，一方面指出神是與整體以色列人立約；一方面又暗示這約仍有效，以色列民自當竭力保守這美好神人的關係。 
我們先要感謝神，透過基督的死，我們因信進入了「新約」的關係 — 享受救恩，成為神的兒女，又受各種屬靈福氣，這全都是因為神信實，定意差遣救贖主來到人間而成就的。時間既難不倒神，也不能改變祂信實的性格。然而，我們又如何呢？在漫長的基督徒人生路上，我有常常持守對神忠貞的心麼？危機當前，我肯看重神人和好的關係麼？ 
思想	我們不用付代價就領受了神救贖的恩典，未知有否使你對神人和好的關係，存着輕忽的態度呢？ 
 
歷代志下六12～17 
求神繼續施恩 
說過一些祝福的話後，所羅門開始向神祈禱。 
•	禱告的姿勢（12-13）——他先站著，後來則跪下。向天舉手就是禱告的意思。這種在臺上禱告的現象並不是以色列所特有的，古代近東的王參與宗教儀節時往往都會如此。此外，在臺上禱告顯然更易被人看得見及聽得清楚。這「院」是「大院」，全以色列會眾都可入內，故所羅門是當著以色列會眾禱告的。 
•	神今日成就大事（14-15）——所羅門今日能夠獻殿並作禱告，乃因神願意向順服祂的人守約施慈愛，而他父親大衛蒙福受恩就是最好的明證。 
•	求神繼續施恩（16-17）——回顧過去，看到神已成就了一切，並不表示恩典已盡；相反，這不過是施恩的開始而已。因此，所羅門加強禱告，並求多得恩典，就是神繼續堅立大衛王朝，使坐以色列國位的人不斷。當然他曉得一件事，就是繼後的王必須遵守約的條件，盡上本分守律法、行神的旨意。這樣，才算是正確的。 
 
	我們都是蒙恩的人，未信主以前，我們感到所領受的好處似都是自己應得的，但信主後我們就不會如此，反領略到這一切一切皆因出於神的憐憫，並向我們施恩所致。其實，我們更應邁進一步，就是在受恩之餘，不忘記繼續求主施恩。這不是說我們要命令神作這事那事去滿足我們的要求，乃是我們看到自己只不過是一個平凡人，軟弱者，惟獨華看神豐盛的恩典才能活潑的侍立在祂面前。當然，不用再多說，求主施恩的禱告完畢後，我們需要更竭力地守主的教導。 
 
思想	新約裏經常出現「恩典」這字，你體會這真理有多深？

所羅門是一位偉大的建殿者，這是人所公認的。不過，他的建設計劃並非只限於聖殿，他還作了其他大規範建設。

所羅門成功地治理國家，使以色列民在國運及地位上都達至高峯。雖然他並非毫無缺點，這可從其他書卷得知，但終其一生確有卓越的成就。 
•	天下列王皆尊崇所羅門(22~25) ——所羅門登位時，神應許賜他智慧和財富。結果，當應許一一實現時，他顯然凌駕諸王之上，以致他們都尊崇他，樂意求見和進貢，表示出一副心悅誠服的態度。 
•	所羅門統管廣闊大地(26~28) ——所羅門影響力遍及的範圍十分大，這包括了北界的幼發拉底河、西界的非利士及南界的埃及。此等地方都獻極多財物給他。同時，由於以色列王國處於歐、亞、非三洲交匯處，擁有貿易通路權，故也成了馬匹買賣的中樞地點。 
•	保守大衛王朝(29~31) ——所羅門統治以色列四十年，成功地完成兩大任務:建殿工作及保守王朝。最後他平平安安的離世了。國家强盛加上天下列王又臣服，已是他一生最大的成就了。記載他生平事蹟的資料很多，包括拿單的書(指廣泛的歷史記錄)、亞希雅與易多所領受的預言與默示的記錄(較狹窄的觀點，僅指他們所看見、所洞悉的各種事件意義)。 
我們未必擁有所羅門的偉大與成就，但神既給予我們在世生存的機會，祂必然有一定的人生計劃期盼我們去完成。若是這樣，我就不能不問自己:我有敬畏神、得着屬靈智慧與豐富，好贏得別人對我的尊崇嗎?我屬靈的影響力能否使更多人蒙受神的祝福呢?我在世上曾竭力完成神交託給我的任務，並成功地傳遞異象給下一代嗎？對生命多一點認真，人生所成就的應該會多一點。 
思想 
我怎樣理解每天慣常要完成的工作。是漫無目的，還是有重大意義？—《新舊約輔讀》 
 
歷代志下十1~11 
錯誤的抉擇 
羅波安繼位不久，便前往示劍，接受以色列十支派的冠冕，無奈，他卻遇到困難。示劍位於基利心山和以巴路山之間，是古代以色列的軍事、政治及宗教中心。 
•	眼前的難題(2~4) ——耶羅波安聽見這事，明顯是指所羅門的逝世及羅波安繼位的事。他代表以色列人祈求新王減輕負擔。根據考古資料，古代美索不達米亞一些君王會在登基之時有減輕百姓苦工的行動，故可能以色列人也期望着這種改變。他們要交重稅及作苦工，乃與所羅門極多建殿建城的行動有關。今羅波安要處理這難題。 
•	停一停、想一想(5) ——羅波安很明智，他没有即時回答，他需要想想。因此，他叫他們日後再來。 
•	不聽老人言(6~11) ——以色列傳統頗為尊重老年人及其智慧，故羅波安這次是作錯了，他不接受安撫及以退為進的方法。所謂「好話」，不僅是指好聽的話，更是與較為嚴謹的外交承諾有關。羅波安轉而求問其他少年人，相信大多是他的堂兄弟或其他王室成員，他們強調使用高壓政策。蠍子鞭本身帶有鐵鈎或鐵粒，故殺傷力也較大。羅波安採納他們的主意，帶來國家分裂，這顯明他作了錯誤的抉擇。 
無人願意作出錯誤的抉擇，人人都希望無錯誤，基督徒也没有例外。羅波安的失敗就在於他找錯了對象作諮詢人，加上他權力慾太强，過分逞勇所致。其實，面對抉擇時，我們切要禱告尋求神的心意。這裏，他好像全忘記了神一樣! 
思想  
無論大小事情，每當我要決定如何作時，我腦海中有想及神、並祂的吩咐嗎? 
 
歷代志下十12~19 
無法挽回的定局  
王國的分裂，背後的因素很多，我們可在這裏窺見一二。 
•	羅波安專橫使事情惡化(12~14) ——他本有責任以公正、公義的手法處理以色列人的要求;無奈他專橫自恃，不聽老年人的意見，乃以嚴厲的說話回覆以色列人，致使事情惡化下去。 
•	所羅門種下分裂遠因(15) ——所羅門曾多行神不喜悅的事，不專心順從耶和華，結果種下分裂的禍根(參王上十一 1-13)。是故，王不依從百姓而做成國家分裂可說是出於神的心意。這裏無明言說所羅門離棄神，但強調亞希雅所說的話顯然已作了暗示。 
•	耶羅波安與以色列人的反叛(16~17) —— 他們拒絕歸向大衛家，並以强硬態度回應。雖然他們知道羅波安是神所揀選的王，但他們仍決心反叛。從此，分裂局面就形成了。 
•	局勢不可逆轉(18~19) ——羅波安仍想强加管治權，故差派哈多蘭往以色列人那裏去。他完全不能準確掌握形勢，更低估了以色列人的力量，結果只好慌忙逃回耶路撒冷。 
這事如此發展，終極因素雖是出於神，但人仍要為自己錯誤的行動負責。人作惡無智慧，自然當承受惡果。保羅說得好:「不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼。順着情慾撒種的，必從情慾收敗壞;順着聖靈撒種的，必從聖靈收永生。」(加六 7~8) 人犯罪時，有時神並没有直接的阻止，但這不是說，神接受我們這種犯罪行動。神會尊重我們在道德行為上的自由抉擇而暫且緘默，可是，人承擔惡果確是免不了。今天，我想收甚麼果子呢? 
思想 
你是一個衝動的基督徒嗎？你曾否有後悔的經歷？ —《新舊約輔讀》 
 
歷代志下十一1~23 
成功管治猶大 
羅波安要承受王國分裂的惡果，只有二支派跟隨他。但就統治南國猶大而言，他開始時卻頗為成功。 
•	不再與北國爭戰(1~4) ——羅波安聽從神的吩咐，維持這分裂現狀，不再爭戰。北國以色列人仍是他們的「弟兄」，若期望復合，最好留待將來，現在不能靠軍事來解決。 
•	建立堅固城(5~12) ——城得堅固乃神的祝福。所修築的城，全部只在猶大的東方、西方及南方，卻没有在北方。這可能因為羅波安感到北國威脅不大，又可能他期待北國會回歸復合。結果，猶大和便雅憫都歸了他，也表示他已成功地阻擋外國力量犯境。 
•	忠心分子(13~17) ——北國離棄神，既不用利未人事奉神，又敬拜導人邪淫的鬼魔像，這都是神所不喜悅的事。利未人忠於其聖潔呼召，寧捨棄北國屬土，也不作惡。他們回歸羅波安，站在他一方，一羣不願離棄神，反倒定意尋求神的以色列人也加入這回歸行列，在南國建立高崇的宗教道德標準。這樣，神賜福他們，使他們享有三年平安的日子。 
•	家庭蒙福、國家强盛(18~23) ——多妻兒是蒙福的徵兆。為加强政治影響力及各地區効忠王室，羅波安乃以兒子管理各地。 
神的子民若行在神的旨意裏，又以神的律例作為生活標準，他們必蒙神祝福。在神眼中，他們是成功的一葉。今日，當我們發現自己的周圍景况，像是陷在一塌糊塗的地步，也許我們真要靜下來，思想自己是否有聽從神的吩咐而行;有沒有在信仰上持守忠貞的態度。忠於神的利未人及南下的百姓，他們為信仰緣故作了極大的犧牲，我自己又如何呢?我有貪戀世上的福樂嗎? 
思想 
你有「人在江湖，身不由己」的感覺嗎?若有，你會否相信這也許是我們没有行在神的引領中而導致的結果呢? —《新舊約輔讀》 
 
歷代志下十二1~16 
離棄神的收場 
羅波安因遵行大衛和所羅門的道，曾有三年時間蒙神悅納;然三年過後，他卻一反常態，走向叛逆的道路。 
•	離棄神招致國難(1~5) ——有點成就後，羅波安就看不起神，反倒敬拜假神，不行律法的要求。結果，神對不忠的子民施行審判，而且就是王在位第五年之時速速的臨到。示撒王大軍臨城，是因王和民得罪了耶和華，他們戰敗，也是這個緣故。 
•	自卑後略得拯救(6~12) ——其後的覺悟與自卑，拯救了他們免遭完全的毀滅，但仍要接受若干程度的懲罰，就是耶路撒冷被攻、神的殿及王宮的寶物被搶掠。羅波安離棄神確是錯了，故他不得不說耶和華是公義的。意思就是神是對的，他們卻是錯的。自卑、悔罪帶來一點生機，這是歷代志下七 14 神對所羅門應許的。這裏談及的善益事，並没有清楚說明是甚麼，可能是指國中仍存在一羣忠心分子，他們在真理中站穩，没有腐敗下去。 
•	王朝的結束(13~16) ——羅波安首三年作王確是自強，但整體來說卻只得着「行惡」的評價。基本原因乃因他没有尋求神的面，一失足成千古恨，真叫人為王惋惜! 
基督徒是指那一羣願意以神作為生命中心的人，理論上他們不會背道離棄神，但實際上卻非如此。離棄神的試探經常出現，又衝擊着他們弱小的心靈。稍一不慎，便會落入忘記神的光景中。面對這種試探，最佳之法莫如常存自卑、悔罪的態度，好叫我們不致自以為義，招致神的懲罰和管教。其實，我們更應積極尋求神的面，讓我們行惡的心得減至最低。 
思想  
你肯定自己永遠跟隨主嗎？你信不信自己有朝一日會「心易放蕩，離棄所愛之真神」呢？ —《新舊約輔讀》 
 
爭戰前的寶訓（歷代志下十三1~12）  
雖然在其他書卷記載了亞比雅的罪行,但在這裏則突出他的優點。亞比雅像是位作先知的，他在爭戰前說了番感人的話。 
•	猶大與以色列爭戰(1~3) ——在實力上顯然有分別,以色列的八十萬勇士佔盡了優勢。 
•	大衛王朝的正統性(4~8a) ——亞比雅的講話，第一點在指出神是站在大衛王朝一方。神是與大衛立誓約,意思是一個永久的承諾，是永遠有效的約。耶羅波安及跟從他的匪徒不服從大衛的統治是不當的。這樣作，不僅抗拒正統的王，也是敵擋神的表現。洗瑪臉山可能在伯特利南端、猶大與以色列的邊界上。 
•	耶路撒冷是聖潔之地(8b~12) ——亞比雅進步指出，只有南國耶路撒冷才是真正的宗教中心。北國的宗教腐敗，敬拜偶像，又隨便任用不合律法要求的人作人作祭司，這是離棄神的表現。相反，南國則按著律法要求進行各種儀節，是遵守神誡命的表現。最後，亞比雅直接向以色列人呼籲，叫他們回轉合一，不要與南國爭戰，不要忘記耶和華也是他們列祖的神。 
每位基督徒當處劣勢時都要仔細思量這番話。從人的角度看，我們可能是少數失勢分子；但假若有神同在，其實我們卻是「多數得勢」分子呢！神必因基督所成就的約繼續護衛我們，叫我們膽壯，又叫我們勇於面對前頭艱苦的歲月。 
當然，我們要問自己，我們仍有樂意事奉神的心嗎？有否按神的指引行事呢？否則，道路不亨通似乎不是神故意與我們為難，乃是我們沒有走在真理道路所得的結果而已。 
思想	你試過為真理奮鬥而落在孤單的處境中嗎？你的心路歷程怎樣？——《新舊約輔讀》 
倚靠神必得勝（歷代志下十三 13～12） 
亞比雅的一番話未能改變交戰的景況。耶羅波安決心採取軍事行動來定高下。 
雖然北國軍力較強，佈陣也較好，前呼後應，但神卻使他們敗在亞比雅的手下。猶大祭司「吹號」（14），象徵耶和華進入戰爭中。猶大人「吶喊」（15） ，表明以信心投靠神，且不是理論的信心，乃是有行動、有實踐的信心。 
以色列人「被制服」（18），這「被制服」一字與「自卑」相同，表明縱使耶羅波安先前不肯自卑，但終於他也要被神所折服而不得不「自卑」下來，接受最終的失敗。 
猶大人的勝利，至關鍵的因素不是別的，乃是「倚靠神」18節可算是整段經文的鑰節。 
這場爭戰影響深遠，從此耶羅波安一蹶不振，無復強盛。要或攻擊他，他就死了，意指一種突然的死亡。這是行惡者的收場，不順服神所得的結果。相反，亞比雅走順服神的道路，不僅是戰爭得勝，他也蒙神祝福，家庭妻兒眾多（21） 。 
在屬靈的爭戰上，基督徒應誇口甚麼呢？不是自己的知識、聰明或地位，乃是自己的軟弱，這樣才能得勝。 
當我們肯承認自己的無助、軟弱，我們就曉得依靠神，接受祂的能力和恩典；於是，我們就能真正剛強，打退惡魔、戰勝誘惑。 
這不是易學的功課，人好逞強的本性不易除掉，尤其是信主已久的基督徒，嘗過一些屬靈經歷。又懂得若干屬靈詞彙，就每每以為自己早已充分準備，靠己就必得勝。你我是這種人嗎？ 
思想	有人說基督教是「他力」（靠神得拯救）的宗教，而不是「自力」（靠己得拯救）的宗教，你同意嗎？若同意，你有貫徹始終走「他力」的道路嗎？——《新舊約輔讀》 
尋求神的結果（歷代志下十四 1~15） 
羅波安與亞比雅聯合統治大國達二十年時間，但繼位的亞撒的統治期卻有四十一年之久。由於亞撒敬虔事奉，促使國家有良好發展，這裏也用了極多篇幅來描述他的生平事蹟。 
•	尋求神使國家太平(1~8) ———這裏清楚指出,宗教與政治有密切關係。當王帶領人民尋求神，守律法誡命，又進行宗教改革，除掉偶像，神就在國家政治及社會建設上使猶大國蒙福，享受四境平安的福分，又有智慧力量建造城牆。「尋求神」這主題十分重要，這一章及接著之兩章都指出這是國家轉變的關鍵。邱壇是指迦南人建給外邦神的壇，那裏會進行一些淫褻的禮儀；柱像是獻給巴力神的；而木偶則與生育萬物的女神有關。 
•	仰賴神使戰爭得勝(9~15) ——尋求神的人自然會仰賴依靠神，而在急難中更是如此。凡事依靠神的人，縱然力量單薄，也可得勝。亞撒王向神的呼求，具體地表達了這個心聲。根據史學家考證，這次入侵可能發生在 900~897 B.C. 之間。古實人被打敗，不能再強盛，就是他們從此之後沒有鬥志爭戰。神使猶大國獲得徹底的勝利：猶大軍隊可乘勝追擊，甚至進城擄掠財物，然後才班師回朝。 
基督徒的人生是爭戰的人生，但意思不是與人爭鬥，乃是因天天都會面對各種試探與陷阱，若不以爭戰的心志去克服，就必失敗。爭戰得勝的要訣在那裏呢？是仰賴依靠神。我們切勿以為「己」的力量很大，面對罪惡勢力，「己」發揮的能力就算不得甚麼了。我們要仰賴神，自當尋求主的面。只有與主的關係打通了，遇到難處時才能奮力迎對。 
思想	即使你天天在社會圈子內拼命幹活，又在教會圈子內拼命事奉，但是否總感到失敗多於成功，沮喪多過快樂？你可曾想過或許皆因你從來沒有真正尋求神？——《新舊約輔讀》 
奮力從事改革（歷代志下十五 1~19） 
亞撒即位後已進行宗教革新工作，但他未見深廣，因此，神就藉著戰勝古實王事件鼓勵他繼續努力。 
•	鼓勵的信息(1~7) ——亞撒利雅在神的靈感動下，大膽準確的傳揚神的話。亞撒利雅的背景資料極稀少，但其姓名意指「神曾幫助」，在這裏卻富積極意義。信息可分三部分：第一部分指出神與人的條件式關係：人若忠於神，神必同在(2)；第二部分從救恩歷史裏舉出例證，來說明這事實：離棄神招致失敗和悲劇，忠於神則帶來勝利和福氣。這裏所描述的是士師時代。第 3、5並6 節指出當日受神懲罰的情況，第 4 節則在說明，人只要回轉尋求神，就可恢復正常和好的關係；第三部分則是勉勵的話，呼籲亞撒王繼續奮力下去，推動改革事工（7）。「你們」是非常強烈的個人化字眼，用以加強王及眾民積極回應的心。 
•	奮力革新（8～19）——亞撒的工作從各方面展開，包括了除掉偶像、修建聖典、帶領子民守約、貶太后及奉獻金銀器皿等。眾民於亞撒十五年三月聚集在耶路撒冷，乃為要慶祝五旬節。不尋求神者必被治死，這不是嚴厲，摩西律法早已申明（申十三6～10），亞撒一生誠實，直至亞撒三十五年止。其後，他跌倒了。 
今日教會面對荒涼景況，我們若要推行革新工作，人人就必須奮興起來。靠著聖靈的感動及領受激發人心的信息，相信是極好的開始。可惜今日，我們很少見到當代的「亞撒利雅」。我們也忽略了，外在的改革工作是必須有內裡生命、靈性的更新支持才能成功展開。弟兄姊妹，讓我們都一同謙卑地到主前，求祂先以祂的名和信息，來感動及激發我們的心。 
思想	你常感到今日教會陷入悶局、困境嗎？你常感到自己無力面對今日教會低落的景況嗎？——《新舊約輔讀》 
 
晚節不保（歷代志下十六1～14） 
亞撒曾奮力為神作工，使國家子民行在正道上。可惜，他沒有堅持到底。在位第三十六年，他跌倒了。 
•	靠軍力解決國家危機(1~6) ——拉瑪在耶路撒冷北十公里之處。以色列王修築拉瑪，欲切斷猶大國的通路。亞撒本可藉此機會，重新仰望神，得著奇蹟般的拯救，就像從前一樣。但他沒有如此，他投靠亞蘭王便哈達，以金銀促使亞蘭王在以色列之北展開另一戰線。結果，巴沙在不能兩面兼顧下，乃停止修築拉瑪。 
•	先知的責備(7~10) ——先見哈拿尼清楚指出，亞撒在這些事情上顯得愚昧，他對神失去信心，此後國家不再四境平安，反有爭戰。若當時亞撒投靠神，不單可征服以色列，也可攻陷亞蘭國。但因他依靠別國軍力，這事不成了，亞蘭王的軍兵就脫離了他的手。亞撒不獨沒有悔改，更將先見下在監裡，又虐待那些站在先見一方的人民。 
•	悲慘收場(11~14) ——王反叛神，直到死亡時也沒有悔改。他腳上的病，不能使他反思己過。他也只向醫生尋求醫治，沒有尋求耶和華幫助。尋找醫生本身不一定錯，但亞撒的錯則在於他再不理會神。王死後，國家按著當時習俗將他下葬。 
箴言說得對：「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」(箴四23)亞撒晚年沒有保守自己的心，導致他不再倚靠神，結果晚節不保，令人惋惜！我們作基督徒真要求神憐憫，保守我們一生行在主道上。一時的熱心未嘗沒有價值，但主卻要求我們熱心的為祂活一生。一時的得勝縱然令人興奮，然而一生的得勝，似乎才是我們當持守的目標。 
思想	你今天的事奉很成功嗎？若是，請細心思想亞撒晚年的人生片段。也求神賜你「虛心」來閱讀這段經文。 
 
深化改革（歷代志下十七 1~19） 
亞撒晚年離棄神，導致國家低落不安，但到了其兒子約沙法作王後，形勢便逐漸轉過來。 
•	靠神建立王權(1~6) ——約沙法即位後，由於了解到南北國的軍事緊張局面，乃加強駐防工作。不過，與其父親亞撒不同，他乃靠神而作事。此外，他行人衛初行的道，暗指他沒有跟隨大衛後期所犯的罪。他除掉邱壇，就是去掉那些「將迦南人廟宇改裝為獻祭給耶和華」的拜祭場所。他也破除亞舍拉女神像。約沙法高興作這些事情，意指他為此等行動感到自豪，神乃堅立他所作的一切。 
•	教導神的話語(7~9) ——約沙法看重神的話語，乃積極推行教導事工，使神的道更深入地影響子民的心思意念： 
2.	教導的時間：在他作王的第三年。很大可能首二年是與父親共政，他父親亞撒因腳病不能親自參政。 
3.	教導的負責人：有宗教領袖(祭司、利未人)及平信徒(臣子)。 
4.	教導的內容和對象：教導摩西五經給各城的百姓。 
•	神大大的祝福王(10~19) ————約沙法忠心地發展宗教改革事工，神乃使他在國際威望上、工程上及軍力上得福。 
罪惡勢力極易捲土重來，除非我們肯在敬虔生活上不斷操練。約沙法定意推行改革事工不遺餘力，表明他絕不與罪惡妥協。我們也當有這股銳氣面對各種誘惑試探。然則，這股進深力量從何而來呢？是神的話。今天，我渴慕主的話語嗎？其實，基督徒成長得勝的過程，就是讓神的話語溶入我們生命裡頭的過程。每個基督徒都想蒙神大大賜福，但相信只有服從神話語者才能得著。 
祈禱 主啊，願我的生命可以被祢話語所革新。——《新舊約輔讀》 
 
向罪惡勢力妥協（歷代志下十八 1~11） 
約沙法曾經靠著神話語的力量，奮力消除國內極大的罪惡勢力。無奈，當他大享威榮時，他竟逐漸走向腐敗之路。 
•	失敗的第一步(1) ——北國亞哈王是一位敗壞的君王，他不行耶和華眼中看為正的事。但約沙法完全不計較，竟與亞哈建立姻親關係。他忘記了自己蒙神祝福乃因忠於神的緣故，結親的決定實屬不當。 
•	進一步與罪惡勢力結連(2~3) ——在歡樂的飲宴吃喝中，約沙法不再理會神的心意，決定與北國結盟，共同攻打基列的拉末。 
•	正邪力量醞釀鬥法(4~11) ——約沙法對這次軍事行動仍有點猶疑，他盼望從先知口中得到一些確據。北國四百位先知雖異口同聲說可以去，但他仍感不滿意；他的良知已亮起紅燈。結果，米該雅被召說預言。米該雅是位孤獨的先知，因他常說逆耳之忠言，與大眾期望的意見不相符。代表四百位先知的西底家，拿出兩個鐵角，象徵「有力量」，可以上去攻打拉末，取得完全的勝利。他們也相信，藉著此等預言和行動，有助於奪取勝利而歸。米該雅卻不同意他們的見解。 
列王的失敗經驗一次又一次的提醒我們，警醒是十分難學的功課。尤其當我們在屬靈事工取得一定的成果時，往往又在不知不覺中走回倒退妥協的道路上。我們的失敗多不會在朝夕之間發生，卻往往因在微小的事情上讓步所致。結果，妥協愈多，聽從神的聲音就越少。這不是說，神不願意再提醒我們何謂善何謂惡，其實，乃是我們聽而不聞而已！心妥協了，求問真先知之言又有何用呢！ 
思想	靜靜回想一下，這些日子有否與罪惡勢力妥協。 
真先知的勝利（歷代志下十八12~34） 
•	真先知權柄來源（12～13）——米該雅認為真先知之言有權柄，不在乎眾人怎樣説，乃在乎神怎樣說。 
•	真先知的話洞悉真相（14～22）——起初米該雅的話與其他四百位先知所說的相同，好像他與他們的立場一致。其實不然，他還看到其他先知所看不見的，就是以色列王（即牧人）將會死亡，戰爭只得結束，各人平安回家。米該雅還更深的看到靈界真相，就是導致亞哈敢於起兵攻打亞蘭王，乃因謊言的靈藉著四百位先知的口，引誘王踏上陣亡的腦路。這一切發生，都為神所准許，所以說「耶和華坐在寶座上，天上的萬軍侍立在他左右」（18），表明神掌管一切。終極上耶和華與這些有關連，所以經文在描述時將神放在主動策劃的位置上。 
•	否定真先知的話（23～27）——他們不相信米該雅的話。但米該雅指出，西底家終有一天逃避神的審判時，躲在屋內，就會想通了。「王的兒子」多是指一種與處理囚犯有關的王室職分。平安回來即安全返國的意思，也就是亞哈不相信自己會陣亡。 
•	真先知的話應驗了（28～34）——真先知之言經得起考驗。果然，「恰巧」的箭就成了「耶和華」的箭，亞哈蘭難逃劫數。 
當國家陷在罪惡中，宗教也極易腐敗。縱然維持了表面的宗教儀節及職分，但屬靈的實況卻是貧乏的，再不能聽到神的聲音及洞察到神的心意。我們處身在極世俗化的社會裡，也當小心。否則，我們一切的外表宗教儀節與職分盡歸徒然，不能在生命裡觸及靈界真相，更不用談明白神的旨意爲何。在混亂景況中洞悉神的心意及為神說話確是孤單的，但能作過現代的米該雅豈不是也常也是蒙福的人嗎！ 
祈禱	主呀，求你容我進到祢的深處，得見祢的權柄與榮光。——《新舊約輔讀》 
 
謹慎行主道（歷代志下十九 1~11） 
人誰過！知要緊的，乃是錯誤中醒悟過來。約沙發是一個好例子，他犯了過錯後，經反思而曉得人要謹慎活在主面前。 
•	王受譴責（1～3）——當約沙法安全的回到耶路撒冷，神就差遣先知來責備他，表示神絶不喜悅他在政治軍事上與亞哈聯合。幸而王受到的審判不太嚴重，神仍會祝福他。 
•	推行良好的審判工作（4～11）——經過失敗的教訓，王願意親自進入民間，從南到北，帶領人民歸向神。 
2.	設立區域審判官（5～7）——王從堅固城作開始，因這些地方受中央的影響較大，易於施行者這審判制度。約沙法需強調「謹慎」的功課，蓋他過去就曾不謹慎，胡亂與亞哈結盟，得罪了神。這些審判官只代表神行使權力，故在審判時，一定要持敬畏神的心去辦事，否則，就會偏離公正的道路。 
3.	設立上訴庭（8～11）——「以色列族長」（8） 意指猶大族長。約沙法在耶路撒冷設上訴庭，大凡各地不能圓滿解決的傻訴訟案，都交由這地方判決判斷。判斷的標準是神的律法，依著行才能避免得罪神。同時，神聖的個案（關乎聖殿敬拜）及世俗的個案（關乎政治外交）需要分開處理。 
太多時候，基督徒沒有謹慎行事，因而得罪神，招致神憤怒的臨到。要避免這種情況發生，我們必須敬畏神，這樣就不會隨意作出不討神喜悅的決定和行動。此外，接受清楚的教導也十分重要，有了真理的教導，我們才可以判斷正確、明辨是非，並可進一步行在主的道路上。弟兄姊妹，你願意如此活在神的面前嗎？ 
思想	當你做了錯事，除了認罪悔改外，你有否總結出一些教訓，來幫助你日後正確的行走前路？——《新舊約輔讀》 
 
靠神面對敵人（歷代志下二十1～19） 
本段經文可從四方面理解： 
•	國難臨近（1～2）——這次軍事攻擊是從南方來的，米烏尼人多是以東西珥山一帶的民族。隱．基底在死海西岸的中心地帶。 
•	禱告投靠神（3～13）——猶大國形勢險峻，但王沒有自恃，反倒以謙卑的心宣告禁食，全身投靠神。「新院」即外院或大院。約沙法以四大理求神幫助： 
2.	承認神是大能大力的主宰，祂有能力幫助他們（6）。 
3.	神曾應許賜福亞伯拉罕的後裔，居住這地不受干擾（7）。 
4.	神曾應許聆聽、成就從聖殿發出的呼求（8～9）。 
5.	敵人是無故的入侵（10～11） 。 
王乃聯同整體百姓向神仰望。 
•	神賜勝利的應許（14～17）——神藉利未人雅哈悉的口，應許猶大人必得勝。他們只要做三件事：不要懼怕、面對敵人毋需打仗、觀看神的作為。當然不是每一次遇敵都毋須採取軍事行動，但這次神級明確的如此吩咐。 
•	已經拜作回應18至19曉明他們深深的張信。 
人生不如意的事十常八九，我們無法逃避。基督徒要面對各種困難；基督教的信仰也是叫我們積極的面對苦難。我們被敵人惡人圍困，最大的盼望不在乎自己的能力，乃在乎大能的神。然則，我們有否藉禱告尋求神呢？人性的軟弱會使人懼怕即將臨到的痛苦和失敗。克服之道，不在於否定這種感受，或憑血氣力拼一次以求解決；乃是要我們信靠神，並認定勝敗之決定來自神。 
思想	有人説：「天助自助者」；也有人説：「天助無助者」。你的見解如何呢？ 
靠神全然得勝（歷代志下二十 20～37） 
•	信心的歌唱（20～21）——猶大子民順從神的吩咐，第二天便出來面對強敵。他們大有信心，以詩歌、等候及觀看來期待神的干預。王更扮演了祭司角色，用說話來激發會眾的信心。一般的爭戰重視軍隊的呼喊，但這時他們卻用頌讚來代替。 
•	神滅絕敵人（22～24）——不知何種緣故，他們的歌唱產生了一股殺敵的力量。敵軍彼此爭鬥，結果全軍覆亡。 
•	勝利帶來的結果（25～30）有四個： 
2.	得到大量財物珍寶，可見真是一次偉大的勝利。 
3.	猶大子民歡欣非常，不僅在戰場上如此，回到耶路撒冷也一樣，他們深深體會神實在是聽禱告的神。 
4.	列國懼怕猶大國，不敢隨意興兵犯境。 
5.	猶大國再次進入太平局面，沒有戰爭，這是神祝福的兆徵。 
•	約沙法一生的得與失（31～37）——總受來說，約沙法不失為一位敬虔的君王。然仍有兩件事有偏差：其一是部分百姓心不專一，繼續使用邱壇燒香獻祭；其二是王在晚年與以色列王聯盟，對神不忠，結果神毁壞其船隻，使之不能用作航海來表明祂的審判。 
神是信實的，祂說過要做的事，必然成就出來。我們當對神有信心，否則，怎能經歷勝利的時刻及分享勝利的成果呢！我們單有知識上的信心是不夠的，我們需要有行動上的信心。當日，約沙法所具備的信心行動是「大敵當前歌唱」；今日，我們的信心行動又是什麼呢？真正的信心，必會帶領我們穿越幽谷、熬煉而得勝，好使我們真正享受著喜樂、感恩，並神永遠長存的慈愛。 
祈禱	神啊，當我面對困境時，求祢最後仍使我嘗到得勝與歡欣。——《新舊約輔讀》 
 
乏善可陳的一生（歷代志下二十一 1~20） 
約蘭一生乏善可陳，因他是一位惡毒的君王。 
•	建立勢力（1～4）——他得國位，乃因他是長子，這暗示他在各方面的表現都不如其他兄弟。果然，為剷除異己分子，他狠心殺了眾兄弟及一些首領。 
•	心不正（5～7）——他與以色列國的政治及宗教關係緊密，以致不遵守神的律例典章，反倒向牛犢及巴力敬拜。神不立刻除滅他，乃因神極重視與大衛所立的約。 
•	離棄神的結果（8～17）——離棄神者，神必不保護他的國。這裡，我們看見以東人、立拿人、非利士人及阿拉伯人等起來抗拒猶大國的管治，或是成功地獨立，或是出兵攻擊，這都大大削弱了猶大國的勢力，也是神對約蘭的懲罰。此外，神使他患腸病，這是神對他個人直接的審判。有人以為以利亞不可能寫信給王，因按著列王紀下三11， 以利亞似在約沙法死前已離世。其實不一定，以利亞仍可能活至約蘭作王的早期，只因在約沙法晚年，他已甚少露面，好像死了一樣，故約沙法便找以利沙代替之。 
•	慘淡收場（18～20）——無人燒物件、無人思慕，就是指無人想他繼續活下去； 不與列王同葬，免玷污墳墓；這裡也不提及其他參考資料，似乎叫讀者不要再閱讀他的生平事蹟！ 
作為一個有信仰的人，相信最大的諷刺是一生所表現的，竟與所信的背道而馳。基督徒的名稱容易取得到，但基督的生命流露則不能蒙騙人。今天，你我是否只有基督徒的虛名而沒有實質呢？在神眼中，若我一生只落得乏善可陳的收場，我想我仍未真正相信過神。 
祈禱	主啊，教我行出祢喜悅的吩咐和教導。——《新舊約輔讀》 
 
惡勢力蔓延（歷代志下二十二 1～12） 
自從約沙法與亞哈建立姻親關係後，北國的罪惡勢力便一直干擾著南國王室。約蘭一生乏善可陳，其兒子亞哈謝也如此。 
•	亞哈謝登位（1～2）——通常君王登位不會只由耶路撒冷的居民擁立，應包括其他區域，但可能因處在非常時期才如此。登基時亞哈謝應為二十二歲，否則亞哈謝在他父親出生時已兩歲大！ 
•	繼續犯罪（3～6）——受了亞他利雅影響，亞哈謝行惡，罪惡勢力正不斷蔓延。王決定與亞哈兒子約蘭攜手爭戰，這事當然不為神所喜悅。基列的拉末地位重要，常成為列國必爭之地。 
•	審判突然臨到（7～9）——王對神不忠，神就藉著耶戶的手向亞哈謝施行審判。「突然死亡」就是結果。「出乎神」的意思就是一切在神引導下成就了。亞哈謝的惡運，正好與其祖父約沙法的忠貞成強烈對比。這裡也明顯不想提及其作惡的父親約蘭，反高舉了約沙法。 
•	篡位（10～12）——亞她利雅像其母耶洗別一樣，權力慾十分大。「剿滅」指殺掉所有男性繼承王位者。這裡沒有用傳統術語方式，介紹女王的掌權，可見她不屬正統君主。由於神重視與大衛所立的約，祂保存了大衛的後裔約阿施。 
我們不能輕看罪惡勢力，只要稍微一不慎，它就能吞食我們，使我們落在敵擋神的景況中。在日常生活裡，防止罪惡勢力侵佔我們的心靈的最好方法是「杜漸防微」，絲毫不讓它有機會坐大。此外，我們也當曉得，生命影響生命（無論好與不好）這道理是真確的。王受了其母親及他親戚的影響而陷在罪惡權勢下，這豈不提醒了我們當留意自己周圍的朋友親戚，究竟他們帶給我的是好還是壞的影響呢？ 
思想	你日常最多接觸的是那一類朋友？你感到他們對你的靈性生命有壞影響嗎？ 
 
重掌王權（歷代志下二十三 1～21） 
亞她利雅篡位後第七年，約阿施在耶何耶大協助下重掌王權。 
•	作王前的準備（1～7）——耶何耶大想到，先有實力作後盾才能取回政權，乃分別召見一些領袖及利未人，而且不限於居住耶路撒冷者，還包括猶大各城。立約就是訂定盟約，彼此同意，達致共識。他們最大的目標是恢復神的心意，讓大衛子孫作王，不准別人進耶和華的殿，目的是保護王免受殺害。 
•	正式立王（8～11）——王正式出來接受冠冕。「戴上冠冕」象徵王將自己獻給神，願按神的律法管治子民。「律法書」也可譯作「見證書」，就是指王每天要閱讀內裡的見證，叫他要守約、敬畏神、行律法等。「膏」是將油澆灌在頭上，象徵神揀選他作王。 
•	除掉罪魁禍首（12～15）——就是殺死亞她利雅。「柱旁」是指波阿斯柱或雅斤柱。王站在這裡，是敬拜時的特定位置。女王說反了、反了，從她眼中看確是造反，但從原來權力看卻不是。不在耶和華殿裡殺她，是不想玷污聖殿。 
•	進行改革（16～21） ——新的行動包括同心在神面前獻心、除偶像、重建敬拜生活及讓全國都尊約阿施為王。「安靜」是神賜給忠心者的福分。 
神喜悅祂的旨意行在地上，然罪惡勢力一時得逞，但終久必被除掉。在這個逆轉的過程中，基督徒可扮演什麼角色呢？我想我們必須如耶何耶大一樣，曉得並堅持神的心意，又把握良機讓它展現在地上。「重掌王權」意味著神與其子民的關係再次恢復。今天，我為「神人關係相通」的事工又擺上多少呢？ 
思想	面對教會信徒種種衰敗及俗世的生活表現，你曾作過何種改善與努力？——《新舊約輔讀》 
 
重修聖殿（歷代志下二十四1～16） 
有關約阿施的經文不多，因他不大忠心。然他也有善行，就是重修聖殿。這裏「神的殿」一詞出現了十多次。 
•	家庭與政治的情況（1～3）——約阿施作王後，蒙神祝福，生兒養女，與先前他自己為孤兒的苦況大大不同。王願意行耶和華眼中看為正的事，可惜，只限耶何耶大在世時才如此。這暗示了日後態度有改變。 
•	修殿事工遇困難（4～7）——這時敬拜生活已恢復，無奈聖殿仍有損壞，需要修理。王決心改善，但他沒有出錢，也沒有向利未人直接收取款項，乃是呼籲子民自由奉獻。不過，可能利未人感到出外募捐似不是他們分內的工作，反應不大好。 
•	修殿事工的完成（8～14）——王採取新募捐方法，就是將捐獻櫃放在殿門外，困難就解決了，修殿工程也得以完成。櫃放在門外，乃因百姓不能進入內院。「捐院」即捐滿的意思。百姓繼續忠心事奉神，但經文點出只限耶何耶大在世的時候，表明他們對神的心並不完全。 
•	耶何耶大逝世（15～16）——他一生為神重用，死時與王同葬，是極高的榮譽。他死時一百三十歲，較摩西、亞倫及約瑟還高。在以色列人心目中，司壽乃是神的祝福。 
我們需要重視敬拜生活，這不單指重視儀節的進行，也包括教會建築物及有關設備。我們對這些事物的態度，反映了是否樂意事奉神。不過，最重要的，還是我們是不是自發的敬畏尊重神，抑或只是受外在環境所逼才如此。王與百姓敬拜的心似都不是發乎百分百愛神的心，環境一變，他們的心也就隨之改變，這是有信仰者的悲劇。 
祈禱	神啊，求祢光照我的心，叫我曉得是否全心愛祢。——《新舊約輔讀》 
忘恩負義（歷代志下二十四17～27） 
耶何耶大去世後，猶大國的宗教政治生活立刻倒退過來。 
•	忘記神的厚恩（17～19）——神過去怎樣保守約阿施的性命，怎樣讓他重登王位，又祝福他的家庭，王全都忘記了。眾首領提出了背道的意見，他很快就同意並實行。不聽取神藉先知的多番警告。 
•	忘記耶何耶大的厚恩（20～22）——王離棄神後，自然也不將人放在眼內，縱使是恩人的兒子撒迦利亞來規勸，他竟忍心以兇殘手法對待。這是何等的諷刺：昔日他被保護之地，今卻成了他殺人之處；昔日恩人耶何耶大避免血濺聖殿，但王卻毫無忌憚的加以破壞，且流的竟是恩兒子的血。 
•	神施行審判（23～27）——面對這位忘恩負義的王，神不得不施行審判。只一年時間，懲罰就臨到猶大國。耶路撒冷雖沒有失守，但王的損失也極大。約阿施的生命也不保，很快便被背叛的臣僕殺掉。他雖被葬在大衛城，但經文清楚指出不能與列王同葬，這就表示他屬不義之王，他的死與耶何耶大的死，在意義上有極大的不同。這裡強調亞捫及摩押地，可能想藉此叫人知道，與外族建立婚姻關係（像猶大王一樣）是無好處的。 
人心是何等的兇殘與惡毒，在這件事上又再一次證明出來。今天，當我們享受主恩的時候，真需要主幫助我們永遠銘記在心中。指摘王的失敗倒是容易的，但我們何嘗不是常面臨這樣的試探！也許，我們需要間中撥些時間出來，讓自己安靜在神面前數算主恩，以至這種操練成為我們生活形態的一部分。這樣，才不會辜負神在我們身上施恩的作為。各位弟兄姊妹，你有這種感動媽嗎？ 
思想	中國人的文化傳統極之重視「報恩」的觀念，你認為它與聖經的教導有沒有共通之處？——《新舊約輔讀》 
 
心不專誠的鑒戒（歷代志下二十五 1～16） 
行為是生活的重要事，心思更是生活的重要事！ 
亞瑪謝行耶和華眼中看為正的事： 
2.	他照摩西律法書的教導，為父報仇而不濫殺無辜（3～4）。 
3.	他接受神人的忠告，撤走以色列十萬軍兵（6～10）。 
在日常生活中，神以書卷的記載教導我們，故我們要有每日讀經時間，研讀神的話語，並遵行其中的教訓。同樣神也使用祂僕人的宣講，我們領受了，也要切實執行！ 
這種每日每週的操練，是每個基督徒屬靈生命的需要，恒守的人，心靈必能茁壯成長。 
亞瑪謝雖行耶和華眼中看為正的事，但這不表示他是全人，因他「心不專誠」！ 
他看重金錢，並貪愛金錢。在撤回以色列十萬軍兵時，他關注「那一百他連得銀子」怎麼樣（9）。及至撤走軍兵，他卻不將當給的分予人，致惹怒了以色列人（10）。 
他戰勝以後，心高氣傲，也就敬拜偶像去了（14）！自大的人，必不敬拜真神，因為他自以為義，也自以為是。 
行為上的操守固然重要，但心靈的操練更不可忽略：「心懷二意的人哪，要清潔你們的心！」（雅四8） 
在當今的世代，金錢和自我常是我們信仰上很大的考驗，你曾經歷這些試探嗎？你又怎樣強壯自己的靈命，勝過金錢、自我的迷惑和衝擊呢？ 
思想	心思意念真是這麼重要嗎？為什麼聖經要多番提及？「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」（箴四23）——《新舊約輔讀》 
心高氣傲的收場（歷代志下二十五 17~28） 
有之於內必形於外！ 
亞瑪謝心高氣傲，連耶和華獨一真神他也放下，又豈會將以色列國放在眼內？ 
自高自大的人，仇恨相爭的心必重，眼中無人、目中無神，必然希望獨步宇內。「我們二人相見於戰場！」（17） 
約阿施點出亞瑪謝的弱點，就是「心高氣傲」。其實，彼此共存，生活在太平日子豈不好，何必殺戮於戰場之上呢？蒺藜豈配得上香柏樹，為何要苦苦相逼，而遭野獸踐踏呢？ 
一個連神的話也不肯聽從的人，又怎能接納忠告？於是，一個人的心高氣傲引致族人受苦、國家受苦。亞瑪謝被擒、耶路撒冷城牆被毁、神殿的一切金銀器皿被奪、王宮的財寶被拿去，並有人成了人質。一人作孽，全國蒙受苦難，何苦由來！ 
多少時候，我們總是偏執個人的成見，為報復而生活，為戰勝別人而生活，這都是心高氣傲在背後作崇。箴言明證：「驕傲在敗壞以先；狂心在跌倒之前。」（箴十六18）  
亞瑪謝初時守神誡命，蒙恩得力；但後來離棄耶和華，眾叛親離，並被人背叛，逃亡而被殺於路上（27），真是叫人嘆息！ 
「但各人被試探，乃是被自己的私慾牽引誘惑的，私慾既懷了胎，就生出罪來； 罪既成長，就生出死來。」（雅一14～15） 
祈禱	求主賜我謙卑的心，叫我懂得過尊主為大的生活。——《新舊約輔讀》 
 
才略與生命（歷代志下二十六 1～23） 
在南國諸王中，烏西雅是最具才略的君王： 
•	他敬拜真神（5） ， 
•	他征服四鄰（6～8）， 
•	他修築軍事設施（9）， 
•	他添設農業裝備（10）， 
•	他設立軍隊階級（11～13）， 
•	他設軍隊器械（14～15）。 
烏西雅是一位政治、軍事、經濟的專才，他的執政帶來南國一片美麗的憧憬，昔日大衛和所羅門的光輝似乎是指日可待了。 
但烏西雅的成功，並不全然是他的才略，最重要的因素，是他得了「非常的幫助」（15）。這非常的幫助不是從人的本能來的，而是天上的耶和華使他亨通（5）！ 
有些人不能遭挫敗，一遇挫敗，就放下信仰；有些更不能成功，一旦成功，便把救主忘記。烏西雅既強盛起來，也就心高氣傲，干犯耶和華的誡命，上殿燒香了。 
君王的職事是負責國家行政事務，祭司的職事是處理聖殿事務。掃羅王已於早前犯了禍而成了鑒戒，現在的烏西亞又漠視神的法則，公然向八十位勇敢難攔阻他的祭司發怒，神的刑罰隨即臨到他——「額上忽然發出大痲瘋」（19）。 
一代英雄得此下場，實在令人三炭！才略成為他的試金石，我們在事奉上或有些微可誇之處，但豈能不謹慎小心？求主憐憫我們，使用我們！ 
當這一代英雄駕崩之際，神的心意卻在一位青年人的身上開啟，但他的事奉不是在於才略，而是在於從上頭來的力量。 
祈禱	求主除去我的驕傲，賜我一顆謙卑的心。——《新舊約輔讀》 
 
美中不足的憾事（歷代志下二十七1～9） 
約坦行耶和華眼中看為正的事！ 
2.	他愛護神的殿宇，建立耶和華殿的上門（3）。 
3.	他忠於君王職守，為國家設置屏障，保護國民（4）。 
4.	他是勇於的戰士，戰勝亞捫人，並得著他們每年的進貢（5）。 
5.	他行為正直，遵守正道，得神喜悅，以致國勢日漸強盛（6）。 
人生的缺憾是否必然的呢？約坦實在有其優點、被神稱讚之處；然而，約坦「只是不人耶和華的殿」（2）。詩人說：「萬軍之耶和華啊，祢的居所何等可愛！我羨慕渴想耶和華的院宇；我的心腸，我的肉體向永生神呼籲⋯⋯祢是我們的盾牌；求祢垂顧看祢受膏者的面！在祢的院宇住一日，勝似在別處住千年；寧可在我神殿中看門，不願住在惡人的帳棚裏。」（詩八十四1～2，9～10） 
聖經中沒有解釋約坦為什麼不入耶和華的殿，但記述了他一生中「美中不足的憾事」；同樣地，有一些信徒也不入耶和華的殿，他們不在神的家敬拜，不在神的家團契，不在神的家事奉。他們是基督徒，卻不是一名負責任的會友。可能的原因很多，或是歷史的因素，或是客觀的難處。但不入耶和華的殿，不享受完全聖潔的基督徒生命，就是人生的損失，也就是你個人的過失！ 
人生的缺憾不是必然的，詩人說：「靠祢有力量、心中想往錫安大道的，這人便為有福！他們經過「流淚浴」，叫這谷變為泉源之地；並有秋雨之福蓋滿了全谷。他們行走、力上加力，各人到錫安朝見神。」（詩八十四5～7） 
思想	人生的缺憾是否必然？——《新舊約輔讀》 


爭戰前的寶訓（歷代志下十三1~12）  
雖然在其他書卷記載了亞比雅的罪行,但在這裏則突出他的優點。亞比雅像是位作先知的，他在爭戰前說了番感人的話。 
•	猶大與以色列爭戰(1~3) ——在實力上顯然有分別,以色列的八十萬勇士佔盡了優勢。 
•	大衛王朝的正統性(4~8a) ——亞比雅的講話，第一點在指出神是站在大衛王朝一方。神是與大衛立誓約,意思是一個永久的承諾，是永遠有效的約。耶羅波安及跟從他的匪徒不服從大衛的統治是不當的。這樣作，不僅抗拒正統的王，也是敵擋神的表現。洗瑪臉山可能在伯特利南端、猶大與以色列的邊界上。 
•	耶路撒冷是聖潔之地(8b~12) ——亞比雅進步指出，只有南國耶路撒冷才是真正的宗教中心。北國的宗教腐敗，敬拜偶像，又隨便任用不合律法要求的人作人作祭司，這是離棄神的表現。相反，南國則按著律法要求進行各種儀節，是遵守神誡命的表現。最後，亞比雅直接向以色列人呼籲，叫他們回轉合一，不要與南國爭戰，不要忘記耶和華也是他們列祖的神。 
每位基督徒當處劣勢時都要仔細思量這番話。從人的角度看，我們可能是少數失勢分子；但假若有神同在，其實我們卻是「多數得勢」分子呢！神必因基督所成就的約繼續護衛我們，叫我們膽壯，又叫我們勇於面對前頭艱苦的歲月。 
當然，我們要問自己，我們仍有樂意事奉神的心嗎？有否按神的指引行事呢？否則，道路不亨通似乎不是神故意與我們為難，乃是我們沒有走在真理道路所得的結果而已。 
思想	你試過為真理奮鬥而落在孤單的處境中嗎？你的心路歷程怎樣？——《新舊約輔讀》 
倚靠神必得勝（歷代志下十三 13～12） 
亞比雅的一番話未能改變交戰的景況。耶羅波安決心採取軍事行動來定高下。 
雖然北國軍力較強，佈陣也較好，前呼後應，但神卻使他們敗在亞比雅的手下。猶大祭司「吹號」（14），象徵耶和華進入戰爭中。猶大人「吶喊」（15） ，表明以信心投靠神，且不是理論的信心，乃是有行動、有實踐的信心。 
以色列人「被制服」（18），這「被制服」一字與「自卑」相同，表明縱使耶羅波安先前不肯自卑，但終於他也要被神所折服而不得不「自卑」下來，接受最終的失敗。 
猶大人的勝利，至關鍵的因素不是別的，乃是「倚靠神」18節可算是整段經文的鑰節。 
這場爭戰影響深遠，從此耶羅波安一蹶不振，無復強盛。要或攻擊他，他就死了，意指一種突然的死亡。這是行惡者的收場，不順服神所得的結果。相反，亞比雅走順服神的道路，不僅是戰爭得勝，他也蒙神祝福，家庭妻兒眾多（21） 。 
在屬靈的爭戰上，基督徒應誇口甚麼呢？不是自己的知識、聰明或地位，乃是自己的軟弱，這樣才能得勝。 
當我們肯承認自己的無助、軟弱，我們就曉得依靠神，接受祂的能力和恩典；於是，我們就能真正剛強，打退惡魔、戰勝誘惑。 
這不是易學的功課，人好逞強的本性不易除掉，尤其是信主已久的基督徒，嘗過一些屬靈經歷。又懂得若干屬靈詞彙，就每每以為自己早已充分準備，靠己就必得勝。你我是這種人嗎？ 
思想	有人說基督教是「他力」（靠神得拯救）的宗教，而不是「自力」（靠己得拯救）的宗教，你同意嗎？若同意，你有貫徹始終走「他力」的道路嗎？——《新舊約輔讀》 
尋求神的結果（歷代志下十四 1~15） 
羅波安與亞比雅聯合統治大國達二十年時間，但繼位的亞撒的統治期卻有四十一年之久。由於亞撒敬虔事奉，促使國家有良好發展，這裏也用了極多篇幅來描述他的生平事蹟。 
•	尋求神使國家太平(1~8) ———這裏清楚指出,宗教與政治有密切關係。當王帶領人民尋求神，守律法誡命，又進行宗教改革，除掉偶像，神就在國家政治及社會建設上使猶大國蒙福，享受四境平安的福分，又有智慧力量建造城牆。「尋求神」這主題十分重要，這一章及接著之兩章都指出這是國家轉變的關鍵。邱壇是指迦南人建給外邦神的壇，那裏會進行一些淫褻的禮儀；柱像是獻給巴力神的；而木偶則與生育萬物的女神有關。 
•	仰賴神使戰爭得勝(9~15) ——尋求神的人自然會仰賴依靠神，而在急難中更是如此。凡事依靠神的人，縱然力量單薄，也可得勝。亞撒王向神的呼求，具體地表達了這個心聲。根據史學家考證，這次入侵可能發生在 900~897 B.C. 之間。古實人被打敗，不能再強盛，就是他們從此之後沒有鬥志爭戰。神使猶大國獲得徹底的勝利：猶大軍隊可乘勝追擊，甚至進城擄掠財物，然後才班師回朝。 
基督徒的人生是爭戰的人生，但意思不是與人爭鬥，乃是因天天都會面對各種試探與陷阱，若不以爭戰的心志去克服，就必失敗。爭戰得勝的要訣在那裏呢？是仰賴依靠神。我們切勿以為「己」的力量很大，面對罪惡勢力，「己」發揮的能力就算不得甚麼了。我們要仰賴神，自當尋求主的面。只有與主的關係打通了，遇到難處時才能奮力迎對。 
思想	即使你天天在社會圈子內拼命幹活，又在教會圈子內拼命事奉，但是否總感到失敗多於成功，沮喪多過快樂？你可曾想過或許皆因你從來沒有真正尋求神？——《新舊約輔讀》 
奮力從事改革（歷代志下十五 1~19） 
亞撒即位後已進行宗教革新工作，但他未見深廣，因此，神就藉著戰勝古實王事件鼓勵他繼續努力。 
•	鼓勵的信息(1~7) ——亞撒利雅在神的靈感動下，大膽準確的傳揚神的話。亞撒利雅的背景資料極稀少，但其姓名意指「神曾幫助」，在這裏卻富積極意義。信息可分三部分：第一部分指出神與人的條件式關係：人若忠於神，神必同在(2)；第二部分從救恩歷史裏舉出例證，來說明這事實：離棄神招致失敗和悲劇，忠於神則帶來勝利和福氣。這裏所描述的是士師時代。第 3、5並6 節指出當日受神懲罰的情況，第 4 節則在說明，人只要回轉尋求神，就可恢復正常和好的關係；第三部分則是勉勵的話，呼籲亞撒王繼續奮力下去，推動改革事工（7）。「你們」是非常強烈的個人化字眼，用以加強王及眾民積極回應的心。 
•	奮力革新（8～19）——亞撒的工作從各方面展開，包括了除掉偶像、修建聖典、帶領子民守約、貶太后及奉獻金銀器皿等。眾民於亞撒十五年三月聚集在耶路撒冷，乃為要慶祝五旬節。不尋求神者必被治死，這不是嚴厲，摩西律法早已申明（申十三6～10），亞撒一生誠實，直至亞撒三十五年止。其後，他跌倒了。 
今日教會面對荒涼景況，我們若要推行革新工作，人人就必須奮興起來。靠著聖靈的感動及領受激發人心的信息，相信是極好的開始。可惜今日，我們很少見到當代的「亞撒利雅」。我們也忽略了，外在的改革工作是必須有內裡生命、靈性的更新支持才能成功展開。弟兄姊妹，讓我們都一同謙卑地到主前，求祂先以祂的名和信息，來感動及激發我們的心。 
思想	你常感到今日教會陷入悶局、困境嗎？你常感到自己無力面對今日教會低落的景況嗎？——《新舊約輔讀》 
 
晚節不保（歷代志下十六1～14） 
亞撒曾奮力為神作工，使國家子民行在正道上。可惜，他沒有堅持到底。在位第三十六年，他跌倒了。 
•	靠軍力解決國家危機(1~6) ——拉瑪在耶路撒冷北十公里之處。以色列王修築拉瑪，欲切斷猶大國的通路。亞撒本可藉此機會，重新仰望神，得著奇蹟般的拯救，就像從前一樣。但他沒有如此，他投靠亞蘭王便哈達，以金銀促使亞蘭王在以色列之北展開另一戰線。結果，巴沙在不能兩面兼顧下，乃停止修築拉瑪。 
•	先知的責備(7~10) ——先見哈拿尼清楚指出，亞撒在這些事情上顯得愚昧，他對神失去信心，此後國家不再四境平安，反有爭戰。若當時亞撒投靠神，不單可征服以色列，也可攻陷亞蘭國。但因他依靠別國軍力，這事不成了，亞蘭王的軍兵就脫離了他的手。亞撒不獨沒有悔改，更將先見下在監裡，又虐待那些站在先見一方的人民。 
•	悲慘收場(11~14) ——王反叛神，直到死亡時也沒有悔改。他腳上的病，不能使他反思己過。他也只向醫生尋求醫治，沒有尋求耶和華幫助。尋找醫生本身不一定錯，但亞撒的錯則在於他再不理會神。王死後，國家按著當時習俗將他下葬。 
箴言說得對：「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」(箴四23)亞撒晚年沒有保守自己的心，導致他不再倚靠神，結果晚節不保，令人惋惜！我們作基督徒真要求神憐憫，保守我們一生行在主道上。一時的熱心未嘗沒有價值，但主卻要求我們熱心的為祂活一生。一時的得勝縱然令人興奮，然而一生的得勝，似乎才是我們當持守的目標。 
思想	你今天的事奉很成功嗎？若是，請細心思想亞撒晚年的人生片段。也求神賜你「虛心」來閱讀這段經文。 
 
深化改革（歷代志下十七 1~19） 
亞撒晚年離棄神，導致國家低落不安，但到了其兒子約沙法作王後，形勢便逐漸轉過來。 
•	靠神建立王權(1~6) ——約沙法即位後，由於了解到南北國的軍事緊張局面，乃加強駐防工作。不過，與其父親亞撒不同，他乃靠神而作事。此外，他行人衛初行的道，暗指他沒有跟隨大衛後期所犯的罪。他除掉邱壇，就是去掉那些「將迦南人廟宇改裝為獻祭給耶和華」的拜祭場所。他也破除亞舍拉女神像。約沙法高興作這些事情，意指他為此等行動感到自豪，神乃堅立他所作的一切。 
•	教導神的話語(7~9) ——約沙法看重神的話語，乃積極推行教導事工，使神的道更深入地影響子民的心思意念： 
2.	教導的時間：在他作王的第三年。很大可能首二年是與父親共政，他父親亞撒因腳病不能親自參政。 
3.	教導的負責人：有宗教領袖(祭司、利未人)及平信徒(臣子)。 
4.	教導的內容和對象：教導摩西五經給各城的百姓。 
•	神大大的祝福王(10~19) ————約沙法忠心地發展宗教改革事工，神乃使他在國際威望上、工程上及軍力上得福。 
罪惡勢力極易捲土重來，除非我們肯在敬虔生活上不斷操練。約沙法定意推行改革事工不遺餘力，表明他絕不與罪惡妥協。我們也當有這股銳氣面對各種誘惑試探。然則，這股進深力量從何而來呢？是神的話。今天，我渴慕主的話語嗎？其實，基督徒成長得勝的過程，就是讓神的話語溶入我們生命裡頭的過程。每個基督徒都想蒙神大大賜福，但相信只有服從神話語者才能得著。 
祈禱 主啊，願我的生命可以被祢話語所革新。——《新舊約輔讀》 
 
向罪惡勢力妥協（歷代志下十八 1~11） 
約沙法曾經靠著神話語的力量，奮力消除國內極大的罪惡勢力。無奈，當他大享威榮時，他竟逐漸走向腐敗之路。 
•	失敗的第一步(1) ——北國亞哈王是一位敗壞的君王，他不行耶和華眼中看為正的事。但約沙法完全不計較，竟與亞哈建立姻親關係。他忘記了自己蒙神祝福乃因忠於神的緣故，結親的決定實屬不當。 
•	進一步與罪惡勢力結連(2~3) ——在歡樂的飲宴吃喝中，約沙法不再理會神的心意，決定與北國結盟，共同攻打基列的拉末。 
•	正邪力量醞釀鬥法(4~11) ——約沙法對這次軍事行動仍有點猶疑，他盼望從先知口中得到一些確據。北國四百位先知雖異口同聲說可以去，但他仍感不滿意；他的良知已亮起紅燈。結果，米該雅被召說預言。米該雅是位孤獨的先知，因他常說逆耳之忠言，與大眾期望的意見不相符。代表四百位先知的西底家，拿出兩個鐵角，象徵「有力量」，可以上去攻打拉末，取得完全的勝利。他們也相信，藉著此等預言和行動，有助於奪取勝利而歸。米該雅卻不同意他們的見解。 
列王的失敗經驗一次又一次的提醒我們，警醒是十分難學的功課。尤其當我們在屬靈事工取得一定的成果時，往往又在不知不覺中走回倒退妥協的道路上。我們的失敗多不會在朝夕之間發生，卻往往因在微小的事情上讓步所致。結果，妥協愈多，聽從神的聲音就越少。這不是說，神不願意再提醒我們何謂善何謂惡，其實，乃是我們聽而不聞而已！心妥協了，求問真先知之言又有何用呢！ 
思想	靜靜回想一下，這些日子有否與罪惡勢力妥協。 
真先知的勝利（歷代志下十八12~34） 
•	真先知權柄來源（12～13）——米該雅認為真先知之言有權柄，不在乎眾人怎樣説，乃在乎神怎樣說。 
•	真先知的話洞悉真相（14～22）——起初米該雅的話與其他四百位先知所說的相同，好像他與他們的立場一致。其實不然，他還看到其他先知所看不見的，就是以色列王（即牧人）將會死亡，戰爭只得結束，各人平安回家。米該雅還更深的看到靈界真相，就是導致亞哈敢於起兵攻打亞蘭王，乃因謊言的靈藉著四百位先知的口，引誘王踏上陣亡的腦路。這一切發生，都為神所准許，所以說「耶和華坐在寶座上，天上的萬軍侍立在他左右」（18），表明神掌管一切。終極上耶和華與這些有關連，所以經文在描述時將神放在主動策劃的位置上。 
•	否定真先知的話（23～27）——他們不相信米該雅的話。但米該雅指出，西底家終有一天逃避神的審判時，躲在屋內，就會想通了。「王的兒子」多是指一種與處理囚犯有關的王室職分。平安回來即安全返國的意思，也就是亞哈不相信自己會陣亡。 
•	真先知的話應驗了（28～34）——真先知之言經得起考驗。果然，「恰巧」的箭就成了「耶和華」的箭，亞哈蘭難逃劫數。 
當國家陷在罪惡中，宗教也極易腐敗。縱然維持了表面的宗教儀節及職分，但屬靈的實況卻是貧乏的，再不能聽到神的聲音及洞察到神的心意。我們處身在極世俗化的社會裡，也當小心。否則，我們一切的外表宗教儀節與職分盡歸徒然，不能在生命裡觸及靈界真相，更不用談明白神的旨意爲何。在混亂景況中洞悉神的心意及為神說話確是孤單的，但能作過現代的米該雅豈不是也常也是蒙福的人嗎！ 
祈禱	主呀，求你容我進到祢的深處，得見祢的權柄與榮光。——《新舊約輔讀》 
 
謹慎行主道（歷代志下十九 1~11） 
人誰過！知要緊的，乃是錯誤中醒悟過來。約沙發是一個好例子，他犯了過錯後，經反思而曉得人要謹慎活在主面前。 
•	王受譴責（1～3）——當約沙法安全的回到耶路撒冷，神就差遣先知來責備他，表示神絶不喜悅他在政治軍事上與亞哈聯合。幸而王受到的審判不太嚴重，神仍會祝福他。 
•	推行良好的審判工作（4～11）——經過失敗的教訓，王願意親自進入民間，從南到北，帶領人民歸向神。 
2.	設立區域審判官（5～7）——王從堅固城作開始，因這些地方受中央的影響較大，易於施行者這審判制度。約沙法需強調「謹慎」的功課，蓋他過去就曾不謹慎，胡亂與亞哈結盟，得罪了神。這些審判官只代表神行使權力，故在審判時，一定要持敬畏神的心去辦事，否則，就會偏離公正的道路。 
3.	設立上訴庭（8～11）——「以色列族長」（8） 意指猶大族長。約沙法在耶路撒冷設上訴庭，大凡各地不能圓滿解決的傻訴訟案，都交由這地方判決判斷。判斷的標準是神的律法，依著行才能避免得罪神。同時，神聖的個案（關乎聖殿敬拜）及世俗的個案（關乎政治外交）需要分開處理。 
太多時候，基督徒沒有謹慎行事，因而得罪神，招致神憤怒的臨到。要避免這種情況發生，我們必須敬畏神，這樣就不會隨意作出不討神喜悅的決定和行動。此外，接受清楚的教導也十分重要，有了真理的教導，我們才可以判斷正確、明辨是非，並可進一步行在主的道路上。弟兄姊妹，你願意如此活在神的面前嗎？ 
思想	當你做了錯事，除了認罪悔改外，你有否總結出一些教訓，來幫助你日後正確的行走前路？——《新舊約輔讀》 
 
靠神面對敵人（歷代志下二十1～19） 
本段經文可從四方面理解： 
•	國難臨近（1～2）——這次軍事攻擊是從南方來的，米烏尼人多是以東西珥山一帶的民族。隱．基底在死海西岸的中心地帶。 
•	禱告投靠神（3～13）——猶大國形勢險峻，但王沒有自恃，反倒以謙卑的心宣告禁食，全身投靠神。「新院」即外院或大院。約沙法以四大理求神幫助： 
2.	承認神是大能大力的主宰，祂有能力幫助他們（6）。 
3.	神曾應許賜福亞伯拉罕的後裔，居住這地不受干擾（7）。 
4.	神曾應許聆聽、成就從聖殿發出的呼求（8～9）。 
5.	敵人是無故的入侵（10～11） 。 
王乃聯同整體百姓向神仰望。 
•	神賜勝利的應許（14～17）——神藉利未人雅哈悉的口，應許猶大人必得勝。他們只要做三件事：不要懼怕、面對敵人毋需打仗、觀看神的作為。當然不是每一次遇敵都毋須採取軍事行動，但這次神級明確的如此吩咐。 
•	已經拜作回應18至19曉明他們深深的張信。 
人生不如意的事十常八九，我們無法逃避。基督徒要面對各種困難；基督教的信仰也是叫我們積極的面對苦難。我們被敵人惡人圍困，最大的盼望不在乎自己的能力，乃在乎大能的神。然則，我們有否藉禱告尋求神呢？人性的軟弱會使人懼怕即將臨到的痛苦和失敗。克服之道，不在於否定這種感受，或憑血氣力拼一次以求解決；乃是要我們信靠神，並認定勝敗之決定來自神。 
思想	有人説：「天助自助者」；也有人説：「天助無助者」。你的見解如何呢？ 
靠神全然得勝（歷代志下二十 20～37） 
•	信心的歌唱（20～21）——猶大子民順從神的吩咐，第二天便出來面對強敵。他們大有信心，以詩歌、等候及觀看來期待神的干預。王更扮演了祭司角色，用說話來激發會眾的信心。一般的爭戰重視軍隊的呼喊，但這時他們卻用頌讚來代替。 
•	神滅絕敵人（22～24）——不知何種緣故，他們的歌唱產生了一股殺敵的力量。敵軍彼此爭鬥，結果全軍覆亡。 
•	勝利帶來的結果（25～30）有四個： 
2.	得到大量財物珍寶，可見真是一次偉大的勝利。 
3.	猶大子民歡欣非常，不僅在戰場上如此，回到耶路撒冷也一樣，他們深深體會神實在是聽禱告的神。 
4.	列國懼怕猶大國，不敢隨意興兵犯境。 
5.	猶大國再次進入太平局面，沒有戰爭，這是神祝福的兆徵。 
•	約沙法一生的得與失（31～37）——總受來說，約沙法不失為一位敬虔的君王。然仍有兩件事有偏差：其一是部分百姓心不專一，繼續使用邱壇燒香獻祭；其二是王在晚年與以色列王聯盟，對神不忠，結果神毁壞其船隻，使之不能用作航海來表明祂的審判。 
神是信實的，祂說過要做的事，必然成就出來。我們當對神有信心，否則，怎能經歷勝利的時刻及分享勝利的成果呢！我們單有知識上的信心是不夠的，我們需要有行動上的信心。當日，約沙法所具備的信心行動是「大敵當前歌唱」；今日，我們的信心行動又是什麼呢？真正的信心，必會帶領我們穿越幽谷、熬煉而得勝，好使我們真正享受著喜樂、感恩，並神永遠長存的慈愛。 
祈禱	神啊，當我面對困境時，求祢最後仍使我嘗到得勝與歡欣。——《新舊約輔讀》 
 
乏善可陳的一生（歷代志下二十一 1~20） 
約蘭一生乏善可陳，因他是一位惡毒的君王。 
•	建立勢力（1～4）——他得國位，乃因他是長子，這暗示他在各方面的表現都不如其他兄弟。果然，為剷除異己分子，他狠心殺了眾兄弟及一些首領。 
•	心不正（5～7）——他與以色列國的政治及宗教關係緊密，以致不遵守神的律例典章，反倒向牛犢及巴力敬拜。神不立刻除滅他，乃因神極重視與大衛所立的約。 
•	離棄神的結果（8～17）——離棄神者，神必不保護他的國。這裡，我們看見以東人、立拿人、非利士人及阿拉伯人等起來抗拒猶大國的管治，或是成功地獨立，或是出兵攻擊，這都大大削弱了猶大國的勢力，也是神對約蘭的懲罰。此外，神使他患腸病，這是神對他個人直接的審判。有人以為以利亞不可能寫信給王，因按著列王紀下三11， 以利亞似在約沙法死前已離世。其實不一定，以利亞仍可能活至約蘭作王的早期，只因在約沙法晚年，他已甚少露面，好像死了一樣，故約沙法便找以利沙代替之。 
•	慘淡收場（18～20）——無人燒物件、無人思慕，就是指無人想他繼續活下去； 不與列王同葬，免玷污墳墓；這裡也不提及其他參考資料，似乎叫讀者不要再閱讀他的生平事蹟！ 
作為一個有信仰的人，相信最大的諷刺是一生所表現的，竟與所信的背道而馳。基督徒的名稱容易取得到，但基督的生命流露則不能蒙騙人。今天，你我是否只有基督徒的虛名而沒有實質呢？在神眼中，若我一生只落得乏善可陳的收場，我想我仍未真正相信過神。 
祈禱	主啊，教我行出祢喜悅的吩咐和教導。——《新舊約輔讀》 
 
惡勢力蔓延（歷代志下二十二 1～12） 
自從約沙法與亞哈建立姻親關係後，北國的罪惡勢力便一直干擾著南國王室。約蘭一生乏善可陳，其兒子亞哈謝也如此。 
•	亞哈謝登位（1～2）——通常君王登位不會只由耶路撒冷的居民擁立，應包括其他區域，但可能因處在非常時期才如此。登基時亞哈謝應為二十二歲，否則亞哈謝在他父親出生時已兩歲大！ 
•	繼續犯罪（3～6）——受了亞他利雅影響，亞哈謝行惡，罪惡勢力正不斷蔓延。王決定與亞哈兒子約蘭攜手爭戰，這事當然不為神所喜悅。基列的拉末地位重要，常成為列國必爭之地。 
•	審判突然臨到（7～9）——王對神不忠，神就藉著耶戶的手向亞哈謝施行審判。「突然死亡」就是結果。「出乎神」的意思就是一切在神引導下成就了。亞哈謝的惡運，正好與其祖父約沙法的忠貞成強烈對比。這裡也明顯不想提及其作惡的父親約蘭，反高舉了約沙法。 
•	篡位（10～12）——亞她利雅像其母耶洗別一樣，權力慾十分大。「剿滅」指殺掉所有男性繼承王位者。這裡沒有用傳統術語方式，介紹女王的掌權，可見她不屬正統君主。由於神重視與大衛所立的約，祂保存了大衛的後裔約阿施。 
我們不能輕看罪惡勢力，只要稍微一不慎，它就能吞食我們，使我們落在敵擋神的景況中。在日常生活裡，防止罪惡勢力侵佔我們的心靈的最好方法是「杜漸防微」，絲毫不讓它有機會坐大。此外，我們也當曉得，生命影響生命（無論好與不好）這道理是真確的。王受了其母親及他親戚的影響而陷在罪惡權勢下，這豈不提醒了我們當留意自己周圍的朋友親戚，究竟他們帶給我的是好還是壞的影響呢？ 
思想	你日常最多接觸的是那一類朋友？你感到他們對你的靈性生命有壞影響嗎？ 
 
重掌王權（歷代志下二十三 1～21） 
亞她利雅篡位後第七年，約阿施在耶何耶大協助下重掌王權。 
•	作王前的準備（1～7）——耶何耶大想到，先有實力作後盾才能取回政權，乃分別召見一些領袖及利未人，而且不限於居住耶路撒冷者，還包括猶大各城。立約就是訂定盟約，彼此同意，達致共識。他們最大的目標是恢復神的心意，讓大衛子孫作王，不准別人進耶和華的殿，目的是保護王免受殺害。 
•	正式立王（8～11）——王正式出來接受冠冕。「戴上冠冕」象徵王將自己獻給神，願按神的律法管治子民。「律法書」也可譯作「見證書」，就是指王每天要閱讀內裡的見證，叫他要守約、敬畏神、行律法等。「膏」是將油澆灌在頭上，象徵神揀選他作王。 
•	除掉罪魁禍首（12～15）——就是殺死亞她利雅。「柱旁」是指波阿斯柱或雅斤柱。王站在這裡，是敬拜時的特定位置。女王說反了、反了，從她眼中看確是造反，但從原來權力看卻不是。不在耶和華殿裡殺她，是不想玷污聖殿。 
•	進行改革（16～21） ——新的行動包括同心在神面前獻心、除偶像、重建敬拜生活及讓全國都尊約阿施為王。「安靜」是神賜給忠心者的福分。 
神喜悅祂的旨意行在地上，然罪惡勢力一時得逞，但終久必被除掉。在這個逆轉的過程中，基督徒可扮演什麼角色呢？我想我們必須如耶何耶大一樣，曉得並堅持神的心意，又把握良機讓它展現在地上。「重掌王權」意味著神與其子民的關係再次恢復。今天，我為「神人關係相通」的事工又擺上多少呢？ 
思想	面對教會信徒種種衰敗及俗世的生活表現，你曾作過何種改善與努力？——《新舊約輔讀》 
 
重修聖殿（歷代志下二十四1～16） 
有關約阿施的經文不多，因他不大忠心。然他也有善行，就是重修聖殿。這裏「神的殿」一詞出現了十多次。 
•	家庭與政治的情況（1～3）——約阿施作王後，蒙神祝福，生兒養女，與先前他自己為孤兒的苦況大大不同。王願意行耶和華眼中看為正的事，可惜，只限耶何耶大在世時才如此。這暗示了日後態度有改變。 
•	修殿事工遇困難（4～7）——這時敬拜生活已恢復，無奈聖殿仍有損壞，需要修理。王決心改善，但他沒有出錢，也沒有向利未人直接收取款項，乃是呼籲子民自由奉獻。不過，可能利未人感到出外募捐似不是他們分內的工作，反應不大好。 
•	修殿事工的完成（8～14）——王採取新募捐方法，就是將捐獻櫃放在殿門外，困難就解決了，修殿工程也得以完成。櫃放在門外，乃因百姓不能進入內院。「捐院」即捐滿的意思。百姓繼續忠心事奉神，但經文點出只限耶何耶大在世的時候，表明他們對神的心並不完全。 
•	耶何耶大逝世（15～16）——他一生為神重用，死時與王同葬，是極高的榮譽。他死時一百三十歲，較摩西、亞倫及約瑟還高。在以色列人心目中，司壽乃是神的祝福。 
我們需要重視敬拜生活，這不單指重視儀節的進行，也包括教會建築物及有關設備。我們對這些事物的態度，反映了是否樂意事奉神。不過，最重要的，還是我們是不是自發的敬畏尊重神，抑或只是受外在環境所逼才如此。王與百姓敬拜的心似都不是發乎百分百愛神的心，環境一變，他們的心也就隨之改變，這是有信仰者的悲劇。 
祈禱	神啊，求祢光照我的心，叫我曉得是否全心愛祢。——《新舊約輔讀》 
忘恩負義（歷代志下二十四17～27） 
耶何耶大去世後，猶大國的宗教政治生活立刻倒退過來。 
•	忘記神的厚恩（17～19）——神過去怎樣保守約阿施的性命，怎樣讓他重登王位，又祝福他的家庭，王全都忘記了。眾首領提出了背道的意見，他很快就同意並實行。不聽取神藉先知的多番警告。 
•	忘記耶何耶大的厚恩（20～22）——王離棄神後，自然也不將人放在眼內，縱使是恩人的兒子撒迦利亞來規勸，他竟忍心以兇殘手法對待。這是何等的諷刺：昔日他被保護之地，今卻成了他殺人之處；昔日恩人耶何耶大避免血濺聖殿，但王卻毫無忌憚的加以破壞，且流的竟是恩兒子的血。 
•	神施行審判（23～27）——面對這位忘恩負義的王，神不得不施行審判。只一年時間，懲罰就臨到猶大國。耶路撒冷雖沒有失守，但王的損失也極大。約阿施的生命也不保，很快便被背叛的臣僕殺掉。他雖被葬在大衛城，但經文清楚指出不能與列王同葬，這就表示他屬不義之王，他的死與耶何耶大的死，在意義上有極大的不同。這裡強調亞捫及摩押地，可能想藉此叫人知道，與外族建立婚姻關係（像猶大王一樣）是無好處的。 
人心是何等的兇殘與惡毒，在這件事上又再一次證明出來。今天，當我們享受主恩的時候，真需要主幫助我們永遠銘記在心中。指摘王的失敗倒是容易的，但我們何嘗不是常面臨這樣的試探！也許，我們需要間中撥些時間出來，讓自己安靜在神面前數算主恩，以至這種操練成為我們生活形態的一部分。這樣，才不會辜負神在我們身上施恩的作為。各位弟兄姊妹，你有這種感動媽嗎？ 
思想	中國人的文化傳統極之重視「報恩」的觀念，你認為它與聖經的教導有沒有共通之處？——《新舊約輔讀》 
 
心不專誠的鑒戒（歷代志下二十五 1～16） 
行為是生活的重要事，心思更是生活的重要事！ 
亞瑪謝行耶和華眼中看為正的事： 
2.	他照摩西律法書的教導，為父報仇而不濫殺無辜（3～4）。 
3.	他接受神人的忠告，撤走以色列十萬軍兵（6～10）。 
在日常生活中，神以書卷的記載教導我們，故我們要有每日讀經時間，研讀神的話語，並遵行其中的教訓。同樣神也使用祂僕人的宣講，我們領受了，也要切實執行！ 
這種每日每週的操練，是每個基督徒屬靈生命的需要，恒守的人，心靈必能茁壯成長。 
亞瑪謝雖行耶和華眼中看為正的事，但這不表示他是全人，因他「心不專誠」！ 
他看重金錢，並貪愛金錢。在撤回以色列十萬軍兵時，他關注「那一百他連得銀子」怎麼樣（9）。及至撤走軍兵，他卻不將當給的分予人，致惹怒了以色列人（10）。 
他戰勝以後，心高氣傲，也就敬拜偶像去了（14）！自大的人，必不敬拜真神，因為他自以為義，也自以為是。 
行為上的操守固然重要，但心靈的操練更不可忽略：「心懷二意的人哪，要清潔你們的心！」（雅四8） 
在當今的世代，金錢和自我常是我們信仰上很大的考驗，你曾經歷這些試探嗎？你又怎樣強壯自己的靈命，勝過金錢、自我的迷惑和衝擊呢？ 
思想	心思意念真是這麼重要嗎？為什麼聖經要多番提及？「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」（箴四23）——《新舊約輔讀》 
心高氣傲的收場（歷代志下二十五 17~28） 
有之於內必形於外！ 
亞瑪謝心高氣傲，連耶和華獨一真神他也放下，又豈會將以色列國放在眼內？ 
自高自大的人，仇恨相爭的心必重，眼中無人、目中無神，必然希望獨步宇內。「我們二人相見於戰場！」（17） 
約阿施點出亞瑪謝的弱點，就是「心高氣傲」。其實，彼此共存，生活在太平日子豈不好，何必殺戮於戰場之上呢？蒺藜豈配得上香柏樹，為何要苦苦相逼，而遭野獸踐踏呢？ 
一個連神的話也不肯聽從的人，又怎能接納忠告？於是，一個人的心高氣傲引致族人受苦、國家受苦。亞瑪謝被擒、耶路撒冷城牆被毁、神殿的一切金銀器皿被奪、王宮的財寶被拿去，並有人成了人質。一人作孽，全國蒙受苦難，何苦由來！ 
多少時候，我們總是偏執個人的成見，為報復而生活，為戰勝別人而生活，這都是心高氣傲在背後作崇。箴言明證：「驕傲在敗壞以先；狂心在跌倒之前。」（箴十六18）  
亞瑪謝初時守神誡命，蒙恩得力；但後來離棄耶和華，眾叛親離，並被人背叛，逃亡而被殺於路上（27），真是叫人嘆息！ 
「但各人被試探，乃是被自己的私慾牽引誘惑的，私慾既懷了胎，就生出罪來； 罪既成長，就生出死來。」（雅一14～15） 
祈禱	求主賜我謙卑的心，叫我懂得過尊主為大的生活。——《新舊約輔讀》 
 
才略與生命（歷代志下二十六 1～23） 
在南國諸王中，烏西雅是最具才略的君王： 
•	他敬拜真神（5） ， 
•	他征服四鄰（6～8）， 
•	他修築軍事設施（9）， 
•	他添設農業裝備（10）， 
•	他設立軍隊階級（11～13）， 
•	他設軍隊器械（14～15）。 
烏西雅是一位政治、軍事、經濟的專才，他的執政帶來南國一片美麗的憧憬，昔日大衛和所羅門的光輝似乎是指日可待了。 
但烏西雅的成功，並不全然是他的才略，最重要的因素，是他得了「非常的幫助」（15）。這非常的幫助不是從人的本能來的，而是天上的耶和華使他亨通（5）！ 
有些人不能遭挫敗，一遇挫敗，就放下信仰；有些更不能成功，一旦成功，便把救主忘記。烏西雅既強盛起來，也就心高氣傲，干犯耶和華的誡命，上殿燒香了。 
君王的職事是負責國家行政事務，祭司的職事是處理聖殿事務。掃羅王已於早前犯了禍而成了鑒戒，現在的烏西亞又漠視神的法則，公然向八十位勇敢難攔阻他的祭司發怒，神的刑罰隨即臨到他——「額上忽然發出大痲瘋」（19）。 
一代英雄得此下場，實在令人三炭！才略成為他的試金石，我們在事奉上或有些微可誇之處，但豈能不謹慎小心？求主憐憫我們，使用我們！ 
當這一代英雄駕崩之際，神的心意卻在一位青年人的身上開啟，但他的事奉不是在於才略，而是在於從上頭來的力量。 
祈禱	求主除去我的驕傲，賜我一顆謙卑的心。——《新舊約輔讀》 
 
美中不足的憾事（歷代志下二十七1～9） 
約坦行耶和華眼中看為正的事！ 
2.	他愛護神的殿宇，建立耶和華殿的上門（3）。 
3.	他忠於君王職守，為國家設置屏障，保護國民（4）。 
4.	他是勇於的戰士，戰勝亞捫人，並得著他們每年的進貢（5）。 
5.	他行為正直，遵守正道，得神喜悅，以致國勢日漸強盛（6）。 
人生的缺憾是否必然的呢？約坦實在有其優點、被神稱讚之處；然而，約坦「只是不人耶和華的殿」（2）。詩人說：「萬軍之耶和華啊，祢的居所何等可愛！我羨慕渴想耶和華的院宇；我的心腸，我的肉體向永生神呼籲⋯⋯祢是我們的盾牌；求祢垂顧看祢受膏者的面！在祢的院宇住一日，勝似在別處住千年；寧可在我神殿中看門，不願住在惡人的帳棚裏。」（詩八十四1～2，9～10） 
聖經中沒有解釋約坦為什麼不入耶和華的殿，但記述了他一生中「美中不足的憾事」；同樣地，有一些信徒也不入耶和華的殿，他們不在神的家敬拜，不在神的家團契，不在神的家事奉。他們是基督徒，卻不是一名負責任的會友。可能的原因很多，或是歷史的因素，或是客觀的難處。但不入耶和華的殿，不享受完全聖潔的基督徒生命，就是人生的損失，也就是你個人的過失！ 
人生的缺憾不是必然的，詩人說：「靠祢有力量、心中想往錫安大道的，這人便為有福！他們經過「流淚浴」，叫這谷變為泉源之地；並有秋雨之福蓋滿了全谷。他們行走、力上加力，各人到錫安朝見神。」（詩八十四5～7）
